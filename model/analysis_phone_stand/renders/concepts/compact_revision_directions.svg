<text x="34" y="48" class="title" >Compact phone stand — three directions to discuss</text>
<text x="34" y="80" class="body" >Keep V1’s compact visual idea; carry forward V2’s case, ring, cable and hand-adjustment requirements.</text>
<text x="34" y="110" class="body" >Same scale and 85 × 170 × 13 mm phone. Shown at 65°. Candidate angles: 50° / 65° / 75°.</text>
<text x="34" y="138" class="small" >Footprints are targets. Locks, accessory clearance, assembly and tapping stability remain unqualified.</text>
