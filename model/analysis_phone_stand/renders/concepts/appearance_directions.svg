<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
  <defs>
    <style>
      text {font-family: sans-serif; fill: #253643}
      .title {font-size: 29px; font-weight: 700}
      .label {font-size: 18px; font-weight: 600}
      .body {font-size: 17px}
      .small {font-size: 15px; fill: #596a74}
      .phone {fill: #edf2f5; fill-opacity: .7; stroke: #9baab5; stroke-width: 2; stroke-dasharray: 7 6}
      .frame {fill: #76938c; stroke: #44675e; stroke-width: 2}
      .brace {fill: none; stroke: #44675e; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round}
      .clear {fill: #f5b866; fill-opacity: .28}
      .pin {fill: #edf1f3; stroke: #61717e; stroke-width: 2}
      .desk {stroke: #bdc8ce; stroke-width: 2}
    </style>
  </defs>
  <rect width="1200" height="740" fill="#f6f7f5"/>
  <text x="44" y="47" class="title">Phone stand · two appearance directions</text>
  <text x="44" y="77" class="body">Concept sketches only · no dimensions, fit checks or mechanism qualification</text>
  <rect x="28" y="101" width="562" height="530" rx="22" fill="white"/>
  <rect x="610" y="101" width="562" height="530" rx="22" fill="white"/>
  <text x="52" y="140" class="label">A · SLIM OPEN EASEL</text>
  <text x="634" y="140" class="label">B · LOW SIDE SUPPORTS</text>
  <text x="52" y="169" class="small">Light outline, narrow rails, separate feet</text>
  <text x="634" y="169" class="small">Quiet silhouette, short side wings, rounded base</text>
  <!-- Front views. Faint phone references are deliberately diagrammatic. -->
  <rect x="105" y="198" width="164" height="259" rx="19" class="phone"/>
  <rect x="118" y="257" width="138" height="164" rx="18" class="clear"/>
  <path d="M108 254 Q108 244 118 244 L126 244 L126 449 L108 449 Z" class="frame"/>
  <path d="M248 244 L256 244 Q266 244 266 254 L266 449 L248 449 Z" class="frame"/>
  <path d="M93 451 Q93 442 102 442 L147 442 L147 456 L131 456 L131 470 L93 470 Z" class="frame"/>
  <path d="M227 442 L271 442 Q280 442 280 451 L280 470 L242 470 L242 456 L227 456 Z" class="frame"/>
  <path d="M102 478 L146 478 Q154 478 154 485 L154 491 L93 491 L93 485 Q93 478 102 478 Z" class="frame"/>
  <path d="M228 478 L271 478 Q280 478 280 485 L280 491 L219 491 L219 485 Q219 478 228 478 Z" class="frame"/>
  <circle cx="117" cy="448" r="5" class="pin"/>
  <circle cx="257" cy="448" r="5" class="pin"/>
  <line x1="77" y1="493" x2="297" y2="493" class="desk"/>
  <text x="115" y="519" class="small">Front, phone outlined</text>
  <!-- Side view A: an outboard triangular prop, not a central ring blocker. -->
  <path d="M342 450 L429 209 Q432 201 437 204 L445 207 L360 452 Z" class="phone"/>
  <path d="M348 449 L429 234" class="brace"/>
  <path d="M418 264 L505 482 L352 482" class="brace"/>
  <path d="M341 439 L360 445 L355 459 L337 453 Z" class="frame"/>
  <circle cx="351" cy="450" r="6" class="pin"/>
  <line x1="325" y1="493" x2="541" y2="493" class="desk"/>
  <text x="350" y="519" class="small">Side, outboard prop</text>
  <text x="52" y="561" class="body">More visible structure; potentially less material.</text>
  <text x="52" y="588" class="small">Prop and lock must stay outside accessory space.</text>
  <!-- Front B: short edge supports with a broad low foot. -->
  <rect x="687" y="198" width="164" height="259" rx="19" class="phone"/>
  <rect x="700" y="257" width="138" height="164" rx="18" class="clear"/>
  <path d="M688 375 Q688 363 700 363 L709 363 L709 450 L688 450 Z" class="frame"/>
  <path d="M829 363 L838 363 Q850 363 850 375 L850 450 L829 450 Z" class="frame"/>
  <path d="M679 451 Q679 442 688 442 L729 442 L729 457 L710 457 L710 470 L679 470 Z" class="frame"/>
  <path d="M809 442 L851 442 Q860 442 860 451 L860 470 L829 470 L829 457 L809 457 Z" class="frame"/>
  <path d="M673 478 L866 478 Q878 478 878 489 L878 493 L661 493 L661 489 Q661 478 673 478 Z" class="frame"/>
  <circle cx="698" cy="448" r="5" class="pin"/>
  <circle cx="840" cy="448" r="5" class="pin"/>
  <line x1="648" y1="495" x2="889" y2="495" class="desk"/>
  <text x="697" y="519" class="small">Front, phone outlined</text>
  <!-- Side B: low back contacts, most of phone back left empty. -->
  <path d="M923 450 L1010 209 Q1013 201 1018 204 L1026 207 L941 452 Z" class="phone"/>
  <path d="M932 448 L966 356 Q969 348 975 351 L982 354 L950 445 Z" class="frame"/>
  <path d="M977 363 L1068 478 L951 478" class="brace"/>
  <path d="M922 439 L941 445 L936 459 L918 453 Z" class="frame"/>
  <path d="M921 478 L1092 478 Q1103 478 1103 489 L1103 493 L910 493 L910 489 Q910 478 921 478 Z" class="frame"/>
  <circle cx="932" cy="450" r="6" class="pin"/>
  <line x1="898" y1="495" x2="1124" y2="495" class="desk"/>
  <text x="940" y="519" class="small">Side, low back contact</text>
  <text x="634" y="561" class="body">Less visible behind the phone; smaller back supports.</text>
  <text x="634" y="588" class="small">Contact height and tapping stiffness need review.</text>
  <rect x="44" y="656" width="22" height="18" rx="4" class="clear"/>
  <text x="76" y="671" class="small">Broad accessory-clearance intent, not a measured ring envelope</text>
  <text x="44" y="707" class="small">Both directions: softened edges · open charging path · stock hardware · positive hand-operated angle seating</text>
</svg>
