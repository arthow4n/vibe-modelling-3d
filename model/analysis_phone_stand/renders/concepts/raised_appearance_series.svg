<text x="30" y="785" class="small">*70 mm is provisional: illustrated allowance for about 30 mm of plug plus 35 mm of cable turn and 5 mm extra.</text>
<text x="30" y="813" class="small">Phone envelope: illustrative 170 × 85 × 13 mm at 60°. Amber: indicative 30 mm rear space, not a measured ring shape.</text>
<text x="30" y="839" class="small">Appearance study only. Hand locks are not detailed. Landscape clearance, cable fit and tapping stability still need CAD / physical review.</text>
