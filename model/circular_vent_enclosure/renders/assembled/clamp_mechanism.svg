<text x="719" y="344" font-size="15">15 mm open band stays clear</text>
<text x="719" y="368" font-size="13">Rim ends at 20 mm</text>
<text x="541" y="451" font-size="14">Three M3 screws seat the hood on the ring tabs.</text>
<text x="541" y="474" font-size="14">Undo those screws for cleaning; leave the clamp set.</text>
<text x="28" y="542" font-size="14">Schematic: not to scale. Steel screw supplies preload; broad PETG band supplies compliant contact.</text>
<text x="28" y="565" font-size="14">No holding-force rating is implied. Only a stationary, sufficiently strong rim may be gripped.</text>
