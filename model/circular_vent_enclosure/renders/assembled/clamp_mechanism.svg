<text x="841" y="272" font-size="14">Clamp tab</text>
<text x="841" y="297" font-size="14">Hood bearing land</text>
<text x="841" y="320" font-size="14">Captured M3 NUT</text>
<path d="M832 315H768" stroke="#263442"/>
<text x="669" y="363" font-size="14">ROOM side / solid shield farther below</text>
<path d="M597 309H705" stroke="#07816f" stroke-width="3" marker-end="url(#green)"/>
<text x="570" y="394" font-size="14">Side-load nuts before joining the parts.</text>
<text x="570" y="417" font-size="13">Small retaining lips hold them while screws are started.</text>
<text x="570" y="441" font-size="13">Section is schematic; nut entries lie along their CAD channels.</text>
<text x="28" y="510" font-size="17" font-weight="bold">Installation sequence</text>
<text x="28" y="540" font-size="15">1. Load nuts on the bench.  2. Join hood + clamp with rear M3 screws.  3. Fit unit; tighten M4 from +Y.</text>
<text x="28" y="570" font-size="14">Cleaning: loosen M4, remove the complete unit, then undo the rear M3 screws on the bench.</text>
<text x="28" y="606" font-size="13">Schematic and nominal hardware envelopes. Actual grip, tightening effort, print fit and creep behaviour remain physical tests.</text>
<text x="28" y="629" font-size="13">Print STEP/STL files contain only PETG parts. Hardware is shown only in the inspection views.</text>
</g></svg>
