<text x="26" y="419" font-size="14">M4 nut is on −Y; load it through the room-facing feed slot.</text>
<text x="26" y="443" font-size="13">Dashed blue is the projected hood outline, above this tool plane.</text>
<text x="26" y="464" font-size="13">The shaft runs below the skirt; the L-key elbow stays outside it.</text>
