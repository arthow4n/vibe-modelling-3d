<text x="52" y="477" font-size="14">0.8 mm split flange overlaps the rear hood mouth</text>
<text x="52" y="501" font-size="15">Geometric fit range: approximately Ø129–132 mm</text>
<text x="52" y="525" font-size="14">Actual grip, tightening effort and creep need a fit test.</text>
<text x="545" y="98" font-size="18" font-weight="bold">Section — one hood attachment</text>
