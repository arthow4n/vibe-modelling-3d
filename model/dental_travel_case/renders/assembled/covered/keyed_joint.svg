<path class="dim" d="M210 504H309"/>
<path class="leader" d="M210 452V514M309 452V514"/>
<text x="170" y="534" class="small">1.8 mm engagement</text>
<path class="leader" d="M76 548H140L205 348"/>
<text x="40" y="564" class="small">0.15 mm clearance at pocket bottom</text>
<text x="615" y="121" class="head">Through free spring: X = −12 mm</text>
<rect x="660" y="260" width="231" height="100" fill="#bf8958" stroke="#754e2e" stroke-width="2"/>
<rect x="913" y="220" width="66" height="180" fill="#bfddda" stroke="#344e5c" stroke-width="2"/>
<text x="713" y="317">Spring section</text>
<text x="1000" y="291" class="small">Facecap</text>
<path class="leader" d="M997 298H981"/>
<path class="dim" d="M891 433H913"/>
<path class="leader" d="M891 362V443M913 402V443"/>
<text x="735" y="467">0.40 mm free gap</text>
