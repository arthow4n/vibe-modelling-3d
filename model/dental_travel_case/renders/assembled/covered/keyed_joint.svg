<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs>
 <style>text{font-family:Arial,sans-serif;font-size:18px;fill:#23343f}.title{font-size:27px;font-weight:bold}.head{font-size:21px;font-weight:bold}.small{font-size:16px}.dim{stroke:#52707f;stroke-width:1.5;fill:none;marker-start:url(#a);marker-end:url(#a)}.leader{stroke:#52707f;stroke-width:1.5;fill:none}</style>
 <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10 5 0 0 0 10Z" fill="#52707f"/></marker>
</defs>
<rect width="1200" height="650" fill="#fafbfc"/>
<text x="25" y="39" class="title">Same scalloped grip · positive key drive · free spring</text>
<text x="25" y="70" class="small">Dimensioned sections through the model; cropped at top/bottom. Axial direction runs from body at left to outside at right.</text>
<rect x="20" y="90" width="555" height="485" rx="10" fill="white" stroke="#d4dfe4"/>
<rect x="595" y="90" width="585" height="485" rx="10" fill="white" stroke="#d4dfe4"/>
<text x="40" y="121" class="head">Through rigid hub key: X = +7.0 mm</text>
<path d="M78 150H309V217.5H201.75V382.5H309V450H78Z" fill="#7a97a7" stroke="#344e5c" stroke-width="2"/>
<path d="M309 150H397V450H309V377H215.5L210 371.5V228.5L215.5 223H309Z" fill="#bfddda" stroke="#344e5c" stroke-width="2"/>
<path d="M331 155V210M331 390V445" stroke="#528984" stroke-dasharray="4 4"/>
<text x="95" y="177" class="small">Wheel hub</text>
<text x="418" y="242" class="small">Facecap,</text>
<text x="418" y="264" class="small">spacer</text>
<text x="418" y="286" class="small">and key:</text>
<text x="418" y="308" class="small">one print</text>
<path class="leader" d="M418 320 352 337"/>
<path class="leader" d="M95 198H160L258 220"/>
