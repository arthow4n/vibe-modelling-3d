<text x="675" y="172" class="small">Spring moves in the wheel plane</text>
<text x="630" y="510" class="small">The spacer touches only the rigid hub.</text>
<text x="630" y="536" class="small">The cover stays clear of the flexible spring.</text>
<text x="25" y="605" class="small">CAD: keys block ±2° relative turn in 40 clearance/separation poses; removing keys removes that stop.</text>
<text x="25" y="632" class="small">Colours identify regions of the same printable PLA. Positive engagement is checked; printed torque capacity and wear remain unmeasured.</text>
