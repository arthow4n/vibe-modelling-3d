<text x="390" y="532" font-size="17">The concentric curved faces let the nose swing without catching a square corner.</text>
<text x="390" y="563" font-size="17">Nominal 0.8 mm radial clearance makes this a loose capture, not a draw-down cam.</text>
<text x="390" y="594" font-size="17">Push cap onto four corner seats, then turn the tab upright. Turn sideways to lift.</text>
<text x="390" y="625" font-size="17">The 3 mm seam reveal remains between the corner pads. No full-size case is built.</text>
<text x="25" y="690" font-size="17">Print three PLA parts + assemble one M3×12 screw and two jammed M3 nuts. Fit/feel remain a physical trial.</text>
<text x="25" y="721" font-size="16">This sample explains the motion; it does not validate bag retention, final exterior bulk or the printed keeper strength.</text>
</svg>
