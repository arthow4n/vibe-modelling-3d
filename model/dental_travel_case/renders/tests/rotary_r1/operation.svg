<text x="25" y="38" font-size="25">R1a — a small swivel tab, not a pull-apart snap</text>
<text x="25" y="77" font-size="17">Blue = body. Orange = cap / keeper. Green = rotating tab. Hardware omitted from sections.</text>
<text x="25" y="125" font-size="21">LOCK: inward nose above keeper</text>
