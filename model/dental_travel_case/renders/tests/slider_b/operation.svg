<text x="825" y="482" font-size="17">Lift cap + yoke together.</text>
<text x="825" y="510" font-size="17">The blue lug passes through the slot.</text>
<text x="25" y="568" font-size="18">Close in reverse: keep UNLOCK, seat the cap, then slide to LOCK. No strong snap is forced.</text>
<text x="25" y="604" font-size="17">Fit/action coupon only. The small detents hold slider position; they do not carry the cap pull load.</text>
<text x="25" y="637" font-size="17">Assemble the yoke onto the cap once; see the separate print layout and assembly instructions.</text>
</svg>
