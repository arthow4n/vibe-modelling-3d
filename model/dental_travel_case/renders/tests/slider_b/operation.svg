<style>text{font-family:sans-serif;fill:#243444}</style>
<text x="25" y="38" font-size="25">B1 test piece — slide the lock before lifting the cap</text>
<text x="25" y="78" font-size="18">Actual XZ sections at Y = 28 mm through one lug; second side works the same way.</text>
<text x="25" y="109" font-size="17">Blue = body lug. Orange = cap rail. Green = sliding yoke. White = empty passage.</text>
<text x="30" y="155" font-size="24">1  LOCK</text>
