<text x="425" y="482" font-size="17">Move the U-shaped yoke 10 mm.</text>
<text x="425" y="510" font-size="17">Opening lines up below the lug.</text>
<text x="830" y="155" font-size="24">3  LIFT</text>
<path d="M1023.000,329.400 L967.000,329.400 L967.000,342.000 L1023.000,342.000 Z" fill="#3686af" fill-rule="evenodd" fill-opacity="1.0" stroke="#3686af" stroke-width=".7"/>
<path d="M962.100,317.500 L962.100,289.500 L876.000,289.500 L876.000,317.500 Z M1114.000,317.500 L1114.000,289.500 L1027.900,289.500 L1027.900,317.500 Z" fill="#d69b43" fill-rule="evenodd" fill-opacity="1.0" stroke="#d69b43" stroke-width=".7"/>
