<text x="25" y="482" font-size="17">Solid ledge is below the blue lug.</text>
<text x="25" y="510" font-size="17">Pulling up meets that ledge.</text>
<text x="430" y="155" font-size="24">2  UNLOCK</text>
<path d="M623.000,329.400 L567.000,329.400 L567.000,342.000 L623.000,342.000 Z" fill="#3686af" fill-rule="evenodd" fill-opacity="1.0" stroke="#3686af" stroke-width=".7"/>
