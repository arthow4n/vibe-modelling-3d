<text x="425" y="603" font-size="17">One Ø34 mm curved outline.</text>
<text x="425" y="634" font-size="17">Nose / keeper hidden when closed.</text>
<text x="425" y="665" font-size="17">3 printed + 2 screws + 3 nuts.</text>
<text x="425" y="696" font-size="17">6.3 mm maximum nominal projection.</text>
<text x="825" y="119" font-size="20">C · fixed outer housing</text>
<rect x="943.15" y="294.0" width="113.69999999999999" height="261.0" rx="8" fill="#e0e7e5" stroke="#384e55" stroke-width="1.5"/>
<rect x="943.15" y="159.0" width="113.69999999999999" height="130.5" rx="8" fill="#e0e7e5" stroke="#384e55" stroke-width="1.5"/>
