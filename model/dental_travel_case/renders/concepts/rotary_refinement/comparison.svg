<text x="25" y="38" font-size="25">A cleaner rotary closure — production orientation first</text>
<text x="25" y="76" font-size="17">Front schematics at common scale. Same 75.8 × 52.8 × 264 mm shell; no wrap bands.</text>
<text x="25" y="119" font-size="20">A · rounded exposed paddle</text>
