<circle cx="1000" cy="297.0" r="13.5" fill="#36545a" stroke="#384e55" stroke-width="1.5"/>
<circle cx="1000" cy="297.0" r="4.125" fill="#aab2b2" stroke="#384e55" stroke-width="1.5"/>
<text x="825" y="603" font-size="17">Hides the moving outline too.</text>
<text x="825" y="634" font-size="17">At least 4 printed parts.</text>
<text x="825" y="665" font-size="17">Cover mounting still unresolved.</text>
<text x="825" y="696" font-size="17">Adds bulk for little extra benefit.</text>
<text x="25" y="770" font-size="21">B changes the mechanism, rather than putting a large guard around the old window.</text>
<text x="25" y="811" font-size="18">A stock M3 screw head is the cap keeper. The nose turns outside the shell; the cap needs no large cutout.</text>
<text x="25" y="847" font-size="18">Body prints bottom-down. Cap prints closed-top-down. Wheel prints flat-face-down; hardware installs afterward.</text>
<text x="25" y="883" font-size="17">Two broad perimeter scoops give turning purchase and a visible quarter-turn indication; feel is not yet tested.</text>
<text x="25" y="927" font-size="17">Rough concepts only. B has CAD motion and manufacturing-study evidence; no new full-case print is recommended.</text>
<text x="25" y="960" font-size="17">C is screened out for added envelope/assembly. Existing R1a print remains the action experiment.</text>
</svg>
