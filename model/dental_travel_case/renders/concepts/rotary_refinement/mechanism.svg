<text x="430" y="548" font-size="17">The metal head replaces the upside-down printed keeper lip.</text>
<text x="430" y="583" font-size="17">The cap has only a small screw bore; no exposed gabled aperture.</text>
<text x="430" y="618" font-size="17">Nominal radial capture clearance stays 0.8 mm. No draw-down cam.</text>
<text x="430" y="653" font-size="17">Cap screw: M3×10 + nut. Pivot: M3×12 + two jam nuts.</text>
<text x="430" y="688" font-size="17">The screw/nut travel in a 10.4 mm open-ended sleeve track.</text>
<text x="430" y="723" font-size="17">The full shell size stays unchanged; body loading is checked separately.</text>
<text x="430" y="758" font-size="17">The wheel hides the journal and stop track; no wraparound guard.</text>
<text x="25" y="930" font-size="17">Missing physical qualification: real screw-head size, indexing, turning feel, printed strength, peel and loaded handling.</text>
<text x="25" y="970" font-size="17">Do not treat capture overlap or the clean exterior as a measured holding force or accidental-opening guarantee.</text>
</svg>
