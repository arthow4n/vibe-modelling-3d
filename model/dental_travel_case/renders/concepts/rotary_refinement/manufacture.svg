<text x="800" y="470" font-size="17">Axle · hex head on bed, thread up.</text>
<text x="800" y="502" font-size="17">No socket roof faces the bed.</text>
<text x="800" y="534" font-size="17">Prints with the same PLA as the shell.</text>
<text x="800" y="566" font-size="17">Only one stock M6 nut is needed.</text>
<text x="800" y="598" font-size="17">Cap keeper support is outside;</text>
<text x="800" y="630" font-size="17">no support is trapped in storage.</text>
<text x="25" y="765" font-size="18">The final profile-specific support locations and removal limits are recorded in the notes.</text>
<text x="25" y="810" font-size="17">The sample tests actual thread fit, detent return and effort; it does not qualify the complete travel box.</text>
<text x="25" y="851" font-size="17">Use the current sample / axle files, not older full-study artifacts or the R1a sample to qualify this new detent.</text>
