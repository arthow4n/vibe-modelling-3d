<text x="25" y="38" font-size="25">Stock-only revision · smooth storage walls, recessed printed axle</text>
<text x="25" y="77" font-size="17">Actual side section at X0. Blue body · grey cap · green rotor/printed axle · gold one stock M6 nut.</text>
