<text x="460" y="150" font-size="17">No metal keeper screw, protruding screw tip or jam nuts.</text>
<text x="460" y="191" font-size="17">The stock M6 nut sits in a blind outboard pocket.</text>
<text x="460" y="232" font-size="17">The printed shoulder axle stops against the fixed body.</text>
<text x="460" y="273" font-size="17">The wheel has 0.5 mm nominal total axial freedom.</text>
<text x="460" y="314" font-size="17">Its 8 mm external hex head is recessed 0.3 mm.</text>
<text x="460" y="355" font-size="17">A standard 8 mm socket assembles it; no printed tool.</text>
<text x="460" y="396" font-size="17">All original storage-facing walls and the full guide remain.</text>
<text x="460" y="437" font-size="17">The cap keeper is now integral printed material.</text>
<text x="460" y="478" font-size="17">Its small exterior overhang needs accessible support.</text>
<text x="25" y="738" font-size="18">Tradeoff: the rounded mounting area is deeper. Maximum control projection is 10.4 mm (previous study: 6.3 mm).</text>
<text x="25" y="779" font-size="18">Four printed parts + one stock M6 nut. No purchases, shorter metal screws, glue or extra materials.</text>
<text x="25" y="824" font-size="17">Thread fit, subjective turning effort, wear and resistance to real bag shaking remain physical checks.</text>
</svg>
