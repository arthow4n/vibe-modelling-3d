<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img"><title>Smoother dental travel case — closed form comparison</title><desc>Current three-line case and three schematic proposals at the same scale. Rounded ends remain. Colour distinguishes the same-material body and cap, not different filaments.</desc><style>text{font-family:DejaVu Sans,sans-serif;fill:#243c48}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#566b73}.head{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:14px;fill:#566b73}.label{font-size:15px;font-weight:600} .line{fill:none;stroke:#304e5b;stroke-width:1.6;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="#f6f4ee"/><text x="36" y="47" class="title">A quieter outline, with grip built into the join</text><text x="36" y="80" class="sub">Closed front silhouettes • same scale • rounded ends retained • proposals, not revised CAD</text><rect x="36" y="109" width="310" height="804" rx="16" fill="#ffffff"/><text x="56" y="143" class="head">NOW</text><text x="56" y="174" class="body">Two recessed bands</text><path d="M 124 220 Q 116 220 116 228 L 116 270 C 116 277 117.4 277 117.4 282 L 117.4 298 C 117.4 303 116 303 116 310 L 116 322 C 116 330 114.7 330 114.7 338 L 114.7 400 L 265.7 400 L 265.7 338 C 265.7 330 264.4 330 264.4 322 L 264.4 310 C 264.4 303 263.0 303 263.0 298 L 263.0 282 C 263.0 277 264.4 277 264.4 270 L 264.4 228 Q 264.4 220 256.4 220 Z" fill="#d6c9af" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/><path d="M 116 400 L 116 440 C 116 447 117.4 447 117.4 452 L 117.4 468 C 117.4 473 116 473 116 480 L 116 740 Q 116 748 124 748 L 256.4 748 Q 264.4 748 264.4 740 L 264.4 480 C 264.4 473 263.0 473 263.0 468 L 263.0 452 C 263.0 447 264.4 447 264.4 440 L 264.4 400 Z" fill="#cddce0" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/><text x="56" y="785" class="label">Two return shoulders per band.</text><text x="56" y="819" class="small">Cap also has local catch pads.</text><text x="56" y="846" class="small">Grip depth: 0.7 mm.</text><text x="56" y="873" class="small">Pad projection: 0.65 mm.</text><rect x="390" y="109" width="310" height="804" rx="16" fill="#ffffff"/><text x="410" y="143" class="head">A</text><text x="410" y="174" class="body">One-way body shoulder</text><path d="M 478 220 Q 470 220 470 228 L 470 322 C 470 330 468.7 330 468.7 338 L 468.7 400 L 619.6999999999999 400 L 619.6999999999999 338 C 619.6999999999999 330 618.4 330 618.4 322 L 618.4 228 Q 618.4 220 610.4 220 Z" fill="#d6c9af" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/><path d="M 470.8 400 L 470.8 464 C 470.8 476 470 476 470 480 L 470 740 Q 470 748 478 748 L 610.4 748 Q 618.4 748 618.4 740 L 618.4 480 C 618.4 476 617.6 476 617.6 464 L 617.6 400 Z" fill="#cddce0" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/><text x="410" y="785" class="label">Body stays inset up to the join.</text><text x="410" y="819" class="small">Only the lower body shoulder stays.</text><text x="410" y="846" class="small">Cap band removed; pads retained.</text><text x="410" y="873" class="small">Smooth-cap grip remains uncertain.</text><rect x="744" y="109" width="310" height="804" rx="16" fill="#ffffff"/><text x="764" y="143" class="head">B</text><text x="764" y="174" class="body">Grip at the seam</text><path d="M 832 220 Q 824 220 824 228 L 824 322 C 824 330 822.7 330 822.7 338 L 822.7 394 L 973.6999999999999 394 L 973.6999999999999 338 C 973.6999999999999 330 972.4 330 972.4 322 L 972.4 228 Q 972.4 220 964.4 220 Z" fill="#d6c9af" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/><rect x="826.6" y="391" width="143.2" height="12" rx="0" fill="#829ba5"/><path d="M 832 220 Q 824 220 824 228 L 824 322 C 824 330 822.7 330 822.7 338 L 822.7 394 L 973.6999999999999 394 L 973.6999999999999 338 C 973.6999999999999 330 972.4 330 972.4 322 L 972.4 228 Q 972.4 220 964.4 220 Z" fill="#d6c9af" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/><path d="M 824 400 L 824 740 Q 824 748 832 748 L 964.4 748 Q 972.4 748 972.4 740 L 972.4 400 Z" fill="#cddce0" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/><text x="764" y="785" class="label">A narrow collar stays exposed.</text><text x="764" y="819" class="small">Both wrap bands removed.</text><text x="764" y="846" class="small">Cap rim stops ~3 mm above body.</text><text x="764" y="873" class="small">Catch pads remain visible.</text><rect x="1098" y="109" width="310" height="804" rx="16" fill="#ffffff"/><text x="1118" y="143" class="head">C</text><text x="1118" y="174" class="body">Seam grip + smooth shell</text><path d="M 1184.7 220 Q 1176.7 220 1176.7 228 L 1176.7 322 C 1176.7 330 1176.7 330 1176.7 338 L 1176.7 394 L 1327.7 394 L 1327.7 338 C 1327.7 330 1327.7 330 1327.7 322 L 1327.7 228 Q 1327.7 220 1319.7 220 Z" fill="#d6c9af" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/><rect x="1179.3" y="391" width="145.8" height="12" rx="0" fill="#829ba5"/><path d="M 1184.7 220 Q 1176.7 220 1176.7 228 L 1176.7 322 C 1176.7 330 1176.7 330 1176.7 338 L 1176.7 394 L 1327.7 394 L 1327.7 338 C 1327.7 330 1327.7 330 1327.7 322 L 1327.7 228 Q 1327.7 220 1319.7 220 Z" fill="#d6c9af" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/><path d="M 1176.7 400 L 1176.7 740 Q 1176.7 748 1184.7 748 L 1319.7 748 Q 1327.7 748 1327.7 740 L 1327.7 400 Z" fill="#cddce0" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/><text x="1118" y="785" class="label">Local pads become a flat wall.</text><text x="1118" y="819" class="small">No wrap bands or local pad bumps.</text><text x="1118" y="846" class="small">Body and cap envelopes align.</text><text x="1118" y="873" class="small">Slightly wider; thicker end walls.</text><text x="36" y="949" class="sub">Blue = body • sand = cap • dark blue = exposed overlap. Both pieces are the same PETG.</text><text x="36" y="981" class="body">B / C: the collar is a shallow grip reveal over a continuous inner sleeve, not an open hole into the box.</text><text x="36" y="1015" class="small">Silhouette widths follow 74.2 mm nominal; C adds ~1.3 mm width. Tiny steps are clearer in the next sheet.</text></svg>