<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1060" viewBox="0 0 1380 1060" role="img"><title>Three minimal dental-case directions</title><desc>Three equal-scale proposals with approximate contents, simple capped opening and cross-sectional size comparison.</desc><style>text{font-family:DejaVu Sans,sans-serif;fill:#23313e}.title{font-size:30px;font-weight:bold}.sub{font-size:16px;fill:#596775}.h{font-size:23px;font-weight:bold}.body{font-size:17px}.small{font-size:14px;fill:#596775}.dim{font-size:13px;fill:#596775}.skin{fill:#edf2f4;stroke:#334958;stroke-width:1.25}.ghost{fill:none;stroke:#aeb8bf;stroke-width:1;stroke-dasharray:4 3}.brush{fill:#afcfe8;stroke:#356c97;stroke-width:.7}.paste{fill:#f3d8a5;stroke:#9b7535;stroke-width:.7}.seam{fill:none;stroke:#334958;stroke-width:1;stroke-dasharray:3 2}.arrow{stroke:#586c7a;stroke-width:1;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#586c7a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="42" y="48" class="title">How small can the dental case become?</text><text x="42" y="80" class="sub">Same attached brush + full toothpaste tube · floss elsewhere · SVG concepts, not printable models</text><text x="42" y="109" class="small">Cutaway plans and end views use the same scale. Blue = brush; gold = tube; grey dashed = previous R2 bounding footprint.</text><text x="42" y="159" class="h">M1 · Flat shared case</text><text x="42" y="188" class="body">264 × 94 × 46 mm target</text><g transform="translate(165 222) scale(1.5)"><rect x="-21" y="-1" width="136.7" height="264" rx="14" class="ghost"/><rect x="0" y="0" width="94" height="264" rx="4" class="skin"/><g transform="translate(0 0)"><rect x="3" y="94.5" width="30" height="165" rx="3" class="brush"/><rect x="10.5" y="32.5" width="15" height="62" rx="2" class="brush"/><rect x="10.5" y="4.5" width="12" height="28" rx="2" class="brush"/><rect x="14" y="137" width="8" height="15" rx="3" class="brush"/><path d="M22.5 7h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 10h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 13h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 16h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 19h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 22h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 25h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 28h3" stroke="#356c97" stroke-width=".7"/></g><g transform="translate(0.0 0)"><path class="paste" d="M36 101h55l-1 110q0 19-12 38H49q-12-19-12-38Z"/><rect x="48.5" y="249" width="30" height="12" rx="2" class="paste"/><path d="M36 104h55 M51 253h25 M51 257h25" stroke="#9b7535" stroke-width=".7"/></g><path d="M1 90h92" class="seam"/></g><text x="142" y="638" class="small">90 mm upper cap; 174 mm lower cup</text><text x="42" y="681" class="small">END VIEW / CONTENTS</text><g transform="translate(145 704) scale(1.5)"><rect x="0" y="0" width="94" height="46" rx="3" class="skin"/><circle cx="18" cy="23" r="15" class="brush"/><rect x="36" y="3" width="55" height="40" rx="1" class="paste"/></g><text x="42" y="805" class="body">One simple package; two cups.</text><text x="42" y="831" class="body">Pull off the short upper cap.</text><text x="42" y="857" class="body">Plain interior, no brush clips.</text><text x="42" y="883" class="body">Extra space remains above the tube.</text><path d="M462 145 v790" stroke="#e1e6e9"/><text x="484" y="159" class="h">M2 · Tapered shared case</text><text x="484" y="188" class="body">264 × 94 × 46 mm maximum</text><g transform="translate(607 222) scale(1.5)"><rect x="-21" y="-1" width="136.7" height="264" rx="14" class="ghost"/><path d="M4 24V6q0-6 6-6h16q6 0 6 6v18L94 90v170q0 4-4 4H4q-4 0-4-4V94Z" class="skin"/><g transform="translate(0 0)"><rect x="3" y="94.5" width="30" height="165" rx="3" class="brush"/><rect x="10.5" y="32.5" width="15" height="62" rx="2" class="brush"/><rect x="10.5" y="4.5" width="12" height="28" rx="2" class="brush"/><rect x="14" y="137" width="8" height="15" rx="3" class="brush"/><path d="M22.5 7h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 10h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 13h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 16h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 19h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 22h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 25h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 28h3" stroke="#356c97" stroke-width=".7"/></g><g transform="translate(0.0 0)"><path class="paste" d="M36 101h55l-1 110q0 19-12 38H49q-12-19-12-38Z"/><rect x="48.5" y="249" width="30" height="12" rx="2" class="paste"/><path d="M36 104h55 M51 253h25 M51 257h25" stroke="#9b7535" stroke-width=".7"/></g><path d="M1 90h92" class="seam"/></g><text x="584" y="638" class="small">90 mm upper cap; 174 mm lower cup</text><text x="484" y="681" class="small">END VIEWS · BODY / HEAD</text><g transform="translate(587 704) scale(1.5)"><rect x="0" y="0" width="94" height="46" rx="3" class="skin"/><circle cx="18" cy="23" r="15" class="brush"/><rect x="36" y="3" width="55" height="40" rx="1" class="paste"/><g transform="translate(118 7)"><rect x="0" y="0" width="28" height="32" rx="3" class="skin"/><rect x="6.5" y="3.5" width="15" height="25" rx="1" class="brush"/></g></g><text x="484" y="805" class="body">One package; two cups.</text><text x="484" y="831" class="body">Head end narrows to 28 × 32 mm.</text><text x="484" y="857" class="body">Taper follows the missing tube volume.</text><text x="484" y="883" class="body">Joint sits just beyond the tube.</text><path d="M904 145 v790" stroke="#e1e6e9"/><text x="926" y="159" class="h">M3 · Two independent covers</text><text x="926" y="188" class="body">Brush Ø36; tube 61 × 46 mm</text><g transform="translate(1049 222) scale(1.5)"><rect x="0" y="0" width="36" height="264" rx="4" class="skin"/><g transform="translate(0 0)"><rect x="3" y="94.5" width="30" height="165" rx="3" class="brush"/><rect x="10.5" y="32.5" width="15" height="62" rx="2" class="brush"/><rect x="10.5" y="4.5" width="12" height="28" rx="2" class="brush"/><rect x="14" y="137" width="8" height="15" rx="3" class="brush"/><path d="M22.5 7h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 10h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 13h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 16h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 19h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 22h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 25h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 28h3" stroke="#356c97" stroke-width=".7"/></g><path d="M1 90h34" class="seam"/><rect x="49" y="94" width="61" height="170" rx="4" class="skin"/><g transform="translate(16.0 1)"><path class="paste" d="M36 101h55l-1 110q0 19-12 38H49q-12-19-12-38Z"/><rect x="48.5" y="249" width="30" height="12" rx="2" class="paste"/><path d="M36 104h55 M51 253h25 M51 257h25" stroke="#9b7535" stroke-width=".7"/></g><path d="M50 244h59" class="seam"/></g><text x="1026" y="638" class="small">Separate placement; no rigid combined footprint</text><text x="926" y="681" class="small">END VIEW / CONTENTS</text><g transform="translate(1029 704) scale(1.5)"><circle cx="18" cy="23" r="18" class="skin"/><circle cx="18" cy="23" r="15" class="brush"/><rect x="49" y="0" width="61" height="46" rx="3" class="skin"/><rect x="52" y="3" width="55" height="40" rx="1" class="paste"/></g><text x="926" y="805" class="body">Brush: 264 mm long. Tube: 170 mm.</text><text x="926" y="831" class="body">Four parts, no connecting hardware.</text><text x="926" y="857" class="body">Carry the covers in separate spaces.</text><text x="926" y="883" class="body">Smallest individual profiles.</text><text x="42" y="948" class="body">THICKNESS: previous cylinder joint 100 mm → shared cases 46 mm / separate covers at most 46 mm</text><text x="42" y="980" class="small">Tight-fit basis: reported 30 mm handle and 55 × 40 mm tube; 1 mm item clearance, nominal 2 mm walls.</text><text x="42" y="1005" class="small">Joint strength, opening effort, corner fit and support-free printing need later CAD / physical checks. Other tube sizes may need growth.</text><text x="42" y="1032" class="small">Keeping the earlier 60 × 44 mm tube allowance would grow the shared targets to about 99 × 50 mm.</text></svg>
