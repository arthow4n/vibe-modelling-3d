<text x="820" y="530" font-size="16">Same panel level; about 9.4 mm gap.</text>
<text x="25" y="590" font-size="17">The spine is printed separately in TPU 95A and pressed into recessed holes. PETG shells stay separate material prints.</text>
<text x="25" y="632" font-size="17">Its heads sit flush with the inner rear surface. Eight small buttons replace the hinge barrels, webs and hardware.</text>
<text x="25" y="674" font-size="17">Closed back is flush; front loop/keeper still project. Flexibility, button retention and life are unmeasured until a print.</text>
<path d="M153.800,782.000 L153.800,731.000 L152.737,731.000 L151.675,731.000 L149.550,731.000 L145.300,731.000 L136.800,731.000 L119.800,731.000 L85.800,731.000 L85.800,754.800 L119.800,754.800 L119.800,782.000 Z M153.800,935.000 L153.800,884.000 L119.800,884.000 L119.800,911.200 L85.800,911.200 L85.800,935.000 Z" fill="#1769a6" fill-rule="evenodd" fill-opacity="1.0" stroke="#1769a6" stroke-width=".7"/>
<path d="M85.800,768.400 L85.800,897.600 L87.500,899.300 L89.200,901.000 L92.600,904.400 L119.800,904.400 L119.800,877.200 L153.800,877.200 L153.800,935.000 L181.000,935.000 L181.000,731.000 L153.800,731.000 L153.800,788.800 L119.800,788.800 L119.800,761.600 L92.600,761.600 Z" fill="#26966b" fill-rule="evenodd" fill-opacity="1.0" stroke="#26966b" stroke-width=".7"/>
<text x="340" y="765" font-size="18">Button section: flat retaining shoulder, not a pull-out ramp.</text>
<text x="340" y="810" font-size="17">A soft head must fold/compress to pass the hole. CAD capture</text>
<text x="340" y="839" font-size="17">does not establish pull-out force; the mini box must test it.</text>
<text x="340" y="888" font-size="17">Alternative: a 4.6 mm edge-pin barrel opens flat with almost</text>
<text x="340" y="917" font-size="17">no interior intrusion, but leaves a 2.6 mm exterior bump.</text>
<text x="25" y="1008" font-size="17">The C8 sample is a complete hinged box with the same shortened front loop and keeper. No physical success is inferred.</text>
