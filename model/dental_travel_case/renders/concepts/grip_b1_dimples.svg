  <text x="24" y="1037" font-size="16" fill="#253746" font-weight="normal">Subtle outline; precise finger placement.</text>
  <text x="24" y="1064" font-size="16" fill="#253746" font-weight="normal">Mostly friction with a shallow finger seat.</text>
