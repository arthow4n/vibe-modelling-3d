  <text x="49" y="922" font-size="21" fill="#253746" font-weight="bold">Recommendation to explore: a full-wrap G2 band, about 0.6–0.8 mm deep and 18–24 mm wide.</text>
  <text x="49" y="957" font-size="18" fill="#253746" font-weight="normal">The proposed 0.7 × 20 mm center point is a starting shape, not a proven minimum useful depth.</text>
  <text x="49" y="990" font-size="18" fill="#253746" font-weight="normal">Keep a continuous wall: reshape the inside too. A full band spends interior room around the entire perimeter.</text>
  <text x="49" y="1023" font-size="18" fill="#253746" font-weight="normal">Printed finger comfort, wet-hand grip, wall flex and the force needed to open still need a real comparison.</text>
  <text x="28" y="1067" font-size="16" fill="#253746" font-weight="normal">Geometry sketches only · no force prediction · no new CAD, mesh, slice or physical test</text>
</svg>
