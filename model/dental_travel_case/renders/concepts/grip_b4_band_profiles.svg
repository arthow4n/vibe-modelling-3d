  <text x="28" y="43" font-size="29" fill="#253746" font-weight="bold">Shallow and smooth: compare the band cross-section</text>
  <text x="28" y="83" font-size="19" fill="#253746" font-weight="normal">Axial surface sections at one finger contact. Cap pulls right →; mirror a directional profile for the body.</text>
  <text x="28" y="117" font-size="18" fill="#253746" font-weight="normal">All curves blend smoothly into the wall. Same axes: depth is enlarged 5× relative to the length scale.</text>
  <text x="28" y="205" font-size="24" fill="#253746" font-weight="bold">G1 · Very gentle</text>
  <text x="28" y="241" font-size="18" fill="#253746" font-weight="normal">0.4 mm deep · 28 mm wide along the box</text>
  <text x="28" y="281" font-size="16" fill="#253746" font-weight="normal">Subtle feel; broad ramps give little geometric</text>
  <text x="28" y="305" font-size="16" fill="#253746" font-weight="normal">opposition.</text>
