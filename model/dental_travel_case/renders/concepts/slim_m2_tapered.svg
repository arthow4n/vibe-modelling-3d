<svg xmlns="http://www.w3.org/2000/svg" width="950" height="762" viewBox="0 0 950 762" role="img"><title>M2 · Tapered shared case</title><desc>Closed content layout, proposed cap opening and end view with approximate dimensions.</desc><style>text{font-family:DejaVu Sans,sans-serif;fill:#23313e}.title{font-size:30px;font-weight:bold}.sub{font-size:16px;fill:#596775}.h{font-size:23px;font-weight:bold}.body{font-size:17px}.small{font-size:14px;fill:#596775}.dim{font-size:13px;fill:#596775}.skin{fill:#edf2f4;stroke:#334958;stroke-width:1.25}.ghost{fill:none;stroke:#aeb8bf;stroke-width:1;stroke-dasharray:4 3}.brush{fill:#afcfe8;stroke:#356c97;stroke-width:.7}.paste{fill:#f3d8a5;stroke:#9b7535;stroke-width:.7}.seam{fill:none;stroke:#334958;stroke-width:1;stroke-dasharray:3 2}.arrow{stroke:#586c7a;stroke-width:1;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#586c7a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="40" y="48" class="title">M2 · Tapered shared case</text><text x="40" y="80" class="sub">264 × 94 × 46 mm maximum · schematic / unqualified</text><text x="40" y="111" class="small">Fully covered storage; brush head stays attached; floss is outside the requirement.</text><g transform="translate(100 156) scale(1.75)"><path d="M4 24V6q0-6 6-6h16q6 0 6 6v18L94 90v170q0 4-4 4H4q-4 0-4-4V94Z" class="skin"/><g transform="translate(0 0)"><rect x="3" y="94.5" width="30" height="165" rx="3" class="brush"/><rect x="10.5" y="32.5" width="15" height="62" rx="2" class="brush"/><rect x="10.5" y="4.5" width="12" height="28" rx="2" class="brush"/><rect x="14" y="137" width="8" height="15" rx="3" class="brush"/><path d="M22.5 7h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 10h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 13h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 16h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 19h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 22h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 25h3" stroke="#356c97" stroke-width=".7"/><path d="M22.5 28h3" stroke="#356c97" stroke-width=".7"/></g><g transform="translate(0.0 0)"><path class="paste" d="M36 101h55l-1 110q0 19-12 38H49q-12-19-12-38Z"/><rect x="48.5" y="249" width="30" height="12" rx="2" class="paste"/><path d="M36 104h55 M51 253h25 M51 257h25" stroke="#9b7535" stroke-width=".7"/></g><path d="M1 90h92" class="seam"/></g><text x="380" y="170" class="h">HOW IT OPENS</text><text x="380" y="206" class="body">Hold the lower cup; release the flush catch,</text><text x="380" y="231" class="body">then pull the cap along the brush axis.</text><text x="380" y="256" class="body">Catch and overlap are ideas, not finished interfaces.</text><g transform="translate(418 315) scale(1.3)"><rect x="0" y="0" width="94" height="46" rx="3" class="skin"/><circle cx="18" cy="23" r="15" class="brush"/><rect x="36" y="3" width="55" height="40" rx="1" class="paste"/><g transform="translate(118 7)"><rect x="0" y="0" width="28" height="32" rx="3" class="skin"/><rect x="6.5" y="3.5" width="15" height="25" rx="1" class="brush"/></g></g><text x="380" y="300" class="small">BODY CROSS-SECTION</text><text x="380" y="395" class="small">Left: handle + tube. Right: attached head in the narrow cap.</text><text x="380" y="451" class="body">One package; two cups.</text><text x="380" y="476" class="body">Head end narrows to 28 × 32 mm.</text><text x="380" y="501" class="body">Taper follows the missing tube volume.</text><text x="380" y="526" class="body">Joint sits just beyond the tube.</text><text x="40" y="668" class="small">Nominal 2 mm shell + about 1 mm item clearance; full tube shape is only approximately known.</text><text x="40" y="693" class="small">End-down cup printing is the intended support-free direction, not an established result.</text><text x="40" y="718" class="small">No new clip, divider or exposed hinge; positive cap retention still needs qualification.</text></svg>
