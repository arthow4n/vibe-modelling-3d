<text x="25" y="38" font-size="25">Hidden rear hinges: the rear wall has to let the lid turn</text>
<text x="25" y="76" font-size="17">Actual YZ sections. Blue = base; orange = lid; red = unintended intersection. Closed rear outline remains flat.</text>
