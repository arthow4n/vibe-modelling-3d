<text x="825" y="680" font-size="17">Closed outline: flat rear.</text>
<text x="825" y="720" font-size="17">Screw option: 2 M3 x 12</text>
<text x="825" y="750" font-size="17">plus 4 jam nuts.</text>
<text x="825" y="800" font-size="17">Printed option: captive cones,</text>
<text x="825" y="830" font-size="17">90-degree-open V print pose.</text>
<text x="25" y="977" font-size="17">Complete mini boxes include the real front loop and keeper. CAD motion is not printed fit, quietness or strength approval.</text>
