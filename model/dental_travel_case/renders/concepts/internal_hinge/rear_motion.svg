<text x="25" y="505" font-size="17">A fails immediately: the ordinary rear rim sweeps into the base. Moving the axle alone does not make a hidden hinge.</text>
<text x="25" y="550" font-size="17">B/C: a curved rear split changes sides at the fixed ears. Each hinge web keeps its own wall; the opposite part clears it.</text>
<text x="25" y="593" font-size="17">Pivot centre is 6.2 mm inside the back. The 7.2 mm barrel reaches 7.8 mm inward from the normal storage wall.</text>
<text x="40" y="655" font-size="18">At moving ear</text>
