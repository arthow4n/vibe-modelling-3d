  <text x="24" y="460" font-size="16" fill="#253746" font-weight="normal">pull along the box length.</text>
  <text x="24" y="602" font-size="14" fill="#647582" font-weight="normal">Contact ovals are schematic, not hand-fit evidence.</text>
