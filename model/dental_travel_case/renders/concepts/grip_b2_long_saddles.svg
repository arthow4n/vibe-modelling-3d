  <text x="24" y="463" font-size="16" fill="#253746" font-weight="normal">body 27 mm below.</text>
  <text x="24" y="598" font-size="14" fill="#647582" font-weight="normal">Orange = schematic finger contact, not hand-fit proof.</text>
