  <text x="24" y="937" font-size="14" fill="#647582" font-weight="normal">Profiles enlarged separately.</text>
  <text x="24" y="1010" font-size="16" fill="#253746" font-weight="normal">30 mm long; ~18 mm around corner.</text>
  <text x="24" y="1037" font-size="16" fill="#253746" font-weight="normal">~0.6 mm deep; more freedom to regrip.</text>
  <text x="24" y="1064" font-size="16" fill="#253746" font-weight="normal">Broad gentle slopes; no abrupt catch.</text>
  <text x="24" y="1111" font-size="16" fill="#253746" font-weight="bold">Reshape inner + outer skin together.</text>
  <text x="24" y="1137" font-size="15" fill="#253746" font-weight="normal">Keep full wall thickness; check clearance.</text>
  <text x="24" y="1161" font-size="14" fill="#647582" font-weight="normal">Concept only · no CAD or print validation</text>
