<svg xmlns="http://www.w3.org/2000/svg" width="460" height="1185" viewBox="0 0 460 1185"><rect width="460" height="1185" fill="#fafbfc"/><style>
text{font-family:DejaVu Sans,Arial,sans-serif;fill:#24343f}
.title{font-size:30px;font-weight:700}.h{font-size:23px;font-weight:700}
.label{font-size:17px}.small{font-size:15px}.caps{font-size:14px;letter-spacing:1px;font-weight:700;fill:#60727d}
.shell{fill:#edf0f2;stroke:#536775;stroke-width:2.5;stroke-linejoin:round}
.hardware{fill:#b8e2d9;stroke:#197b70;stroke-width:2.5}
.hidden{fill:none;stroke:#197b70;stroke-width:2;stroke-dasharray:6 4}
.guide{fill:none;stroke:#9ca9b0;stroke-width:1.5;stroke-dasharray:5 5}
.motion{fill:none;stroke:#cb833d;stroke-width:2.5;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#cb833d" stroke-width="1.5"/></marker>
<pattern id="pocket" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="#bfd7d1" stroke-width="1"/></pattern></defs><g transform="translate(5 5)"><rect x="5" y="5" width="440" height="1110" rx="18" fill="#fff" stroke="#d2dce1" stroke-width="2"/><text x="25" y="44" class="h">B  Internal recessed pivot</text><text x="25" y="75" class="small">Clean rear outline</text><text x="25" y="110" class="label">Put two pivot pockets inside the case,</text><text x="25" y="135" class="label">behind an overlapping rear edge.</text><text x="25" y="176" class="caps">CLOSED • REAR VIEW</text><g transform="translate(5 188)"><rect class="shell" x="30" y="16" width="370" height="86" rx="18"/><path d="M30 59H400" fill="none" stroke="#83949e" stroke-width="2"/><rect class="hidden" x="105" y="42" width="28" height="34" rx="8"/><rect class="hidden" x="295" y="42" width="28" height="34" rx="8"/></g><text x="25" y="326" class="caps">CLOSED • SECTION THROUGH HINGE</text><g transform="translate(10 339)"><path class="shell" d="M30 20H290V130H280V30H30Z"/>
<path class="shell" d="M30 240H290V130H280V230H30Z"/>
<path class="guide" d="M280 10V250"/>
<path class="guide" d="M270 130H370"/>
<rect x="240" y="93" width="39" height="74" rx="4" fill="url(#pocket)"/>
<path class="hardware" d="M277 108H267Q240 108 240 130Q240 152 267 152H277Z"/>
<circle class="hardware" cx="261" cy="130" r="16"/>
<circle cx="261" cy="130" r="4" fill="#197b70"/>
<path d="M280 117H291V145H284" fill="none" stroke="#536775" stroke-width="4"/>
<text x="35" y="277" class="small">Pivot sits behind the rear edge.</text><text x="35" y="298" class="small">Pocket / overlap geometry is provisional.</text><text x="32" y="59" class="small">lid</text><text x="32" y="209" class="small">base</text></g><text x="25" y="682" class="caps">OPENING IDEA • DIFFERENT SCALE</text><g transform="translate(10 705)"><path class="shell" d="M30 152H192V107H182V142H30Z"/>
<g transform="rotate(115 178 107)"><path class="shell" d="M30 62H192V107H182V72H30Z"/></g>
<circle class="hardware" cx="178" cy="107" r="10"/>
<path class="motion" d="M127 89Q145 39 204 43"/>
<text x="30" y="186" class="small">Aim for about 110–120° of opening.</text><text x="30" y="208" class="small">Print shells separately; assemble hinge.</text></g><text x="25" y="941" class="caps">TRADEOFFS</text><text x="25" y="972" class="small">No external hinge barrels when closed.</text><text x="25" y="995" class="small">Local cavity space or extra width needed.</text><text x="25" y="1018" class="small">Smaller opening; added assembly.</text><text x="25" y="1060" class="small">Needs CAD: Lid clearance, tube fit and printed pins.</text></g><text x="20" y="1155" class="small">Schematic only • no CAD / physical validation</text></svg>