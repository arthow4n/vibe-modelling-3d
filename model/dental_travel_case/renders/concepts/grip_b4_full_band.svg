  <ellipse cx="605.2" cy="383" rx="11" ry="14" fill="none" stroke="#d48740" stroke-dasharray="4 3" />
  <ellipse cx="657.4" cy="383" rx="11" ry="14" fill="none" stroke="#d48740" stroke-dasharray="4 3" />
  <path d="M708.4,244 L708.4,193" stroke="#247d6c" stroke-width="3" fill="none" />
  <path d="M702.4,202 L708.4,193 L714.4,202" stroke="#247d6c" stroke-width="3" fill="none" />
  <path d="M708.4,367 L708.4,418" stroke="#247d6c" stroke-width="3" fill="none" />
  <path d="M702.4,409 L708.4,418 L714.4,409" stroke="#247d6c" stroke-width="3" fill="none" />
  <text x="441" y="722" font-size="17" fill="#253746" font-weight="normal">Find the grip anywhere around it</text>
  <text x="441" y="750" font-size="17" fill="#253746" font-weight="normal">The whole section narrows locally</text>
  <text x="906" y="153" font-size="22" fill="#253746" font-weight="bold">Why a full band may help</text>
  <text x="906" y="195" font-size="18" fill="#253746" font-weight="normal">Less need to line up fingers</text>
  <text x="906" y="224" font-size="18" fill="#253746" font-weight="normal">with separate pockets.</text>
  <text x="906" y="272" font-size="18" fill="#253746" font-weight="normal">Front, back, sides and corners</text>
  <text x="906" y="301" font-size="18" fill="#253746" font-weight="normal">all offer the same hollow.</text>
  <text x="906" y="349" font-size="18" fill="#253746" font-weight="normal">It does not guarantee more</text>
  <text x="906" y="378" font-size="18" fill="#253746" font-weight="normal">traction at one contact.</text>
  <text x="906" y="426" font-size="17" fill="#d48740" font-weight="normal">Dashed orange ovals show</text>
  <text x="906" y="453" font-size="17" fill="#d48740" font-weight="normal">alternative finger positions,</text>
  <text x="906" y="480" font-size="17" fill="#d48740" font-weight="normal">not simultaneous contacts.</text>
  <text x="906" y="532" font-size="17" fill="#377b98" font-weight="normal">Blue dashed line: end of</text>
  <text x="906" y="559" font-size="17" fill="#377b98" font-weight="normal">the hidden 30 mm sleeve.</text>
  <text x="906" y="607" font-size="17" fill="#253746" font-weight="normal">Cap band stays beyond it;</text>
  <text x="906" y="634" font-size="17" fill="#253746" font-weight="normal">body band stays below seam.</text>
  <text x="28" y="802" font-size="23" fill="#253746" font-weight="bold">Full band at its deepest section — end view</text>
  <rect x="92" y="833" width="210" height="145" rx="18" fill="none" stroke="#a2afb6" stroke-dasharray="6 4" />
  <rect x="99" y="840" width="196" height="131" rx="15" fill="#d9ebe3" stroke="#247d6c" />
  <rect x="111" y="852" width="172" height="107" rx="11" fill="#f6f6f1" stroke="#247d6c" />
  <text x="335" y="858" font-size="18" fill="#253746" font-weight="normal">Dashed = original outside. Inset exaggerated to explain the wall.</text>
  <text x="335" y="893" font-size="18" fill="#253746" font-weight="normal">Move both wall surfaces inward; retain the 1.2 mm thin skin.</text>
  <text x="335" y="928" font-size="18" fill="#253746" font-weight="normal">0.7 mm recess on each side removes 1.4 mm of width and depth locally.</text>
  <text x="335" y="963" font-size="18" fill="#253746" font-weight="normal">Nominal thin interior there: 71.8 × 48.8 → 70.4 × 47.4 mm.</text>
  <text x="28" y="1020" font-size="17" fill="#253746" font-weight="normal">Sketch only. Current CAD and notches unchanged. Grip, packing and printability remain untested.</text>
</svg>
