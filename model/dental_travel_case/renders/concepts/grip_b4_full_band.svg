  <path d="M166,269 H314.4" stroke="#377b98" stroke-width="1.5" fill="none" stroke-dasharray="5 4" />
  <text x="186" y="181" font-size="16" fill="#377b98" font-weight="normal">CAP</text>
  <text x="186" y="655" font-size="16" fill="#377b98" font-weight="normal">BODY</text>
  <rect x="165" y="199.0" width="24" height="60" rx="11" fill="#fafdfb" stroke="#247d6c" />
  <rect x="291.4" y="199.0" width="24" height="60" rx="11" fill="#fafdfb" stroke="#247d6c" />
  <rect x="165" y="353.0" width="24" height="60" rx="11" fill="#fafdfb" stroke="#247d6c" />
  <rect x="291.4" y="353.0" width="24" height="60" rx="11" fill="#fafdfb" stroke="#247d6c" />
  <path d="M343.4,244 L343.4,193" stroke="#247d6c" stroke-width="3" fill="none" />
  <path d="M337.4,202 L343.4,193 L349.4,202" stroke="#247d6c" stroke-width="3" fill="none" />
  <path d="M343.4,367 L343.4,418" stroke="#247d6c" stroke-width="3" fill="none" />
  <path d="M337.4,409 L343.4,418 L349.4,409" stroke="#247d6c" stroke-width="3" fill="none" />
  <text x="76" y="722" font-size="17" fill="#253746" font-weight="normal">Specific corner landing areas</text>
  <text x="76" y="750" font-size="17" fill="#253746" font-weight="normal">Smaller reshaped interior region</text>
  <text x="441" y="125" font-size="23" fill="#253746" font-weight="bold">B4 · Full wrap</text>
  <rect x="531" y="149" width="148.4" height="528" rx="10" fill="#edf1f3" stroke="#377b98" />
  <rect x="532" y="150" width="146.4" height="178" rx="9" fill="#deedf2" stroke="none" />
  <rect x="533" y="269" width="144.4" height="60" rx="0" fill="#ecf2fb" stroke="none" />
  <path d="M531,329 H679.4" stroke="#253746" stroke-width="2" fill="none" />
  <path d="M531,269 H679.4" stroke="#377b98" stroke-width="1.5" fill="none" stroke-dasharray="5 4" />
  <text x="551" y="181" font-size="16" fill="#377b98" font-weight="normal">CAP</text>
  <text x="551" y="655" font-size="16" fill="#377b98" font-weight="normal">BODY</text>
  <rect x="532.4" y="209.0" width="145.6" height="40" rx="8" fill="#d9ebe3" stroke="none" />
  <path d="M531,209.0 C531,211.0 532.4,211.0 532.4,229 C532.4,247.0 531,247.0 531,249.0" stroke="#247d6c" stroke-width="2" fill="none" />
  <path d="M679.4,209.0 C679.4,211.0 678.0,211.0 678.0,229 C678.0,247.0 679.4,247.0 679.4,249.0" stroke="#247d6c" stroke-width="2" fill="none" />
  <ellipse cx="553" cy="229" rx="11" ry="14" fill="none" stroke="#d48740" stroke-dasharray="4 3" />
  <ellipse cx="605.2" cy="229" rx="11" ry="14" fill="none" stroke="#d48740" stroke-dasharray="4 3" />
  <ellipse cx="657.4" cy="229" rx="11" ry="14" fill="none" stroke="#d48740" stroke-dasharray="4 3" />
  <rect x="532.4" y="363.0" width="145.6" height="40" rx="8" fill="#d9ebe3" stroke="none" />
  <path d="M531,363.0 C531,365.0 532.4,365.0 532.4,383 C532.4,401.0 531,401.0 531,403.0" stroke="#247d6c" stroke-width="2" fill="none" />
  <path d="M679.4,363.0 C679.4,365.0 678.0,365.0 678.0,383 C678.0,401.0 679.4,401.0 679.4,403.0" stroke="#247d6c" stroke-width="2" fill="none" />
