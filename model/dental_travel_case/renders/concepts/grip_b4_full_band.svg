<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1050" viewBox="0 0 1320 1050">
  <style>text{font-family:DejaVu Sans,sans-serif}</style>
  <rect x="0" y="0" width="1320" height="1050" rx="0" fill="#f6f6f1" stroke="none" />
  <text x="28" y="43" font-size="29" fill="#253746" font-weight="bold">From corner saddles to a continuous recessed band</text>
  <text x="28" y="82" font-size="19" fill="#253746" font-weight="normal">Concept comparison: same box proportions, two separate grips, no outward ridge or through-hole.</text>
  <text x="76" y="125" font-size="23" fill="#253746" font-weight="bold">B2 · Corners only</text>
  <rect x="166" y="149" width="148.4" height="528" rx="10" fill="#edf1f3" stroke="#377b98" />
  <rect x="167" y="150" width="146.4" height="178" rx="9" fill="#deedf2" stroke="none" />
