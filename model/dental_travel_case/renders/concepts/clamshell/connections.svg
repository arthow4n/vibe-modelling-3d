<text x="820" y="344" font-size="16">4.3 mm rear projection; no axle</text>
<text x="820" y="384" font-size="16">Drop-in locators do not capture rear lift.</text>
<text x="820" y="424" font-size="16">Rejected in this form: rear can peel up.</text>
<text x="820" y="464" font-size="16">Shared front: pull loop outward, then lift.</text>
<text x="25" y="540" font-size="19">Reference sunglasses hinge: 11.2 mm barrel, 20 mm axial modules, about 14.32 mm rear projection.</text>
<text x="25" y="583" font-size="18">Selected A reduces rear projection about 45%; each module is 7 mm wide. Pins replace bulky conical bearing ears.</text>
<text x="25" y="626" font-size="18">The whole lid remains attached. Broad access replaces the long cap sleeve; storage has no inward latch guards.</text>
<text x="25" y="672" font-size="17">A and B pass sampled shell rotation. B pin retention and C rear capture are unresolved; neither is a print recommendation.</text>
<text x="25" y="716" font-size="17">Prototypes are unprinted. E supplies a proven closure principle, not proof of the new short flexure or hinge.</text>
