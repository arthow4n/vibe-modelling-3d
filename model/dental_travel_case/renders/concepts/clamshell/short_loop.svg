<text x="825" y="535" font-size="16">Rail section: solid = seated; pale = released.</text>
<text x="825" y="567" font-size="17">Pull outward 3.2 mm before lifting.</text>
<text x="25" y="636" font-size="18">Keeper and radial capture stay the same; axial gap is .35 mm. Shorter leaves are thinner for release.</text>
<text x="25" y="685" font-size="18">Nominal end-load screen: about 69% of E actuation force. Rail/root coupling is uncertain; strain is higher.</text>
<text x="25" y="728" font-size="17">These are provisional comparisons, not measured PETG properties, fatigue acceptance or holding-force predictions.</text>
<text x="25" y="773" font-size="17">Print the matching small front-wall crop first. Check engage/release effort, recovery, whitening and noise; full box is unprinted.</text>
<text x="25" y="819" font-size="17">Closing method: hold loop outward, lower lid onto its rims, then release the loop. Avoid forcing it over the keeper.</text>
<text x="25" y="868" font-size="17">Rounded loop roots and keeper geometry are retained. The new flexure and 2 mm supporting walls still need the physical trial.</text>
