<text x="25" y="38" font-size="25">Shorten the front loop without turning it into another force-open snap</text>
<text x="25" y="78" font-size="16">Actual YZ leaf sections at X7.5. Same placement against the 51.2 mm case roof; the short loop changes root position and thickness.</text>
