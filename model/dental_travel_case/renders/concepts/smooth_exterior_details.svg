<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img"><title>Grip and cap backing — enlarged design details</title><desc>Schematic enlarged sections explain a one-way grip shoulder, an exposed collar, and the material needed behind a snap recess. Depths are exaggerated and fit is unverified.</desc><style>text{font-family:DejaVu Sans,sans-serif;fill:#243c48}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#566b73}.head{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:14px;fill:#566b73}.label{font-size:15px;font-weight:600} .line{fill:none;stroke:#304e5b;stroke-width:1.6;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="#f6f4ee"/><text x="36" y="47" class="title">What changes at the grip and inside the cap?</text><text x="36" y="80" class="sub">Enlarged schematic sections • radial depths exaggerated • not manufacturing drawings</text><rect x="36" y="110" width="440" height="437" rx="16" fill="#ffffff"/><text x="56" y="147" class="head">Current body band</text><g transform="translate(276,180)"><path d="M 0 0 L 0 65 C 0 85 -24 85 -24 105 L -24 151 C -24 171 0 171 0 191 L 0 255 L -60 255 L -60 0 Z" fill="#cddce0" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/></g><text x="61" y="203" class="small">toward cap ↑</text><text x="61" y="430" class="small">toward base ↓</text><path d="M 336 380 L 336 418 M 330 408 L 336 418 L 342 408" fill="none" stroke="#2c7a78" stroke-width="2.5" stroke-linejoin="round"/><text x="310" y="358" class="label">hold ↓</text><text x="56" y="482" class="small">Returns to the original width above.</text><text x="56" y="510" class="small">Two visible transitions per band.</text><rect x="500" y="110" width="440" height="437" rx="16" fill="#ffffff"/><text x="520" y="147" class="head">A · one-way shoulder</text><g transform="translate(740,180)"><path d="M -24 0 L -24 151 C -24 171 0 171 0 191 L 0 255 L -60 255 L -60 0 Z" fill="#cddce0" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/></g><text x="525" y="203" class="small">toward cap ↑</text><text x="525" y="430" class="small">toward base ↓</text><path d="M 800 380 L 800 418 M 794 408 L 800 418 L 806 408" fill="none" stroke="#2c7a78" stroke-width="2.5" stroke-linejoin="round"/><text x="774" y="358" class="label">hold ↓</text><text x="520" y="482" class="small">No return bump above the grip.</text><text x="520" y="510" class="small">Lower shoulder still opposes slipping down.</text><rect x="964" y="110" width="440" height="437" rx="16" fill="#ffffff"/><text x="984" y="147" class="head">B / C · exposed collar</text><rect x="1129" y="189" width="27" height="180" rx="0" fill="#829ba5"/><path d="M 1156 180 L 1197 180 L 1197 306 Q 1197 312 1191 312 L 1156 312 Z" fill="#d6c9af" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/><path d="M 1129 330 L 1191 330 Q 1197 330 1197 336 L 1197 437 L 1129 437 Z" fill="#cddce0" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/><text x="1222" y="207" class="label">cap ↑</text><text x="1222" y="397" class="label">body ↓</text><path d="M 1144 321 L 1246 321" fill="none" stroke="#2c7a78" stroke-width="1.6" stroke-linejoin="round"/><text x="1218" y="294" class="small">~3 mm reveal</text><text x="984" y="482" class="small">Two soft rim edges give opposing contacts.</text><text x="984" y="510" class="small">Shallow recess: useful finger purchase unproven.</text><text x="36" y="594" class="head">A flat cap still needs material behind the catch recess</text><rect x="36" y="614" width="440" height="350" rx="16" fill="#ffffff"/><text x="56" y="651" class="body">Existing local pad</text><g transform="translate(36,660)"><path d="M 150 30 L 210 30 L 210 70 C 210 82 242 82 242 94 L 242 156 C 242 168 210 168 210 180 L 210 220 L 150 220 L 150 155 L 182 155 L 182 95 L 150 95 Z" fill="#d6c9af" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/></g><text x="60" y="722" class="small">inside</text><text x="306" y="722" class="small">outside</text><path d="M 136 785 L 211 785" fill="none" stroke="#566b73" stroke-width="1.6" stroke-linejoin="round"/><text x="56" y="813" class="small">catch recess</text><text x="56" y="913" class="small">0.65 mm pad is material, not decoration.</text><text x="56" y="939" class="small">Shaving it off would leave ~0.55 mm backing.</text><rect x="500" y="614" width="440" height="350" rx="16" fill="#ffffff"/><text x="520" y="651" class="body">C · continuous exterior plane</text><g transform="translate(500,660)"><path d="M 150 30 L 242 30 L 242 220 L 150 220 L 150 155 L 182 155 L 182 95 L 150 95 Z" fill="#d6c9af" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/></g><text x="524" y="722" class="small">inside</text><text x="770" y="722" class="small">outside</text><path d="M 600 785 L 675 785" fill="none" stroke="#566b73" stroke-width="1.6" stroke-linejoin="round"/><text x="520" y="813" class="small">catch recess</text><text x="520" y="913" class="small">Carry the pad thickness across the end wall.</text><text x="520" y="939" class="small">About 1.85 mm wall away from the recess.</text><rect x="964" y="614" width="440" height="350" rx="16" fill="#ffffff"/><text x="984" y="651" class="body">Alternative · move the joint inward</text><g transform="translate(964,660)"><path d="M 118 30 L 210 30 L 210 220 L 118 220 L 118 155 L 150 155 L 150 95 L 118 95 Z" fill="#d6c9af" stroke="#304e5b" stroke-width="1.6" stroke-linejoin="round"/></g><text x="988" y="722" class="small">inside</text><text x="1234" y="722" class="small">outside</text><path d="M 1064 785 L 1107 785" fill="none" stroke="#566b73" stroke-width="1.6" stroke-linejoin="round"/><text x="984" y="813" class="small">catch recess</text><text x="984" y="913" class="small">Keep the outline; move sleeve + catch inward.</text><text x="984" y="939" class="small">Packing clearance and snap flex must change.</text><text x="36" y="1008" class="head">Preferred starting sketch: C — one clean seam reveal, smooth sides and rounded ends.</text><text x="36" y="1043" class="body">Do not simply scale the whole body: preserve brush / toothpaste space, then adjust the mating region deliberately.</text><text x="36" y="1077" class="small">All proposals need CAD checks of catch seating, release path, overlap and wall thickness; actual grip still needs handling.</text></svg>