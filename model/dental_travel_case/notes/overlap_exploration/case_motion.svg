<text x="826" y="703" class="small">Movement inset above is enlarged 10×.</text>
<text x="826" y="736" class="small" style="fill:#1769a6">Guide meets first; catches are still clear.</text>
<text x="30" y="792" class="note">A smaller angle alone was not enough evidence: we must see which surface stops the motion first.</text>
<text x="30" y="824" class="small">The revised guide reaches near the cap end, giving the shell support before peel demands catch bending.</text>
<text x="30" y="852" class="small">M4 also uses 0.15 mm side clearance and 0.40 mm axial catch play; these changes are identified, not hidden.</text>
