<text x="30" y="759" class="note">Even centered, the old 3 cm design demands ~0.38 mm of catch rise; side movement makes it worse.</text>
<text x="30" y="793" class="small">The earlier catch proxy loses capture after only about 0.06–0.16 mm in its adverse scenarios.</text>
<text x="30" y="823" class="small">That exposed a missing load-path check. The drawing does not claim those scenarios measured a real print.</text>
<text x="30" y="863" class="note" style="fill:#1769a6">M4 puts the guide into contact while the catches remain clear in this nominal peel path.</text>
<text x="30" y="899" class="small">The guide can now carry the rocking load first; the catches retain the cap against straight withdrawal.</text>
<text x="30" y="932" class="small">Nominal CAD + declared peel path. Shell flexibility, tolerances and printed recovery still need their stated evidence.</text>
