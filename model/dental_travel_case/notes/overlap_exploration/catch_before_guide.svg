<text x="30" y="40" class="title">The important difference: does the guide help before the catch has to bend?</text>
<text x="30" y="76" class="small">Same magnification in all panels. Actual catch plane Y=0. Orange cap is at first guide contact.</text>
<text x="30" y="100" class="small">Red = blocked rigid overlap. The blue tooth could escape by bending inward (left); deformation is not drawn.</text>
<text x="22" y="138" class="note">1.2 cm control (M3 catch)</text>
