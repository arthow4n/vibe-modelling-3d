<text x="25" y="767" font-size="19">The spring is unchanged. Its protective liner is needed beside the moving leaf, not another 62 mm above it.</text>
<text x="25" y="805" font-size="18">The guide remains a continuous closed, stepped ring above the guard, with the same 1.6 mm wall.</text>
<text x="25" y="842" font-size="17">Clearance channels on the guide let the reinforced receivers slide all the way off; they are not storage space.</text>
