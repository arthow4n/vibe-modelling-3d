<text x="448" y="630" font-size="15" style="fill:#243840">Clear of backing; useful room to either end.</text>
<text x="448" y="658" font-size="16" style="fill:#243840">Band centres: 85 mm apart</text>
<text x="448" y="684" font-size="16" style="fill:#243840">Cap band: +45 to +65 mm</text>
<text x="448" y="710" font-size="16" style="fill:#243840">Body band: −40 to −20 mm</text>
<text x="825" y="142" font-size="20" style="fill:#243840">C — usable alternative</text>
<rect x="870" y="160" width="123" height="435.59999999999997" rx="10" fill="#e3ecee" stroke="#486775" stroke-width="2"/>
<rect x="877" y="259.0" width="109" height="49.5" fill="#93adb5" opacity=".4" stroke="#486775" stroke-dasharray="5 4"/>
