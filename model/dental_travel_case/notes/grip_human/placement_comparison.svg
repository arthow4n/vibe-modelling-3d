<text x="1006" y="396.0" font-size="16" style="fill:#243840">−50 mm</text>
<path d="M931.5 193.25V166" stroke="#c1742b" stroke-width="4" marker-end="url(#arrow)"/>
<text x="838" y="630" font-size="15" style="fill:#243840">Less room above the cap band.</text>
<text x="838" y="658" font-size="16" style="fill:#243840">Band centres: 115 mm apart</text>
<text x="838" y="684" font-size="16" style="fill:#243840">Cap band: +55 to +75 mm</text>
<text x="838" y="710" font-size="16" style="fill:#243840">Body band: −60 to −40 mm</text>
<text x="38" y="760" font-size="20" style="fill:#243840">Read the drawing</text>
<text x="38" y="789" font-size="17" style="fill:#243840">Orange: lift the cap here. Purple: support the body here. Black line: seam.</text>
<text x="38" y="817" font-size="17" style="fill:#243840">Dashed fill: internal sleeve ends at +30 mm. Grey strip: existing exterior backing blend ends at +39 mm.</text>
<text x="38" y="845" font-size="17" style="fill:#243840">Choose B: cap centre +55 mm / body centre −30 mm. Cap band starts 6 mm beyond the backing.</text>
<text x="38" y="873" font-size="17" style="fill:#243840">Location selected from layout and opening use. Printed traction/feel remains a separate physical question.</text>
<text x="38" y="904" font-size="15" style="fill:#243840">Side view, schematic width. Bands wrap around all faces/corners. No printable CAD has been changed.</text>
</svg>
