<text x="58" y="630" font-size="15" style="fill:#243840">Cap band overlaps the backing blend.</text>
<text x="58" y="658" font-size="16" style="fill:#243840">Band centres: 55 mm apart</text>
<text x="58" y="684" font-size="16" style="fill:#243840">Cap band: +30 to +50 mm</text>
<text x="58" y="710" font-size="16" style="fill:#243840">Body band: −25 to −5 mm</text>
<text x="435" y="142" font-size="20" style="fill:#243840">B — selected layout</text>
<rect x="480" y="160" width="123" height="435.59999999999997" rx="10" fill="#e3ecee" stroke="#486775" stroke-width="2"/>
<rect x="487" y="259.0" width="109" height="49.5" fill="#93adb5" opacity=".4" stroke="#486775" stroke-dasharray="5 4"/>
<rect x="476" y="244.14999999999998" width="7" height="64.35" fill="#8b8d92"/>
