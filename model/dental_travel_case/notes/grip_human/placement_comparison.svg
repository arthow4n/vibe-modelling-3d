<text x="38" y="43" font-size="30" style="fill:#243840">Where should the two recessed grip bands sit?</text>
<text x="38" y="74" font-size="17" style="fill:#243840">Selected shape: smooth full-wrap bands, 0.7 mm deep × 20 mm wide. Distances are from the seam.</text>
<text x="38" y="104" font-size="17" style="fill:#243840">Opening: keep the body below the cap, upright or diagonal, to help keep the toothbrush inside.</text>
<text x="45" y="142" font-size="20" style="fill:#243840">A — too near the backing</text>
