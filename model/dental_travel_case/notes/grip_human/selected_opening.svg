<text x="445" y="574" font-size="16">Gap between band edges: 71 mm</text>
<text x="835" y="139" font-size="20">3  Keep supporting the body</text>
<rect x="885" y="340.0" width="74.2" height="174.0" rx="6" fill="#d9e3e6" stroke="#486775" stroke-width="2"/>
<rect x="890" y="310.0" width="64.2" height="30.0" fill="#c7d6da" stroke="#486775" stroke-dasharray="4 3"/>
