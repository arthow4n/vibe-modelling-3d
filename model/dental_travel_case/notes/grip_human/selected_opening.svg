<text x="982.2" y="410.0" font-size="16">hold</text>
<text x="835" y="546" font-size="18">Cap lift: 90 mm</text>
<text x="835" y="574" font-size="16">Gap between band edges: 155 mm</text>
<text x="35" y="615" font-size="17">The lower grip stays on the body. The upper grip travels with the cap; the two zones move farther apart.</text>
<text x="35" y="643" font-size="16">The sleeve is 30 mm long. Clearing it alone does not fully uncover a toothbrush that extends above it.</text>
<text x="35" y="671" font-size="16">At 90 mm lift, the cap mouth reaches the old closed top: enough axial travel to clear fully enclosed contents.</text>
<text x="35" y="699" font-size="15">Ovals mark suggested contact zones, not anatomical hand shapes. Diagrams show motion, not measured forces.</text>
<text x="35" y="746" font-size="23">What makes the shallow band useful?</text>
<text x="50" y="780" font-size="18">CAP: pull toward the closed cap end</text>
