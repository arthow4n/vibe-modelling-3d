<text x="35" y="42" font-size="29">Chosen grip layout: hold the body, lift the cap</text>
<text x="35" y="74" font-size="19">Cap band +55 mm · body band −30 mm · both 20 mm wide × 0.7 mm deep</text>
<text x="35" y="103" font-size="16">Upright opening shown. A modest diagonal works with the same hand roles; keep the body underneath.</text>
<text x="55" y="139" font-size="20">1  Find the bands</text>
