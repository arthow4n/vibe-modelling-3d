<text x="25" y="623" font-size="17">Two parts; end snaps flex with the surrounding walls.</text>
<text x="25" y="653" font-size="17">Recessed pulling grips sit on the broad faces.</text>
<text x="25" y="683" font-size="16">Individual passage checked; loaded packing still needs a trial.</text>
