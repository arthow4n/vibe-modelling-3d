<text x="975" y="155" font-size="17">Past snap</text>
<text x="975" y="405" font-size="16">Cap lift 6 mm</text>
<text x="560" y="455" font-size="17">Red = blocked rigid geometry; real wall flex is needed.</text>
<text x="560" y="485" font-size="16">Body bends inward / cap spreads outward to cross the lip.</text>
<text x="560" y="515" font-size="17">Below the lip, a relief track lets the bump recover.</text>
<text x="560" y="545" font-size="17">The snap has cleared by the sampled 6 mm lift.</text>
<text x="560" y="585" font-size="16">A shorter overlap reduces guided sliding, but is not automatically</text>
<text x="560" y="611" font-size="16">easier or quieter: changed stiffness changes the snap.</text>
<text x="560" y="643" font-size="16">The cap still needs to clear the projecting brush head.</text>
<text x="25" y="750" font-size="21">Overlap tradeoff — conditional elastic model, not measured holding force</text>
<text x="25" y="788" font-size="17">Lap</text>
<text x="150" y="788" font-size="17">Centered pull peak</text>
<text x="400" y="788" font-size="17">Ideal sudden-release threshold</text>
<text x="750" y="788" font-size="17">Worst roof play*</text>
<text x="25" y="827" font-size="18">18 mm</text>
<text x="150" y="827" font-size="18">6.8 N</text>
<text x="400" y="827" font-size="18">2.4 N</text>
<text x="750" y="827" font-size="18">1.46 mm</text>
<text x="25" y="865" font-size="18">24 mm</text>
<text x="150" y="865" font-size="18">6.4 N</text>
<text x="400" y="865" font-size="18">2.2 N</text>
<text x="750" y="865" font-size="18">1.03 mm</text>
<text x="25" y="903" font-size="18">30 mm</text>
<text x="150" y="903" font-size="18">6.1 N</text>
<text x="400" y="903" font-size="18">2.1 N</text>
<text x="750" y="903" font-size="18">0.78 mm</text>
<text x="25" y="950" font-size="18">First 24 mm refinement: 10.0 N pull / 4.2 N energy threshold / 0.68 mm roof play</text>
<text x="25" y="988" font-size="19">Selected 30 mm reinforced: 11.2 N pull / 4.6 N energy threshold / 0.52 mm roof play</text>
<text x="25" y="1030" font-size="16">*Guide-only rigid prescribed rocking; snaps omitted. Loaded stiffness and unrestricted peel are separate questions.</text>
<text x="25" y="1064" font-size="16">Force: E1200 MPa, nominal fit, two engaged catches, frictionless independent radial springs; full cap included.</text>
<text x="25" y="1098" font-size="16">Selected walls: 2 mm sleeve / 2.7 mm receiving band. Bump: 0.6 mm. Guide gap: 0.10 mm per side.</text>
<text x="25" y="1140" font-size="17">Printed force, snap recovery, noise, impact, creep and full-box retention remain physical checks.</text>
