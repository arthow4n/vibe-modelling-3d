<text x="620" y="735" class="note">75 mm shell · 9 mm tooth width</text>
<text x="36" y="786" class="note">Holding: cap shoulder pulls on the tooth; a long guide carries the bearing couple.</text>
<text x="36" y="816" class="note">Weak route: leaf bends inward → tooth face rotates → edge contact may add inward force.</text>
<text x="36" y="846" class="note">M3: 30 mm guide, 2 mm leaf, 9 mm retaining land width, stronger pocket skin.</text>
<text x="36" y="876" class="note">Opening: squeeze both recessed pads, then withdraw. Entry ramps permit push-on closing.</text>
<text x="36" y="906" class="note">Proxy predicts loss of flat capture, not complete escape. Printed fit, friction and recovery remain unmeasured.</text>
<text x="36" y="936" class="note">No liner assumption. STEP/STL are prototype geometry; no new print has been performed.</text>
