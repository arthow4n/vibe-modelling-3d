<text x="25" y="774" font-size="17">Blue = outside contour; orange = inner wall; green = center gap-fill line. No sparse infill here.</text>
<text x="25" y="813" font-size="18">Thin floor / roof: 1.2 mm = six 0.2 mm layers. Pads are locally thicker between recesses.</text>
<text x="25" y="850" font-size="17">Matching pairs only: thin cap + thin body. General size retained; pads increase width to 75.5 mm.</text>
<text x="25" y="889" font-size="18">Both full pairs slice without supports. Mass / time are estimates for the same PETG setup.</text>
<text x="25" y="931" font-size="17">Next useful evidence: print and compare flex, fit and snap return. Holding force / bag knocks untested.</text>
