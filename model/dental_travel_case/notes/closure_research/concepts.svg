<text x="625" y="985" font-size="17">Rails block lifting; small detents resist sliding.</text>
<text x="625" y="1014" font-size="16">No independent cantilever, release tunnel or inward guard.</text>
<text x="25" y="1080" font-size="19">These are research samples: opening resistance and recovery are not measured or guaranteed.</text>
<text x="25" y="1114" font-size="16">The sliding concept needs long clearance to open; its short coupon cannot represent full-length drag or warping.</text>
