<path d="M923.600,141.755 L923.600,197.200 L940.500,197.200 L940.500,517.000 L975.600,517.000 L975.600,127.000 L939.132,127.000 Z" fill="#ce741c" fill-rule="evenodd" fill-opacity="1.0" stroke="#ce741c" stroke-width=".7"/>
<text x="825" y="125" font-size="18">Past the lip — wall can recover</text>
<text x="825" y="565" font-size="18">Cap lift: 6 mm</text>
<text x="25" y="616" font-size="17">Red is blocked rigid overlap: real wall deformation is needed here. It is not an allowed interpenetrating pose.</text>
<text x="25" y="654" font-size="18">A recess alone would keep rubbing for almost the entire guide length after the catch popped out.</text>
<text x="25" y="691" font-size="18">The track below the retaining lip removes that drag after the first few millimetres. The lip is not cut away.</text>
<text x="25" y="735" font-size="17">No runout at 30 mm lift: still obstructed. Corrected samples at 6–90 mm: clear in the declared axial path.</text>
<text x="25" y="779" font-size="17">Guide and bearing remain 78 mm long. The cap stays complete so its roof and wall constraints are represented.</text>
<text x="25" y="824" font-size="17">Both shell and cap can flex in a print. CAD capture does not determine how many newtons are needed.</text>
