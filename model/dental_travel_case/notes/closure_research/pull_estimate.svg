<text x="640" y="620" font-size="18">R2 end walls: 6.2 N ≈ 634 g equivalent</text>
<text x="790" y="552" font-size="16">Cap withdrawal: 0 → 6 mm</text>
<text x="25" y="702" font-size="19">Equivalent grams means a slow, steady downward load: 100 g ≈ 0.98 N. It is NOT a safe payload rating.</text>
<text x="25" y="746" font-size="18">Initial slack allows a suddenly released body to gain speed: the zero-damping energy limit is lower (see notes).</text>
<text x="25" y="790" font-size="18">R3: ring deformation/peeling is not resolved. R4: lifting loads the rails; its sliding snap is a different load.</text>
<text x="25" y="834" font-size="17">Shown curves omit friction, joint rocking and coupled contact; negative recovery force is omitted from this plot.</text>
<text x="25" y="884" font-size="17">Native cap/body stiffness, CAD ramp path, mesh/travel checks and fit/material scenarios are retained in the notes.</text>
