<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="735" viewBox="0 0 940 735" role="img">
  <title>Broad corner marks</title>
  <desc>SVG discussion concept, not CAD or actual sliced paths. Black is TPU, white is air, orange shows proposed recess voids, blue is optional contrasting ink. Only labels change; T08 and T16 full models are deferred.</desc>
  <rect width="100%" height="100%" fill="white"/>
  <text x="32" y="38" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#20252b" font-weight="bold">Smaller IDs without carving up the test skin</text>
  <text x="32" y="67" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20252b" font-weight="normal">Discussion only • future pair: T08 / T16 • same identifier on cup + lid pad</text>
  <text x="32" y="91" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20252b" font-weight="normal">Black = TPU; white = air. Orange = recess void (explanatory color); blue = optional ink.</text>
  <text x="32" y="134" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#20252b" font-weight="bold">M2  Broad corner marks</text>
  <text x="32" y="165" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#667085" font-weight="normal">4 × 4 mm reserved corner</text>
  <rect x="50" y="203" width="238" height="238" fill="#20252b" stroke="#20252b"/>
  <rect x="92" y="245" width="154" height="154" fill="none" stroke="#b9c0c9" stroke-dasharray="5 5"/>
  <text x="102.5" y="322" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#f4f5f7" font-weight="normal">NO ID CUTS</text>
  <text x="102.5" y="343" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#c5cbd3" font-weight="normal">in central test field</text>
  <rect x="57" y="406" width="28" height="28" fill="none" stroke="#dd8b24" stroke-dasharray="3 2"/>
  <rect x="62.6" y="411.6" width="5.6000000000000005" height="16.8" fill="#dd8b24" stroke="#dd8b24"/>
  <text x="50" y="463" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#667085" font-weight="normal">34 mm cup underside</text>
  <text x="350" y="218" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20252b" font-weight="normal">A countable symbol instead of tiny lettering</text>
  <text x="350" y="247" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20252b" font-weight="normal">Each groove: 0.8 mm wide × 2.4 mm long</text>
  <text x="350" y="276" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20252b" font-weight="normal">Two-bar center spacing: 1.6 mm (0.8 mm gap)</text>
  <text x="350" y="305" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20252b" font-weight="normal">Reserve 4 × 4 mm; recess one 0.2 mm layer.</text>
  <text x="350" y="367" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20252b" font-weight="bold">T08</text>
  <rect x="410.0" y="346" width="7.2" height="21.599999999999998" fill="#dd8b24" stroke="#dd8b24"/>
  <text x="530" y="367" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20252b" font-weight="bold">T16</text>
  <rect x="590.0" y="346" width="7.2" height="21.599999999999998" fill="#dd8b24" stroke="#dd8b24"/>
  <rect x="604.4" y="346" width="7.2" height="21.599999999999998" fill="#dd8b24" stroke="#dd8b24"/>
  <text x="350" y="409" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20252b" font-weight="normal">Use the same bar count on cup and pad.</text>
  <text x="350" y="434" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20252b" font-weight="normal">Keep a full-name key with the batch.</text>
  <text x="350" y="459" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20252b" font-weight="normal">Count bars; never infer the ID from orientation.</text>
  <text x="350" y="484" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20252b" font-weight="normal">The 16 mm² backing zone must stay fully solid.</text>
  <text x="50" y="530" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#20252b" font-weight="bold">SECTION THROUGH THE MARK (vertical scale exaggerated)</text>
  <rect x="50" y="555" width="260" height="65" fill="#20252b" stroke="#20252b"/>
  <rect x="142" y="555" width="60" height="10" fill="#dd8b24" stroke="#dd8b24"/>
  <text x="330" y="568" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#20252b" font-weight="normal">0.2 mm recessed, one layer</text>
  <text x="330" y="588" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#20252b" font-weight="normal">solid corner backing below</text>
  <text x="330" y="608" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#20252b" font-weight="normal">NO cut over the open core</text>
  <text x="50" y="670" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#20252b" font-weight="normal">Printed upside down on the marked face: recesses are on the bed side; no raised boss changes fit.</text>
  <text x="50" y="693" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#20252b" font-weight="normal">M1 / M2 require solid backing, not a half-thickness membrane above an air core. No new CAD or slice supplied.</text>
</svg>
