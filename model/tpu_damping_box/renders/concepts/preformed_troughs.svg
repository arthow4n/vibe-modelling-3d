<rect x="389" y="438" width="19" height="8" fill="#cf711c" stroke="none" rx="0"/>
<rect x="148" y="297" width="80" height="18" fill="white" stroke="none" rx="0"/>
<rect x="163" y="297" width="8" height="18" fill="#cf711c" stroke="none" rx="0"/>
