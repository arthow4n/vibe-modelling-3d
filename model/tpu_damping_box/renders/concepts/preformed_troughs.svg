<rect x="148" y="487" width="80" height="18" fill="white" stroke="none" rx="0"/>
<rect x="163" y="487" width="8" height="18" fill="#cf711c" stroke="none" rx="0"/>
<rect x="203" y="487" width="8" height="18" fill="#cf711c" stroke="none" rx="0"/>
<rect x="285" y="297" width="80" height="18" fill="white" stroke="none" rx="0"/>
<rect x="300" y="297" width="8" height="18" fill="#cf711c" stroke="none" rx="0"/>
<rect x="340" y="297" width="8" height="18" fill="#cf711c" stroke="none" rx="0"/>
<rect x="285" y="487" width="80" height="18" fill="white" stroke="none" rx="0"/>
<rect x="300" y="487" width="8" height="18" fill="#cf711c" stroke="none" rx="0"/>
<rect x="340" y="487" width="8" height="18" fill="#cf711c" stroke="none" rx="0"/>
<path d="M203 566L248 566" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M311 566L266 566" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arrow)"/>
<text x="75" y="604" font-size="17" fill="#183247" font-weight="700">Two plain butt joins, on the narrow faces.</text>
<text x="475" y="293" font-size="17" fill="#183247">Left half + right half,</text>
<text x="475" y="321" font-size="17" fill="#183247">not inner + outer cups.</text>
<text x="475" y="349" font-size="17" fill="#183247"></text>
<text x="475" y="377" font-size="17" fill="#183247">Each has its own core</text>
<text x="475" y="405" font-size="17" fill="#183247">and substantial skins.</text>
<text x="475" y="433" font-size="17" fill="#183247"></text>
<text x="475" y="461" font-size="17" fill="#183247">Solid seam/corner lands.</text>
<text x="475" y="489" font-size="17" fill="#183247">The rigid box captures</text>
<text x="475" y="517" font-size="17" fill="#183247">both preformed halves.</text>
<rect x="755" y="185" width="715" height="450" fill="white" stroke="#d4dde6" rx="12"/>
<text x="775" y="219" font-size="22" fill="#183247" font-weight="700">2 · Print ONE half: section across the trough</text>
<path d="M820 332V520H1220V332" fill="none" stroke="#475569" stroke-width="32" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M852 332V482H1188V332" fill="none" stroke="#2466b0" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="836" y="360" width="9" height="12" fill="#cf711c" stroke="none" rx="0"/>
<rect x="1195" y="360" width="9" height="12" fill="#cf711c" stroke="none" rx="0"/>
<rect x="836" y="405" width="9" height="12" fill="#cf711c" stroke="none" rx="0"/>
<rect x="1195" y="405" width="9" height="12" fill="#cf711c" stroke="none" rx="0"/>
<rect x="836" y="450" width="9" height="12" fill="#cf711c" stroke="none" rx="0"/>
<rect x="1195" y="450" width="9" height="12" fill="#cf711c" stroke="none" rx="0"/>
<rect x="870" y="489" width="12" height="15" fill="#cf711c" stroke="none" rx="0"/>
<rect x="920" y="489" width="12" height="15" fill="#cf711c" stroke="none" rx="0"/>
