<rect x="1120" y="489" width="12" height="15" fill="#cf711c" stroke="none" rx="0"/>
<rect x="1170" y="489" width="12" height="15" fill="#cf711c" stroke="none" rx="0"/>
<rect x="790" y="544" width="470" height="8" fill="#c5ccd4" stroke="none" rx="0"/>
<text x="790" y="573" font-size="14" fill="#183247" font-weight="700">PRINT BED</text>
<path d="M1240 529L1240 459" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1205" y="447" font-size="16" fill="#183247" font-weight="700">Z ↑</text>
<text x="1250" y="347" font-size="16" fill="#183247">Open trough.</text>
<text x="1250" y="372" font-size="16" fill="#183247"></text>
<text x="1250" y="397" font-size="16" fill="#183247">Short return</text>
<text x="1250" y="422" font-size="16" fill="#183247">walls rise</text>
<text x="1250" y="447" font-size="16" fill="#183247">at its edges.</text>
<text x="1250" y="472" font-size="16" fill="#183247"></text>
<text x="1250" y="497" font-size="16" fill="#183247">No roof over</text>
<text x="1250" y="522" font-size="16" fill="#183247">this cavity.</text>
<text x="790" y="270" font-size="18" fill="#183247" font-weight="700">Main wall becomes a flat sandwich panel.</text>
<text x="790" y="301" font-size="17" fill="#183247">Contact face prints UP on its small-cell core roof.</text>
<text x="790" y="607" font-size="16" fill="#183247">Back face is on bed. Roof spans are between core supports, not across trough.</text>
<rect x="30" y="655" width="705" height="430" fill="white" stroke="#d4dde6" rx="12"/>
<text x="50" y="689" font-size="22" fill="#183247" font-weight="700">3 · Bed view: long axis lies along the bed</text>
<path d="M92 984L555 984L640 863L177 863Z" fill="#475569" stroke="#183247" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M106 966L545 966L616 867L177 867Z" fill="#2466b0" stroke="#183247" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M92 984L92 875L177 754L177 863Z" fill="#475569" stroke="#183247" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M177 863L177 754L640 754L640 863Z" fill="#475569" stroke="#183247" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M92 984L92 938L555 938L555 984Z" fill="#475569" stroke="#183247" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="80" y="719" font-size="17" fill="#183247">Integral end wall at the cup floor; mouth end stays open.</text>
<path d="M300 1030L540 1030" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arrow)"/>
<text x="100" y="1062" font-size="17" fill="#183247" font-weight="700">Long liner dimension stays parallel to bed, not upright.</text>
<text x="555" y="1015" font-size="15" fill="#183247" font-weight="700">Open end</text>
<rect x="755" y="655" width="715" height="430" fill="white" stroke="#d4dde6" rx="12"/>
<text x="775" y="689" font-size="22" fill="#183247" font-weight="700">4 · Assembly and limits of the orientation change</text>
<text x="780" y="733" font-size="18" fill="#183247">P1 proposed a separately printed thin inner cup.</text>
<text x="780" y="762" font-size="18" fill="#183247">N3 proposes two substantial, core-backed troughs.</text>
<text x="780" y="791" font-size="18" fill="#183247"></text>
<text x="780" y="820" font-size="18" fill="#183247">P2 needed a flat net, folds and corner flaps.</text>
<text x="780" y="849" font-size="18" fill="#183247">N3 halves already have their final shape on the bed.</text>
<text x="780" y="878" font-size="18" fill="#183247"></text>
<text x="780" y="907" font-size="18" fill="#183247">Largest opposed faces become horizontal print surfaces;</text>
<text x="780" y="936" font-size="18" fill="#183247">the remaining return walls are shorter, still core-backed.</text>
<text x="780" y="965" font-size="18" fill="#183247">Only those largest faces get the orientation benefit.</text>
<text x="780" y="994" font-size="18" fill="#183247"></text>
<text x="780" y="1023" font-size="18" fill="#183247">Costs: two narrow-face seams plus a seam in the floor;</text>
<text x="780" y="1052" font-size="18" fill="#183247">clearance and lid capture must hold the joins flush.</text>
<rect x="30" y="1105" width="1440" height="285" fill="white" stroke="#d4dde6" rx="12"/>
<text x="50" y="1139" font-size="22" fill="#183247" font-weight="700">Tradeoff and print-path reality</text>
<text x="55" y="1168" font-size="18" fill="#183247">Build order: back skin on bed → supported small-cell core → contact skin roof; return walls / floor half grow from the panel.</text>
<text x="55" y="1200" font-size="18" fill="#183247">Lid pad prints flat as usual. A B-style floor/pad core is a starting reference, not proof of these newly oriented roofs.</text>
<text x="55" y="1232" font-size="18" fill="#183247">Halves insert separately into the existing box; it provides lateral restraint. No snap lips or unexamined horizontal retention ledges.</text>
<text x="55" y="1264" font-size="18" fill="#183247">Most direct change to surface orientation. Top surfaces still need good bridging/top fill; they are not automatically smoother than B.</text>
<text x="55" y="1296" font-size="18" fill="#183247">For other models: choose the split and check bed footprint, open-side access and ledges. Curved/undercut forms may rule it out.</text>
<text x="55" y="1328" font-size="18" fill="#183247">Reject if joins catch contents, halves drift, bed length is insufficient or a new shape creates unsupported roofs. No universal fit claim.</text>
</g></svg>