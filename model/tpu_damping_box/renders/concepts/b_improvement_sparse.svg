<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">D2 / Fewer ties, alternating positions</title><desc id="desc">Proposal only. Schematic, not to scale. Enlarged wall sections and a face view with both continuous skins hidden. Green rectangles connect both skins across the gap. Dimensions are candidate discussion choices, not evaluated CAD or actual future slicer paths.</desc><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="1120" fill="#f3f6f9" rx="0" stroke="none"/><text x="36" y="48" font-size="30" fill="#183246" font-weight="700">D2 / Fewer ties, alternating positions</text><text x="36" y="82" font-size="19" fill="#183246" font-weight="400">Remove alternate B08 ties; keep the surviving ties substantial.</text><text x="36" y="112" font-size="16" fill="#b76520" font-weight="400">21 Oct 2026 • SVG DISCUSSION ONLY • no new CAD, slice or profile • dimensions in mm</text><rect x="28" y="140" width="1144" height="180" fill="white" rx="12" stroke="none"/><text x="52" y="174" font-size="22" fill="#183246" font-weight="700">Retain the approved B08 sandwich and both flat faces</text><text x="76" y="207" font-size="16" fill="#2367b1" font-weight="400">Shell-facing skin</text><rect x="76" y="218" width="480" height="15" fill="#2367b1" rx="0" stroke="none"/><rect x="76" y="266" width="480" height="15" fill="#2367b1" rx="0" stroke="none"/><rect x="126" y="233" width="16" height="33" fill="#15836e" rx="0" stroke="none"/><rect x="246" y="233" width="16" height="33" fill="#15836e" rx="0" stroke="none"/><rect x="366" y="233" width="16" height="33" fill="#15836e" rx="0" stroke="none"/><rect x="486" y="233" width="16" height="33" fill="#15836e" rx="0" stroke="none"/><text x="76" y="306" font-size="16" fill="#2367b1" font-weight="400">Object-facing skin — this is the finish to improve</text><text x="616" y="213" font-size="17" fill="#183246" font-weight="400">0.5 skin + 0.6 air gap + 0.5 skin = 1.6 total</text><text x="616" y="240" font-size="17" fill="#183246" font-weight="400">Green ties reach BOTH skins; they are not loose dots.</text><text x="616" y="267" font-size="17" fill="#183246" font-weight="400">Schematic, not to scale; routing is not prescribed.</text><rect x="28" y="336" width="552" height="398" fill="white" rx="12" stroke="none"/><rect x="596" y="336" width="576" height="398" fill="white" rx="12" stroke="none"/><text x="52" y="373" font-size="22" fill="#183246" font-weight="700">Printed B08 reference</text><text x="620" y="373" font-size="22" fill="#183246" font-weight="700">Proposed tie arrangement</text><rect x="96" y="400" width="326" height="281" fill="#e9f0f5" rx="3" stroke="none"/><rect x="664" y="400" width="326" height="281" fill="#e9f0f5" rx="3" stroke="none"/><rect x="116" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="160" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="204" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="248" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="292" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="336" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="380" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="116" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="160" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="204" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="248" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="292" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="336" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="380" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="116" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="160" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="204" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="248" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="292" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="336" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="380" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="116" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="160" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="204" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="248" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="292" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="336" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="380" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="116" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="160" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="204" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="248" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="292" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="336" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="380" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="116" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="160" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="204" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="248" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="292" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="336" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="380" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="684" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="772" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="860" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="948" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="728" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="816" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="904" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="684" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="772" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="860" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="948" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="728" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="816" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="904" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="684" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="772" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="860" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="948" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="728" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="816" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="904" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><line x1="62" y1="660" x2="62" y2="432" stroke="#b76520" stroke-width="2"/><text x="46" y="421" font-size="17" fill="#b76520" font-weight="400">Z ↑</text><text x="108" y="708" font-size="16" fill="#183246" font-weight="400">0.8 × 0.8 ties • rows line up</text><text x="646" y="708" font-size="16" fill="#183246" font-weight="400">Alternate sites are deliberately empty</text><text x="52" y="762" font-size="17" fill="#2367b1" font-weight="400">Face views above: both skins hidden to reveal the internal ties.</text><text x="52" y="798" font-size="17" fill="#183246" font-weight="400">Keep 0.8 × 0.8 mm ties; delete alternate checkerboard sites.</text><text x="52" y="825" font-size="17" fill="#183246" font-weight="400">Each row uses every other 4.4 mm site: 8.8 mm spacing.</text><text x="52" y="852" font-size="17" fill="#183246" font-weight="400">Offset the next row by 4.4 mm; keep its height repeat at 4.4 mm.</text><text x="52" y="904" font-size="17" fill="#183246" font-weight="400">Aim: fewer small cell boundaries and fewer candidate starts on tie layers.</text><text x="52" y="931" font-size="17" fill="#183246" font-weight="400">No thinner skins, tiny dots or new features that need Arachne.</text><text x="52" y="958" font-size="17" fill="#183246" font-weight="400">Trade-off: about half the interior ties; unsupported spans become longer.</text><text x="52" y="985" font-size="17" fill="#183246" font-weight="400">Test later: travel/start reduction AND wall survival, with B08 damping retained.</text><text x="36" y="1036" font-size="16" fill="#b76520" font-weight="400">Fewer ties is a print-path hypothesis, not an established strength improvement.</text><text x="36" y="1071" font-size="16" fill="#183246" font-weight="400">Classic + ordinary widths remain required. Later: inspect real paths before recommending any print.</text></g></svg>
