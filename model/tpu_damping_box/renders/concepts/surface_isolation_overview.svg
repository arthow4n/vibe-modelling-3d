<path d="M0 0 L8 4 L0 8" fill="none" stroke="#bd3434" stroke-width="1.6"/>
</marker>
<pattern id="zone" width="13" height="13" patternUnits="userSpaceOnUse">
<rect width="13" height="13" fill="#fff5e8"/>
<path d="M0 13 L13 0" stroke="#d67a20" stroke-width="3"/>
</pattern>
</defs>
<rect x="0" y="0" width="1440" height="36" fill="#fff0d5"/>
<text x="30" y="25" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#713e0b">SUPERSEDED: see print_first_overview.svg for complete print / floor / lid / assembly plans.</text>
<g transform="translate(0 36)">
