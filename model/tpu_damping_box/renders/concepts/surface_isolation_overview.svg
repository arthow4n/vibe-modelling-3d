<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="966" viewBox="0 0 1440 966" role="img" aria-labelledby="title desc">
<title id="title">A clear two-cup shortlist</title>
<desc id="desc">Labelled concept only, not CAD or calculated deformation. Blue is the smooth inner TPU cup, dark grey the outer TPU cup, orange flexible TPU springs, pale grey the existing rigid box. White is empty space for the spring to bend into. All TPU is black in real life. Before and during impact sections show intended qualitative behavior, with motion exaggerated.</desc>
