<text x="984" y="696" font-size="17" fill="#163146" font-weight="400">Plain cups + retained tube modules.</text>
<text x="984" y="726" font-size="17" fill="#163146" font-weight="400">Tube walls flatten; bores give space.</text>
<text x="984" y="756" font-size="17" fill="#163146" font-weight="400">Both cup surfaces print without a core.</text>
<text x="984" y="819" font-size="16" fill="#163146" font-weight="400">Solid corner lands retained in both cups</text>
<text x="38" y="886" font-size="18" fill="#163146" font-weight="400">White is empty deformation space, not a missing part. New E5/E6 keep the two-cup idea but change the spring mechanism.</text>
<text x="38" y="918" font-size="16" fill="#bd3434" font-weight="400">SVG discussion only — not CAD, sliced toolpaths, calculated deformation or a proven damping improvement.</text>
