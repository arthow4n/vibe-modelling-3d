<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc">
<title id="title">Four architectures to isolate the visible face</title>
<desc id="desc">Concept investigation only, not to scale or evaluated CAD. Normal black TPU, no thickness cap. Blue is facing material, green is compliant structure, brown is solid corner or perimeter material. Process and assembly views show proposals, not verified toolpaths.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse">
<path d="M0 0 L8 4 L0 8" fill="none" stroke="#bd5c24" stroke-width="1.5"/>
</marker>
</defs>
<g font-family="DejaVu Sans, sans-serif">
<rect x="0" y="0" width="1280" height="1040" fill="#f1f5f8" rx="0"/>
<text x="38" y="48" font-size="31" fill="#173247" font-weight="700">Four ways to isolate the object-facing surface</text>
<text x="38" y="83" font-size="19" fill="#173247" font-weight="400">New investigation • normal black TPU • thickness is free • solid corners included</text>
<text x="38" y="116" font-size="16" fill="#bd5c24" font-weight="400">SVG PROPOSAL • 21 Oct 2026 • black TPU • thickness free • no new model or slice</text>
<rect x="28" y="148" width="600" height="390" fill="white" rx="13"/>
<text x="48" y="185" font-size="24" fill="#173247" font-weight="700">E1</text>
<text x="48" y="219" font-size="24" fill="#173247" font-weight="700">Separate smooth cup</text>
<path d="M60 260 V350 H190 V260" fill="none" stroke="#15836e" stroke-width="12"/>
<path d="M238 260 V350 H350 V260" fill="none" stroke="#2367b1" stroke-width="14"/>
<path d="M202 306 L223 306" fill="none" stroke="#bd5c24" stroke-width="3" marker-end="url(#arrow)"/>
<text x="382" y="275" font-size="17" fill="#173247" font-weight="400">Two prints.</text>
<text x="382" y="304" font-size="17" fill="#173247" font-weight="400">Assemble later.</text>
<text x="382" y="333" font-size="17" fill="#173247" font-weight="400">Face print has</text>
<text x="382" y="362" font-size="17" fill="#173247" font-weight="400">no internal core.</text>
<text x="48" y="425" font-size="17" fill="#173247" font-weight="400">Best simple container concept to discuss first.</text>
<text x="48" y="456" font-size="17" fill="#173247" font-weight="400">Extra fit/capture; spring marks can still arise in use.</text>
<text x="48" y="510" font-size="17" fill="#ad6836" font-weight="400">Solid corner lands + gradual transition</text>
<rect x="656" y="148" width="600" height="390" fill="white" rx="13"/>
<text x="676" y="185" font-size="24" fill="#173247" font-weight="700">E2</text>
<text x="676" y="219" font-size="24" fill="#173247" font-weight="700">Flat-printed face panels</text>
<rect x="696" y="343" width="270" height="8" fill="#526572" rx="0"/>
<rect x="710" y="311" width="240" height="32" fill="#2367b1" rx="0"/>
<rect x="746" y="267" width="15" height="44" fill="#15836e" rx="0"/>
<rect x="806" y="267" width="15" height="44" fill="#15836e" rx="0"/>
<rect x="866" y="267" width="15" height="44" fill="#15836e" rx="0"/>
<rect x="926" y="267" width="15" height="44" fill="#15836e" rx="0"/>
<text x="998" y="276" font-size="17" fill="#173247" font-weight="400">Face on the bed.</text>
<text x="998" y="305" font-size="17" fill="#173247" font-weight="400">Core starts later.</text>
<text x="998" y="334" font-size="17" fill="#173247" font-weight="400">Fit finished tiles</text>
<text x="998" y="363" font-size="17" fill="#173247" font-weight="400">into a carrier.</text>
<text x="676" y="425" font-size="17" fill="#173247" font-weight="400">Strongest change in face orientation.</text>
<text x="676" y="456" font-size="17" fill="#173247" font-weight="400">Many components; bed texture and corner joints.</text>
<text x="676" y="510" font-size="17" fill="#ad6836" font-weight="400">Solid corner lands + gradual transition</text>
<rect x="28" y="560" width="600" height="390" fill="white" rx="13"/>
<text x="48" y="597" font-size="24" fill="#173247" font-weight="700">E3</text>
<text x="48" y="631" font-size="24" fill="#173247" font-weight="700">Support only at boundaries</text>
<path d="M60 672 V774 H300 V672" fill="none" stroke="#15836e" stroke-width="12"/>
<path d="M91 671 V738 H267 V671" fill="none" stroke="#2367b1" stroke-width="14"/>
<rect x="73" y="750" width="33" height="18" fill="#ad6836" rx="0"/>
<rect x="252" y="750" width="33" height="18" fill="#ad6836" rx="0"/>
<text x="359" y="688" font-size="17" fill="#173247" font-weight="400">No contacts behind</text>
<text x="359" y="717" font-size="17" fill="#173247" font-weight="400">the broad face.</text>
<text x="359" y="746" font-size="17" fill="#173247" font-weight="400">Corner/rim loads.</text>
<text x="359" y="775" font-size="17" fill="#173247" font-weight="400">Face flexes in gap.</text>
<text x="48" y="837" font-size="17" fill="#173247" font-weight="400">A genuinely different support/load path.</text>
<text x="48" y="868" font-size="17" fill="#173247" font-weight="400">Higher risk of bowing, sag and hard bottoming.</text>
<text x="48" y="922" font-size="17" fill="#ad6836" font-weight="400">Solid corner lands + gradual transition</text>
<rect x="656" y="560" width="600" height="390" fill="white" rx="13"/>
<text x="676" y="597" font-size="24" fill="#173247" font-weight="700">E4</text>
<text x="676" y="631" font-size="24" fill="#173247" font-weight="700">Thick one-piece face buffer</text>
<rect x="701" y="676" width="21" height="100" fill="#15836e" rx="0"/>
<rect x="845" y="676" width="82" height="100" fill="#2367b1" rx="0"/>
<rect x="722" y="686" width="123" height="10" fill="#15836e" rx="0"/>
<rect x="722" y="726" width="123" height="10" fill="#15836e" rx="0"/>
<rect x="722" y="764" width="123" height="10" fill="#15836e" rx="0"/>
<text x="988" y="688" font-size="17" fill="#173247" font-weight="400">Same print.</text>
<text x="988" y="717" font-size="17" fill="#173247" font-weight="400">More uniform wall</text>
<text x="988" y="746" font-size="17" fill="#173247" font-weight="400">between core and</text>
<text x="988" y="775" font-size="17" fill="#173247" font-weight="400">the visible surface.</text>
<text x="676" y="837" font-size="17" fill="#173247" font-weight="400">Conservative one-piece control.</text>
<text x="676" y="868" font-size="17" fill="#173247" font-weight="400">Still coupled; pattern and damping remain uncertain.</text>
<text x="676" y="922" font-size="17" fill="#ad6836" font-weight="400">Solid corner lands + gradual transition</text>
<text x="38" y="1021" font-size="16" fill="#bd5c24" font-weight="400">Concepts only — no new CAD, exports, slices or presets. These diagrams do not predict a smoother print or damping.</text>
</g>
</svg>
