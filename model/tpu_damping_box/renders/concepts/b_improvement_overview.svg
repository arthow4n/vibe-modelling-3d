<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Three B08-derived surface concepts</title><desc id="desc">SVG proposals only. Compare staggered heights, fewer alternating ties and taller ties in fewer rows. Printed B08 and B16 remain the approved baseline.</desc><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="760" fill="#f3f6f9" rx="0" stroke="none"/><text x="34" y="48" font-size="31" fill="#183246" font-weight="700">Improve B’s object-facing finish</text><text x="34" y="82" font-size="18" fill="#183246" font-weight="400">Three geometry ideas • approved B08 baseline • ordinary Classic slicing remains required</text><text x="34" y="112" font-size="17" fill="#b76520" font-weight="400">PROPOSALS ONLY — no new models, slices or preset changes in this phase</text><rect x="28" y="140" width="374" height="552" fill="white" rx="12" stroke="none"/><text x="48" y="178" font-size="23" fill="#183246" font-weight="700">D1</text><text x="48" y="212" font-size="21" fill="#183246" font-weight="700">Stagger heights</text><text x="48" y="241" font-size="16" fill="#183246" font-weight="400">Same ties, different phases</text><rect x="58" y="269" width="312" height="215" fill="#e9f0f5" rx="4" stroke="none"/><rect x="76.0" y="461.4" width="5.2" height="5.2" fill="#15836e" rx="0" stroke="none"/><rect x="104.6" y="454.9" width="5.2" height="5.2" fill="#15836e" rx="0" stroke="none"/><rect x="133.2" y="447.1" width="5.2" height="5.2" fill="#15836e" rx="0" stroke="none"/><rect x="161.8" y="440.6" width="5.2" height="5.2" fill="#15836e" rx="0" stroke="none"/><rect x="190.4" y="461.4" width="5.2" height="5.2" fill="#15836e" rx="0" stroke="none"/><rect x="219.0" y="454.9" width="5.2" height="5.2" fill="#15836e" rx="0" stroke="none"/><rect x="247.6" y="447.1" width="5.2" height="5.2" fill="#15836e" rx="0" stroke="none"/><rect x="76.0" y="432.8" width="5.2" height="5.2