<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1450" viewBox="0 0 1500 1450" role="img" aria-labelledby="title desc"><title id="title">P1 · SET ASIDE: separately printed cups</title><desc id="desc">User correction: prior thin TPU walls printed poorly. Independent printing does not resolve that risk.. Concept drawings, not evaluated CAD or a slicer result. All TPU is black; colours identify physical roles.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b83232"/></marker></defs><g font-family="DejaVu Sans,sans-serif"><rect width="1500" height="1450" fill="#f3f6f9"/>
<text x="35" y="48" font-size="30" fill="#183247" font-weight="700">P1 · SET ASIDE: separately printed cups</text>
<text x="35" y="83" font-size="19" fill="#183247">User correction: prior thin TPU walls printed poorly. Independent printing does not resolve that risk.</text>
<rect x="35" y="106" width="22" height="18" rx="0" fill="#2466b0" stroke="#183247"/>
<text x="67" y="122" font-size="16" fill="#183247">Contact skin / inner cup</text>
<rect x="405" y="106" width="22" height="18" rx="0" fill="#475569" stroke="#183247"/>
<text x="437" y="122" font-size="16" fill="#183247">Backing / outer carrier</text>
<rect x="790" y="106" width="22" height="18" rx="0" fill="#cf711c" stroke="#183247"/>
<text x="822" y="122" font-size="16" fill="#183247">Flexible core, same TPU</text>
<rect x="1165" y="106" width="22" height="18" rx="0" fill="white" stroke="#183247"/>
<text x="1197" y="122" font-size="16" fill="#183247">Empty space</text>
<text x="35" y="155" font-size="17" fill="#183247">All real parts: BLACK TPU. Pale grey = existing rigid box. Red = force or motion. Schematics, not to scale.</text>
<rect x="30" y="185" width="705" height="430" rx="12" fill="white" stroke="#d4dde6"/>
<text x="50" y="218" font-size="22" fill="#183247" font-weight="700">1 · Plain inner cup: mouth UP</text>
<path d="M90 285V485H365V285H345V465H110V285Z" fill="#2466b0" stroke="#2466b0" stroke-width="2" stroke-linejoin="round"/>
<rect x="65" y="490" width="335" height="9" rx="0" fill="#c5ccd4" stroke="none"/>
<text x="65" y="522" font-size="14" fill="#183247" font-weight="700">PRINT BED</text>
<path d="M375 482L375 415" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arr)"/>
<text x="332" y="408" font-size="16" fill="#183247" font-weight="700">Z ↑</text>
<path d="M227 260L227 315" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arr)"/>
<text x="120" y="244" font-size="18" fill="#183247" font-weight="700">Open mouth — no roof</text>
<text x="425" y="292" font-size="17" fill="#183247">Floor starts on bed.</text>
<text x="425" y="319" font-size="17" fill="#183247">Walls grow from floor.</text>
<text x="425" y="346" font-size="17" fill="#183247"></text>
<text x="425" y="373" font-size="17" fill="#183247">No core touches this cup</text>
<text x="425" y="400" font-size="17" fill="#183247">during printing.</text>
<text x="425" y="427" font-size="17" fill="#183247">This removes core junctions</text>
<text x="425" y="454" font-size="17" fill="#183247">from its wall toolpaths.</text>
<text x="425" y="481" font-size="17" fill="#183247"></text>
<text x="425" y="508" font-size="17" fill="#183247">Still has a seam; no promise</text>
<text x="425" y="535" font-size="17" fill="#183247">of a flawless surface.</text>
<rect x="755" y="185" width="715" height="430" rx="12" fill="white" stroke="#d4dde6"/>
<text x="775" y="218" font-size="22" fill="#183247" font-weight="700">2 · Outer carrier: mouth UP</text>
<path d="M795 278V485H1080V278H1067V470H808V278Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
<rect x="818" y="302" width="18" height="168" rx="0" fill="#cf711c" stroke="none"/>
<path d="M818 302l15 -12h18v168l-15 12" fill="none" stroke="#cf711c" stroke-width="3" stroke-linejoin="round"/>
<rect x="1035" y="302" width="18" height="168" rx="0" fill="#cf711c" stroke="none"/>
<path d="M1035 302l15 -12h18v168l-15 12" fill="none" stroke="#cf711c" stroke-width="3" stroke-linejoin="round"/>
<rect x="865" y="425" width="10" height="45" rx="0" fill="#cf711c" stroke="none"/>
<rect x="915" y="425" width="10" height="45" rx="0" fill="#cf711c" stroke="none"/>
<rect x="965" y="425" width="10" height="45" rx="0" fill="#cf711c" stroke="none"/>
<rect x="785" y="490" width="310" height="9" rx="0" fill="#c5ccd4" stroke="none"/>
<text x="785" y="522" font-size="14" fill="#183247" font-weight="700">PRINT BED</text>
<path d="M1070 482L1070 415" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arr)"/>
<text x="1027" y="408" font-size="16" fill="#183247" font-weight="700">Z ↑</text>
<text x="1110" y="276" font-size="17" fill="#183247">Solid base prints first.</text>
<text x="1110" y="303" font-size="17" fill="#183247">Wall springs rise directly</text>
<text x="1110" y="330" font-size="17" fill="#183247">from that base.</text>
<text x="1110" y="357" font-size="17" fill="#183247"></text>
<text x="1110" y="384" font-size="17" fill="#183247">Same XY spring section</text>
<text x="1110" y="411" font-size="17" fill="#183247">repeats up the wall.</text>
<text x="1110" y="438" font-size="17" fill="#183247">Top channels stay open.</text>
<text x="1110" y="465" font-size="17" fill="#183247"></text>
<text x="1110" y="492" font-size="17" fill="#183247">Floor posts also grow</text>
<text x="1110" y="519" font-size="17" fill="#183247">from the base.</text>
<text x="790" y="580" font-size="17" fill="#183247" font-weight="700">No floating starts. No cap printed over the whole cup or wall gap.</text>
<rect x="30" y="635" width="705" height="425" rx="12" fill="white" stroke="#d4dde6"/>
<text x="50" y="668" font-size="22" fill="#183247" font-weight="700">3 · How the two cups nest: SIDE CUT</text>
<path d="M70 730V950H380V730" fill="none" stroke="#c5ccd4" stroke-width="14" stroke-linejoin="round"/>
<path d="M85 738V932H365V738" fill="none" stroke="#475569" stroke-width="12" stroke-linejoin="round"/>
<path d="M120 755V894H330V755" fill="none" stroke="#2466b0" stroke-width="14" stroke-linejoin="round"/>
<rect x="100" y="780" width="9" height="123" rx="0" fill="#cf711c" stroke="none"/>
<rect x="342" y="780" width="9" height="123" rx="0" fill="#cf711c" stroke="none"/>
<rect x="155" y="901" width="9" height="25" rx="0" fill="#cf711c" stroke="none"/>
<rect x="220" y="901" width="9" height="25" rx="0" fill="#cf711c" stroke="none"/>
<rect x="285" y="901" width="9" height="25" rx="0" fill="#cf711c" stroke="none"/>
<rect x="112" y="730" width="226" height="13" rx="0" fill="#2466b0" stroke="none"/>
<text x="412" y="735" font-size="18" fill="#183247" font-weight="700">One usual lid pad</text>
<text x="412" y="765" font-size="16" fill="#183247">Printed flat separately.</text>
<text x="412" y="791" font-size="16" fill="#183247">Seats at the cup mouth;</text>
<text x="412" y="817" font-size="16" fill="#183247">not a second pair of cups.</text>
<text x="412" y="843" font-size="16" fill="#183247"></text>
<text x="412" y="869" font-size="16" fill="#183247">Floor clearance is occupied</text>
<text x="412" y="895" font-size="16" fill="#183247">partly by integral posts.</text>
<text x="412" y="921" font-size="16" fill="#183247">Posts compress / bend;</text>
<text x="412" y="947" font-size="16" fill="#183247">remaining white is free space.</text>
<text x="412" y="973" font-size="16" fill="#183247"></text>
<text x="412" y="999" font-size="16" fill="#183247">Floor response is untested.</text>
<path d="M336 737H398" fill="none" stroke="#183247" stroke-width="1.5" stroke-linejoin="round"/>
<text x="62" y="1016" font-size="16" fill="#183247" font-weight="700">Solid corner lands in both cup parts; assembly clearance stays open.</text>
<rect x="755" y="635" width="715" height="425" rx="12" fill="white" stroke="#d4dde6"/>
<text x="775" y="668" font-size="22" fill="#183247" font-weight="700">4 · Wall spring: LOOKING DOWN, not a bridge</text>
<text x="780" y="718" font-size="17" fill="#183247" font-weight="700">Before load</text>
<rect x="790" y="748" width="21" height="92" rx="0" fill="#c5ccd4" stroke="none"/>
<rect x="811" y="748" width="16" height="92" rx="0" fill="#475569" stroke="none"/>
<path d="M827 758 C955 758 955 828 827 828" fill="none" stroke="#cf711c" stroke-width="9" stroke-linejoin="round"/>
<rect x="923" y="748" width="17" height="92" rx="0" fill="#2466b0" stroke="none"/>
<path d="M1005 794L950 794" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arr)"/>
<text x="1030" y="783" font-size="16" fill="#183247">Contents push</text>
<text x="1030" y="806" font-size="16" fill="#183247">inner wall outward</text>
<text x="780" y="875" font-size="17" fill="#183247" font-weight="700">Under local load — motion exaggerated</text>
<rect x="790" y="905" width="21" height="92" rx="0" fill="#c5ccd4" stroke="none"/>
<rect x="811" y="905" width="16" height="92" rx="0" fill="#475569" stroke="none"/>
<path d="M827 915 C924 915 924 985 827 985" fill="none" stroke="#cf711c" stroke-width="9" stroke-linejoin="round"/>
<path d="M930 905 Q870 951 930 997" fill="none" stroke="#2466b0" stroke-width="17" stroke-linejoin="round"/>
<path d="M1005 951L912 951" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arr)"/>
<text x="1030" y="940" font-size="16" fill="#183247">Contents push</text>
<text x="1030" y="963" font-size="16" fill="#183247">inner wall outward</text>
<text x="780" y="1030" font-size="16" fill="#183247">Orange bends into white space. Contact pressure can still mark the cup.</text>
<rect x="30" y="1080" width="1440" height="330" rx="12" fill="white" stroke="#d4dde6"/>
<text x="50" y="1113" font-size="22" fill="#183247" font-weight="700">Manufacturing and whole-liner cost</text>
<text x="55" y="1147" font-size="18" fill="#183247">Cup + carrier: upright, open at top; no printed roof across their assembly clearance.</text>
<text x="55" y="1181" font-size="18" fill="#183247">Lid pad: flat, retaining the B08-style short-span core approach; bridge ends need support on both sides.</text>
<text x="55" y="1215" font-size="18" fill="#183247">Assembly: nest the inner cup in the carrier, then seat the one lid pad. No loose springs, glue or clips.</text>
<text x="55" y="1249" font-size="18" fill="#183247">Core-to-surface print coupling is removed from the inner cup; seams, floor stiffness and in-use marks remain open.</text>
<text x="55" y="1283" font-size="18" fill="#183247">3 PIECES TOTAL. Meets your clarified preference: up to two cup pieces, plus the usual lid pad.</text>
<text x="55" y="1317" font-size="18" fill="#183247">Next CAD gate: Classic wall generation, corner clearance, lid seating, spring travel and the floor/lid bridge layers.</text>
</g></svg>