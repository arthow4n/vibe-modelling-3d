<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1450" viewBox="0 0 1500 1450" role="img" aria-labelledby="title desc"><title id="title">P2 · Print a single blank flat, then fold it into a cup</title><desc id="desc">One connected body blank + one lid pad = 2 printed pieces. Four wall folds plus four corner-flap folds.. Concept drawings, not evaluated CAD or a slicer result. All TPU is black; colours identify physical roles.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b83232"/></marker></defs><g font-family="DejaVu Sans,sans-serif"><rect width="1500" height="1450" fill="#f3f6f9"/>
<text x="35" y="48" font-size="30" fill="#183247" font-weight="700">P2 · Print a single blank flat, then fold it into a cup</text>
<text x="35" y="83" font-size="19" fill="#183247">One connected body blank + one lid pad = 2 printed pieces. Four wall folds plus four corner-flap folds.</text>
<rect x="35" y="106" width="22" height="18" rx="0" fill="#2466b0" stroke="#183247"/>
<text x="67" y="122" font-size="16" fill="#183247">Contact skin / inner cup</text>
<rect x="405" y="106" width="22" height="18" rx="0" fill="#475569" stroke="#183247"/>
<text x="437" y="122" font-size="16" fill="#183247">Backing / outer carrier</text>
<rect x="790" y="106" width="22" height="18" rx="0" fill="#cf711c" stroke="#183247"/>
<text x="822" y="122" font-size="16" fill="#183247">Flexible core, same TPU</text>
<rect x="1165" y="106" width="22" height="18" rx="0" fill="white" stroke="#183247"/>
<text x="1197" y="122" font-size="16" fill="#183247">Empty space</text>
<text x="35" y="155" font-size="17" fill="#183247">All real parts: BLACK TPU. Pale grey = existing rigid box. Red = force or motion. Schematics, not to scale.</text>
<rect x="30" y="185" width="815" height="470" rx="12" fill="white" stroke="#d4dde6"/>
<text x="50" y="218" font-size="22" fill="#183247" font-weight="700">1 · Bed view: every contact panel faces DOWN</text>
<rect x="335" y="365" width="110" height="110" rx="0" fill="#475569" stroke="#183247"/>
<text x="361" y="435" font-size="16" fill="white" font-weight="700">FLOOR</text>
<rect x="335" y="255" width="110" height="110" rx="0" fill="#475569" stroke="#183247"/>
<text x="361" y="325" font-size="16" fill="white" font-weight="700">WALL</text>
<rect x="335" y="475" width="110" height="110" rx="0" fill="#475569" stroke="#183247"/>
<text x="361" y="545" font-size="16" fill="white" font-weight="700">WALL</text>
<rect x="225" y="365" width="110" height="110" rx="0" fill="#475569" stroke="#183247"/>
<text x="251" y="435" font-size="16" fill="white" font-weight="700">WALL</text>
<rect x="445" y="365" width="110" height="110" rx="0" fill="#475569" stroke="#183247"/>
<text x="471" y="435" font-size="16" fill="white" font-weight="700">WALL</text>
<rect x="335" y="360" width="110" height="10" rx="0" fill="#cf711c" stroke="none"/>
<rect x="335" y="470" width="110" height="10" rx="0" fill="#cf711c" stroke="none"/>
<rect x="330" y="365" width="10" height="110" rx="0" fill="#cf711c" stroke="none"/>
<rect x="440" y="365" width="10" height="110" rx="0" fill="#cf711c" stroke="none"/>
<rect x="305" y="255" width="30" height="110" rx="0" fill="#475569" stroke="#183247"/>
<path d="M320 255V365" fill="none" stroke="#cf711c" stroke-width="3" stroke-linejoin="round"/>
<rect x="445" y="255" width="30" height="110" rx="0" fill="#475569" stroke="#183247"/>
<path d="M460 255V365" fill="none" stroke="#cf711c" stroke-width="3" stroke-linejoin="round"/>
<rect x="305" y="475" width="30" height="110" rx="0" fill="#475569" stroke="#183247"/>
<path d="M320 475V585" fill="none" stroke="#cf711c" stroke-width="3" stroke-linejoin="round"/>
<rect x="445" y="475" width="30" height="110" rx="0" fill="#475569" stroke="#183247"/>
<path d="M460 475V585" fill="none" stroke="#cf711c" stroke-width="3" stroke-linejoin="round"/>
<text x="62" y="275" font-size="17" fill="#183247">Back skins shown here.</text>
<text x="62" y="302" font-size="17" fill="#183247">Blue contact faces are</text>
<text x="62" y="329" font-size="17" fill="#183247">underneath, on the bed.</text>
<text x="62" y="356" font-size="17" fill="#183247"></text>
<text x="62" y="383" font-size="17" fill="#183247">One connected</text>
<text x="62" y="410" font-size="17" fill="#183247">body blank.</text>
<text x="62" y="437" font-size="17" fill="#183247">No loose tiles.</text>
<path d="M603 430L500 430" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arr)"/>
<text x="610" y="430" font-size="16" fill="#183247">4 walls fold up</text>
<path d="M520 285L477 285" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arr)"/>
<text x="578" y="260" font-size="16" fill="#183247">4 solid flaps fold</text>
<text x="578" y="286" font-size="16" fill="#183247">behind neighbours.</text>
<text x="578" y="312" font-size="16" fill="#183247">The box captures them.</text>
<text x="62" y="628" font-size="17" fill="#183247" font-weight="700">Orange bands = solid flexible folds, not hollow cores or separate hinges.</text>
<rect x="865" y="185" width="605" height="470" rx="12" fill="white" stroke="#d4dde6"/>
<text x="885" y="218" font-size="22" fill="#183247" font-weight="700">2 · Layer order: SECTION through ONE panel</text>
<rect x="895" y="540" width="530" height="9" rx="0" fill="#c5ccd4" stroke="none"/>
<text x="895" y="572" font-size="14" fill="#183247" font-weight="700">PRINT BED</text>
<path d="M1400 532L1400 465" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arr)"/>
<text x="1357" y="458" font-size="16" fill="#183247" font-weight="700">Z ↑</text>
<rect x="915" y="510" width="315" height="25" rx="0" fill="#2466b0" stroke="none"/>
<text x="1250" y="529" font-size="16" fill="#183247" font-weight="700">① Contact skin</text>
<rect x="915" y="456" width="18" height="54" rx="0" fill="#cf711c" stroke="none"/>
<rect x="969" y="456" width="18" height="54" rx="0" fill="#cf711c" stroke="none"/>
<rect x="1023" y="456" width="18" height="54" rx="0" fill="#cf711c" stroke="none"/>
<rect x="1077" y="456" width="18" height="54" rx="0" fill="#cf711c" stroke="none"/>
<rect x="1131" y="456" width="18" height="54" rx="0" fill="#cf711c" stroke="none"/>
<rect x="1185" y="456" width="18" height="54" rx="0" fill="#cf711c" stroke="none"/>
<text x="1242" y="476" font-size="16" fill="#183247" font-weight="700">② Core ribs</text>
<rect x="915" y="438" width="315" height="18" rx="0" fill="#475569" stroke="none"/>
<text x="1242" y="447" font-size="16" fill="#183247" font-weight="700">③ Back skin</text>
<path d="M1004 420L1004 447" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arr)"/>
<text x="905" y="409" font-size="17" fill="#183247" font-weight="700">Short roof bridges, not a box-width roof</text>
<text x="895" y="259" font-size="16" fill="#183247">① Continuous skin goes down first on the bed.</text>
<text x="895" y="283" font-size="16" fill="#183247">② Short ribs rise from it; voids stay between ribs.</text>
<text x="895" y="307" font-size="16" fill="#183247">③ Back skin closes only the small cell spans.</text>
<text x="895" y="331" font-size="16" fill="#183247"></text>
<text x="895" y="355" font-size="16" fill="#183247">Example to investigate: 0.8 mm rib / 1.2 mm gap.</text>
<text x="895" y="379" font-size="16" fill="#183247">These are planning sizes, NOT sliced results.</text>
<text x="897" y="606" font-size="16" fill="#183247">Core is enclosed; bridge droop/stringing stays a risk.</text>
<rect x="30" y="675" width="815" height="400" rx="12" fill="white" stroke="#d4dde6"/>
<text x="50" y="708" font-size="22" fill="#183247" font-weight="700">3 · Fold and insert: simplified assembly view</text>
<path d="M250 965L450 965L520 835L320 835Z" fill="#2466b0" stroke="#183247" stroke-width="2" stroke-linejoin="round"/>
<path d="M250 965L250 875L320 745L320 835Z" fill="#2466b0" stroke="#183247" stroke-width="2" stroke-linejoin="round"/>
<path d="M450 965L450 800L520 745L520 835Z" fill="#2466b0" stroke="#183247" stroke-width="2" stroke-linejoin="round"/>
<path d="M320 835L320 745L520 745L520 835Z" fill="#2466b0" stroke="#183247" stroke-width="2" stroke-linejoin="round"/>
<path d="M450 965L450 800L478 785L478 950Z" fill="#475569" stroke="#183247" stroke-width="1" stroke-linejoin="round"/>
<path d="M185 910L233 852" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arr)"/>
<path d="M585 910L538 852" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arr)"/>
<text x="60" y="760" font-size="16" fill="#183247">Open at top.</text>
<text x="60" y="785" font-size="16" fill="#183247">All contact faces</text>
<text x="60" y="810" font-size="16" fill="#183247">now point inward.</text>
<text x="570" y="775" font-size="16" fill="#183247">Solid corner flap</text>
<text x="570" y="801" font-size="16" fill="#183247">overlaps outside</text>
<text x="570" y="827" font-size="16" fill="#183247">the adjacent wall.</text>
<text x="570" y="853" font-size="16" fill="#183247"></text>
<text x="570" y="879" font-size="16" fill="#183247">Existing box holds</text>
<text x="570" y="905" font-size="16" fill="#183247">the folded shape.</text>
<text x="570" y="931" font-size="16" fill="#183247">No latch or glue.</text>
<text x="62" y="1040" font-size="17" fill="#183247" font-weight="700">Four wall folds + four flap folds, then insert. This may still feel too fiddly.</text>
<rect x="865" y="675" width="605" height="400" rx="12" fill="white" stroke="#d4dde6"/>
<text x="885" y="708" font-size="22" fill="#183247" font-weight="700">4 · Solid corner / flexible fold: SECTION</text>
<rect x="903" y="865" width="490" height="24" rx="0" fill="#2466b0" stroke="none"/>
<rect x="903" y="799" width="150" height="18" rx="0" fill="#475569" stroke="none"/>
<rect x="1243" y="799" width="150" height="18" rx="0" fill="#475569" stroke="none"/>
<rect x="903" y="817" width="18" height="48" rx="0" fill="#cf711c" stroke="none"/>
<rect x="960" y="817" width="18" height="48" rx="0" fill="#cf711c" stroke="none"/>
<rect x="1017" y="817" width="18" height="48" rx="0" fill="#cf711c" stroke="none"/>
<rect x="1243" y="817" width="18" height="48" rx="0" fill="#cf711c" stroke="none"/>
<rect x="1300" y="817" width="18" height="48" rx="0" fill="#cf711c" stroke="none"/>
<rect x="1357" y="817" width="18" height="48" rx="0" fill="#cf711c" stroke="none"/>
<path d="M1053 799L1090 865H1205L1243 799V889H1053Z" fill="#475569" stroke="none" stroke-width="2" stroke-linejoin="round"/>
<path d="M1148 946L1148 900" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arr)"/>
<text x="923" y="978" font-size="16" fill="#183247">Core stops before the fold; solid tapered shoulders.</text>
<text x="923" y="1005" font-size="16" fill="#183247">Fold band is solid but thinner so it can bend.</text>
<text x="895" y="735" font-size="16" fill="#183247">No hollow cell at the fold or corner flap.</text>
<text x="895" y="761" font-size="16" fill="#183247">Solid overlap extends around the assembled corner.</text>
<text x="895" y="787" font-size="16" fill="#183247">Fold width, bend radius and overlap fit are open.</text>
<rect x="30" y="1095" width="1440" height="315" rx="12" fill="white" stroke="#d4dde6"/>
<text x="50" y="1128" font-size="22" fill="#183247" font-weight="700">Manufacturing and whole-liner cost</text>
<text x="55" y="1155" font-size="18" fill="#183247">Body and lid pad both print flat, contact face DOWN. First-layer texture becomes the finished contact texture.</text>
<text x="55" y="1188" font-size="18" fill="#183247">Every contact face is deposited before its core. This avoids upright core junctions beside the growing contact face.</text>
<text x="55" y="1221" font-size="18" fill="#183247">Closed backing still needs small roof bridges. Ordinary Classic slicing must be checked on the selected CAD later.</text>
<text x="55" y="1254" font-size="18" fill="#183247">2 PIECES TOTAL, but eight folds. No pins, loose cores or fasteners. Existing box must capture the walls and flaps.</text>
<text x="55" y="1287" font-size="18" fill="#183247">Risks: corner overlap ridges, hinge fatigue/spring-back, damping loss from dense cells, and a larger flat footprint.</text>
<text x="55" y="1320" font-size="18" fill="#183247">Keep only if a reusable folded insert is acceptable; a one-piece blank is not a zero-assembly preformed cup.</text>
</g></svg>