<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">D1 / Stagger the tie heights</title><desc id="desc">Proposal only. Schematic, not to scale. Enlarged wall sections and a face view with both continuous skins hidden. Green rectangles connect both skins across the gap. Dimensions are candidate discussion choices, not evaluated CAD or actual future slicer paths.</desc><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="1120" fill="#f3f6f9" rx="0" stroke="none"/><text x="36" y="48" font-size="30" fill="#183246" font-weight="700">D1 / Stagger the tie heights</text><text x="36" y="82" font-size="19" fill="#183246" font-weight="400">Same small ties; spread the busy layers through height.</text><text x="36" y="112" font-size="16" fill="#b76520" font-weight="400">Earlier D concepts — insufficient as the main solution; retained for secondary discussion</text><rect x="28" y="140" width="1144" height="180" fill="white" rx="12" stroke="none"/><text x="52" y="174" font-size="22" fill="#183246" font-weight="700">Retain the approved B08 sandwich and both flat faces</text><text x="76" y="207" font-size="16" fill="#2367b1" font-weight="400">Shell-facing skin</text><rect x="76" y="218" width="480" height="15" fill="#2367b1" rx="0" stroke="none"/><rect x="76" y="266" width="480" height="15" fill="#2367b1" rx="0" stroke="none"/><rect x="126" y="233" width="16" height="33" fill="#15836e" rx="0" stroke="none"/><rect x="246" y="233" width="16" height="33" fill="#15836e" rx="0" stroke="none"/><rect x="366" y="233" width="16" height="33" fill="#15836e" rx="0" stroke="none"/><rect x="486" y="233" width="16" height="33" fill="#15836e" rx="0" stroke="none"/><text x="76" y="306" font-size="16" fill="#2367b1" font-weight="400">Object-facing skin — this is the finish to improve</text><text x="616" y="213" font-size="17" fill="#183246" font-weight="400">0.5 skin + 0.6 air gap + 0.5 skin = 1.6 total</text><text x="616" y="240" font-size="17" fill="#183246" font-weight="400">Green ties reach BOTH skins; they are not loose dots.</text><text x="616" y="267" font-size="17" fill="#183246" font-weight="400">Schematic, not to scale; routing is not prescribed.</text><rect x="28" y="336" width="552" height="398" fill="white" rx="12" stroke="none"/><rect x="596" y="336" width="576" height="398" fill="white" rx="12" stroke="none"/><text x="52" y="373" font-size="22" fill="#183246" font-weight="700">Printed B08 reference</text><text x="620" y="373" font-size="22" fill="#183246" font-weight="700">Proposed tie arrangement</text><rect x="96" y="400" width="326" height="281" fill="#e9f0f5" rx="3" stroke="none"/><rect x="664" y="400" width="326" height="281" fill="#e9f0f5" rx="3" stroke="none"/><rect x="116" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="160" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="204" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="248" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="292" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="336" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="380" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="116" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="160" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="204" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="248" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="292" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="336" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="380" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="116" y="568.0" width="8