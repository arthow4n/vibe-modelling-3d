"16" fill="#183246" font-weight="400">Columns begin at different heights</text><text x="52" y="762" font-size="17" fill="#2367b1" font-weight="400">Face views above: both skins hidden to reveal the internal ties.</text><text x="52" y="798" font-size="17" fill="#183246" font-weight="400">Keep 0.8 × 0.8 mm B08 ties and the 4.4 mm repeat.</text><text x="52" y="825" font-size="17" fill="#183246" font-weight="400">Shift adjacent columns by 0 / 1.0 / 2.2 / 3.2 mm in Z.</text><text x="52" y="852" font-size="17" fill="#183246" font-weight="400">Example interior layer: at most 2 of 7 columns active per face.</text><text x="52" y="904" font-size="17" fill="#183246" font-weight="400">Aim: avoid every tie on a wall starting at the same height.</text><text x="52" y="931" font-size="17" fill="#183246" font-weight="400">Broad faces stay flat; skins remain 0.5 mm and the air gap 0.6 mm.</text><text x="52" y="958" font-size="17" fill="#183246" font-weight="400">Trade-off: more layers contain ties; total travel may stay the same or rise.</text><text x="52" y="985" font-size="17" fill="#183246" font-weight="400">Test later: less visible row banding, without losing bonding or damping.</text><text x="36" y="1036" font-size="16" fill="#b76520" font-weight="400">Same nominal tie material per interior repeat; top/bottom layout still open.</text><text x="36" y="1071" font-size="16" fill="#183246" font-weight="400">Classic + ordinary widths remain required. Later: inspect real paths before recommending any print.</text></g></svg>
