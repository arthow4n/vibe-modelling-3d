<rect x="70" y="277" width="48" height="220" fill="#475569" stroke="none" rx="0"/>
<rect x="887" y="277" width="48" height="220" fill="#475569" stroke="none" rx="0"/>
<text x="126" y="250" font-size="17" fill="#183247" font-weight="700">Outer skin against the rigid box</text>
<text x="126" y="538" font-size="17" fill="#183247" font-weight="700">Contact face stays flat. Curves merge into it along a tangent, not a sharp T.</text>
<path d="M965 575L965 506" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arrow)"/>
<text x="602" y="579" font-size="16" fill="#183247">Contents push outward</text>
<rect x="1010" y="185" width="460" height="425" fill="white" stroke="#d4dde6" rx="12"/>
<text x="1030" y="219" font-size="22" fill="#183247" font-weight="700">2 · A different load path</text>
<text x="1035" y="265" font-size="17" fill="#183247">Instead of short straight posts,</text>
<text x="1035" y="292" font-size="17" fill="#183247">long curved web segments bend</text>
<text x="1035" y="319" font-size="17" fill="#183247">into the empty channels.</text>
<text x="1035" y="346" font-size="17" fill="#183247"></text>
<text x="1035" y="373" font-size="17" fill="#183247">Broad rounded joins replace</text>
<text x="1035" y="400" font-size="17" fill="#183247">abrupt T-shaped attachments.</text>
<text x="1035" y="427" font-size="17" fill="#183247"></text>
<text x="1035" y="454" font-size="17" fill="#183247">This is not fewer dots.</text>
<text x="1035" y="481" font-size="17" fill="#183247">It changes the web shape</text>
<text x="1035" y="508" font-size="17" fill="#183247">and its contact geometry.</text>
<text x="1035" y="535" font-size="17" fill="#183247"></text>
<text x="1035" y="562" font-size="17" fill="#183247">Bumps may still occur at joins.</text>
<rect x="30" y="630" width="705" height="355" fill="white" stroke="#d4dde6" rx="12"/>
<text x="50" y="664" font-size="22" fill="#183247" font-weight="700">3 · Before / pushed: small wall region, exaggerated</text>
<text x="55" y="720" font-size="17" fill="#183247" font-weight="700">Before</text>
<rect x="175" y="710" width="440" height="14" fill="#475569" stroke="none" rx="0"/>
