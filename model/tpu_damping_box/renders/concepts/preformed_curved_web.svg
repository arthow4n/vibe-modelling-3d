<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1300" viewBox="0 0 1500 1300" role="img" aria-labelledby="title desc"><title id="title">N2 · A continuous curved web with grazing wall junctions</title><desc id="desc">One preformed cup + one lid pad. CAD-defined core; upright, constant wall section, no folding.. Schematic proposal only, not CAD, sliced paths or measured deformation. All real TPU is black.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b83232"/></marker></defs><g font-family="DejaVu Sans,sans-serif">
<rect x="0" y="0" width="1500" height="1300" fill="#f3f6f9" stroke="none" rx="0"/>
<text x="35" y="49" font-size="29" fill="#183247" font-weight="700">N2 · A continuous curved web with grazing wall junctions</text>
<text x="35" y="84" font-size="18" fill="#183247">One preformed cup + one lid pad. CAD-defined core; upright, constant wall section, no folding.</text>
<rect x="35" y="107" width="22" height="17" fill="#2466b0" stroke="#183247" rx="0"/>
<text x="66" y="122" font-size="16" fill="#183247">Contact face / solid skin</text>
<rect x="430" y="107" width="22" height="17" fill="#475569" stroke="#183247" rx="0"/>
<text x="461" y="122" font-size="16" fill="#183247">Outer skin / solid corner</text>
<rect x="845" y="107" width="22" height="17" fill="#cf711c" stroke="#183247" rx="0"/>
<text x="876" y="122" font-size="16" fill="#183247">Core material</text>
<rect x="1160" y="107" width="22" height="17" fill="white" stroke="#183247" rx="0"/>
<text x="1191" y="122" font-size="16" fill="#183247">Empty space</text>
<text x="35" y="157" font-size="17" fill="#183247">Colours identify roles, not filaments. All TPU BLACK. Pale grey = existing box / bed. Red = force or movement.</text>
<rect x="30" y="185" width="960" height="425" fill="white" stroke="#d4dde6" rx="12"/>
<text x="50" y="219" font-size="22" fill="#183247" font-weight="700">1 · LOOKING DOWN through one wall: straight faces, curved core</text>
<rect x="70" y="277" width="865" height="34" fill="#475569" stroke="none" rx="0"/>
<rect x="70" y="463" width="865" height="34" fill="#2466b0" stroke="none" rx="0"/>
