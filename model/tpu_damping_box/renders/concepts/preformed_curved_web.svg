<path d="M648 970L648 952" fill="none" stroke="#b83232" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="755" y="630" width="715" height="355" fill="white" stroke="#d4dde6" rx="12"/>
<text x="775" y="664" font-size="22" fill="#183247" font-weight="700">4 · How it prints; where bridges remain</text>
<text x="780" y="705" font-size="18" fill="#183247">Cup base first, then the same XY wall section repeats up Z.</text>
<text x="780" y="734" font-size="18" fill="#183247">Each curved web is supported by the web below it.</text>
<text x="780" y="763" font-size="18" fill="#183247">No tie rows switch on and off beside the visible surface.</text>
<text x="780" y="792" font-size="18" fill="#183247"></text>
<text x="780" y="821" font-size="18" fill="#183247">Wall channels stay open at the rim; lid pad covers in use.</text>
<text x="780" y="850" font-size="18" fill="#183247">Floor and pad use a separate short-span closed core,</text>
<text x="780" y="879" font-size="18" fill="#183247">starting from printed B practice—not a wide wavy roof.</text>
<text x="780" y="908" font-size="18" fill="#183247"></text>
<text x="780" y="937" font-size="18" fill="#183247">Example: 1.2–1.5 mm skins, ~1 mm web, deeper air gap.</text>
<rect x="30" y="1005" width="1440" height="260" fill="white" stroke="#d4dde6" rx="12"/>
<text x="50" y="1039" font-size="22" fill="#183247" font-weight="700">Tradeoff and print-path reality</text>
<text x="55" y="1070" font-size="17" fill="#183247">Constant wall geometry may make extrusion/heat conditions less intermittent than B. S also had continuous ribs; that alone failed to beat B.</text>
<text x="55" y="1102" font-size="17" fill="#183247">Curved, tangent joins plus substantial skins are the distinction. This remains a less certain finish hypothesis than changing orientation.</text>
<text x="55" y="1134" font-size="17" fill="#183247">The slicer will still trace internal channel boundaries: one continuous CAD web does NOT mean one uninterrupted nozzle path.</text>
<text x="55" y="1166" font-size="17" fill="#183247">Solid corners taper into the curved core. Skin and web dimensions must leave real bending space; thicker is not automatically better damping.</text>
<text x="55" y="1198" font-size="17" fill="#183247">Next decision: does a representative slice remove abrupt gap-fill/junction routes, and does a print actually beat B without losing damping?</text>
</g></svg>