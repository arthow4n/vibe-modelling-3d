<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">D3 / Taller ties, fewer rows</title><desc id="desc">Proposal only. Schematic, not to scale. Enlarged wall sections and a face view with both continuous skins hidden. Green rectangles connect both skins across the gap. Dimensions are candidate discussion choices, not evaluated CAD or actual future slicer paths.</desc><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="1120" fill="#f3f6f9" rx="0" stroke="none"/><text x="36" y="48" font-size="30" fill="#183246" font-weight="700">D3 / Taller ties, fewer rows</text><text x="36" y="82" font-size="19" fill="#183246" font-weight="400">Keep similar average attachment area; reduce row start/stop events.</text><text x="36" y="112" font-size="16" fill="#b76520" font-weight="400">21 Oct 2026 • SVG DISCUSSION ONLY • no new CAD, slice or profile • dimensions in mm</text><rect x="28" y="140" width="1144" height="180" fill="white" rx="12" stroke="none"/><text x="52" y="174" font-size="22" fill="#183246" font-weight="700">Retain the approved B08 sandwich and both flat faces</text><text x="76" y="207" font-size="16" fill="#2367b1" font-weight="400">Shell-facing skin</text><rect x="76" y="218" width="480" height="15" fill="#2367b1" rx="0" stroke="none"/><rect x="76" y="266" width="480" height="15" fill="#2367b1" rx="0" stroke="none"/><rect x="126" y="233" width="16" height="33" fill="#15836e" rx="0" stroke="none"/><rect x="246" y="233" width="16" height="33" fill="#15836e" rx="0" stroke="none"/><rect x="366" y="233" width="16" height="33" fill="#15836e" rx="0" stroke="none"/><rect x="486" y="233" width="16" height="33" fill="#15836e" rx="0" stroke="none"/><text x="76" y="306" font-size="16" fill="#2367b1" font-weight="400">Object-facing skin — this is the finish to improve</text><text x="616" y="213" font-size="17" fill="#183246" font-weight="400">0.5 skin + 0.6 air gap + 0.5 skin = 1.6 total</text><text x="616" y="240" font-size="17" fill="#183246" font-weight="400">Green ties reach BOTH skins; they are not loose dots.</text><text x="616" y="267" font-size="17" fill="#183246" font-weight="400">Schematic, not to scale; routing is not prescribed.</text><rect x="28" y="336" width="552" height="398" fill="white" rx="12" stroke="none"/><rect x="596" y="336" width="576" height="398" fill="white" rx="12" stroke="none"/><text x="52" y="373" font-size="22" fill="#183246" font-weight="700">Printed B08 reference</text><text x="620" y="373" font-size="22" fill="#183246" font-weight="700">Proposed tie arrangement</text><rect x="96" y="400" width="326" height="281" fill="#e9f0f5" rx="3" stroke="none"/><rect x="664" y="400" width="326" height="281" fill="#e9f0f5" rx="3" stroke="none"/><rect x="116" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="160" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="204" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="248" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="292" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="336" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="380" y="656.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="116" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="160" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="204" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="248" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="292" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="336" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="380" y="612.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="116" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="160" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="204" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="248" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="292" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="336" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="380" y="568.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="116" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="160" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="204" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="248" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="292" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="336" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="380" y="524.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="116" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="160" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="204" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="248" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="292" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="336" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="380" y="480.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="116" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="160" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="204" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="248" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="292" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="336" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="380" y="436.0" width="8" height="8" fill="#15836e" rx="0" stroke="none"/><rect x="684" y="652.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="728" y="652.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="772" y="652.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="816" y="652.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="860" y="652.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="904" y="652.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="948" y="652.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="684" y="564.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="728" y="564.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="772" y="564.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="816" y="564.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="860" y="564.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="904" y="564.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="948" y="564.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="684" y="476.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="728" y="476.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="772" y="476.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="816" y="476.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="860" y="476.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="904" y="476.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><rect x="948" y="476.0" width="8" height="16" fill="#15836e" rx="0" stroke="none"/><line x1="62" y1="660" x2="62" y2="432" stroke="#b76520" stroke-width="2"/><text x="46" y="421" font-size="17" fill="#b76520" font-weight="400">Z ↑</text><text x="108" y="708" font-size="16" fill="#183246" font-weight="400">0.8 × 0.8 ties • rows line up</text><text x="646" y="708" font-size="16" fill="#183246" font-weight="400">0.8 wide × 1.6 high • 8.8 row pitch</text><text x="52" y="762" font-size="17" fill="#2367b1" font-weight="400">Face views above: both skins hidden to reveal the internal ties.</text><text x="52" y="798" font-size="17" fill="#183246" font-weight="400">Keep tie width 0.8 mm; double height to 1.6 mm.</text><text x="52" y="825" font-size="17" fill="#183246" font-weight="400">Keep 4.4 mm horizontal pitch; double row pitch to 8.8 mm.</text><text x="52" y="852" font-size="17" fill="#183246" font-weight="400">Interior repeating attachment fraction matches B08 nominally.</text><text x="52" y="904" font-size="17" fill="#183246" font-weight="400">Aim: each tie persists for 8 layers instead of 4 at 0.2 mm layers.</text><text x="52" y="931" font-size="17" fill="#183246" font-weight="400">Half as many rows means fewer geometry turn-on / turn-off heights.</text><text x="52" y="958" font-size="17" fill="#183246" font-weight="400">Trade-off: 7.2 mm clear height between rows instead of 3.6 mm.</text><text x="52" y="985" font-size="17" fill="#183246" font-weight="400">Total tie-active layers need not fall; stiffness and damping can still change.</text><text x="36" y="1036" font-size="16" fill="#b76520" font-weight="400">These are short rectangular ties, not continuous ribs; large-print survival unknown.</text><text x="36" y="1071" font-size="16" fill="#183246" font-weight="400">Classic + ordinary widths remain required. Later: inspect real paths before recommending any print.</text></g></svg>
