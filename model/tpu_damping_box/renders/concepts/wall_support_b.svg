<rect x="475" y="880" width="14" height="54" rx="0" fill="#13836d" />
<rect x="595" y="880" width="14" height="54" rx="0" fill="#13836d" />
<text x="680" y="866" font-size="19" fill="#172e42" font-weight="normal">Dots become short posts under the roof.</text>
<text x="680" y="898" font-size="19" fill="#172e42" font-weight="normal">Upper skin bridges between the posts.</text>
<text x="680" y="938" font-size="18" fill="#172e42" font-weight="normal">Both skins and an air core are retained.</text>
<text x="38" y="1008" font-size="20" fill="#172e42" font-weight="bold">Goal: find the thinnest usable liner that survives insertion and handling, with useful damping.</text>
<text x="38" y="1041" font-size="18" fill="#172e42" font-weight="normal">One drawn line is conceptual: line width, bonding, bridge behaviour and strength remain unverified.</text>
<text x="38" y="1070" font-size="18" fill="#172e42" font-weight="normal">Later phase: compare complete inserts in the existing experiment shell. This phase: discuss the two ideas.</text>
