<text x="80" y="727" font-size="18" fill="#172e42" font-weight="normal">Ties are separated in BOTH directions: length and height.</text>
<text x="80" y="753" font-size="18" fill="#bc6415" font-weight="normal">Orange = tie undersides proposed to bridge across the gap.</text>
<line x1="985" y1="679" x2="985" y2="536" stroke="#bc6415" stroke-width="3" marker-end="url(#arrow)"/>
<text x="923" y="714" font-size="17" fill="#bc6415" font-weight="normal">Build up</text>
<rect x="24" y="790" width="1052" height="183" rx="14" fill="white" />
<text x="44" y="825" font-size="23" fill="#172e42" font-weight="bold">3  /  Bottom section: same idea turned flat</text>
<text x="80" y="857" font-size="17" fill="#2367b1" font-weight="normal">Contents / upper skin</text>
<rect x="80" y="870" width="550" height="10" rx="0" fill="#2367b1" />
<rect x="80" y="934" width="550" height="10" rx="0" fill="#2367b1" />
