<text x="38" y="48" font-size="31" fill="#173247" font-weight="700">Solid corners with a gradual core transition</text>
<text x="38" y="83" font-size="19" fill="#173247" font-weight="400">A shared principle for the new architectures — existing A/B have corner air cores.</text>
<text x="38" y="116" font-size="16" fill="#bd5c24" font-weight="400">SVG PROPOSAL • 21 Oct 2026 • black TPU • thickness free • no new model or slice</text>
