<text x="64" y="621" font-size="17" fill="#173247" font-weight="400">Blue skins turn the corner; the core stays hollow.</text>
<text x="681" y="621" font-size="17" fill="#173247" font-weight="400">Brown fills the corner core and tapers into green.</text>
<rect x="28" y="677" width="1224" height="342" fill="white" rx="14"/>
<text x="52" y="716" font-size="23" fill="#173247" font-weight="700">Keep the active pattern away from the turn AND soften its return</text>
<text x="52" y="759" font-size="18" fill="#173247" font-weight="400">Solid land g: a discussion starting range is 4–6 mm along EACH adjacent face.</text>
<text x="52" y="793" font-size="18" fill="#173247" font-weight="400">Transition t: taper back to the active core over a further 2–3 mm; lengths are not selected.</text>
<text x="52" y="827" font-size="18" fill="#173247" font-weight="400">Run the plan profile consistently up the upright region; check floor and rim junctions too.</text>
<text x="52" y="861" font-size="18" fill="#173247" font-weight="400">E1/E3: include solid corner lands in the inner cup itself, not only in an added outer frame.</text>
<text x="52" y="895" font-size="18" fill="#173247" font-weight="400">E2: print the broad faces flat; separate solid rails capture and close their corner joints.</text>
<text x="52" y="929" font-size="18" fill="#173247" font-weight="400">Cost: stiffer corner impacts, less active damping area, and a new transition to inspect.</text>
<text x="38" y="1056" font-size="16" fill="#bd5c24" font-weight="400">Schematic, not to scale. A filled corner is not proof of correct seam/flow, or a guaranteed surface-quality cure.</text>
</g>
