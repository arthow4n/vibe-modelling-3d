<text x="75" y="261" class="body">0.8 mm interior skin — 4 layers</text>
<text x="75" y="312" class="body">0.4 mm air</text>
<text x="75" y="371" class="body">0.8 mm backing — 4 layers</text>
<text x="65" y="432" class="body">Total: 2.0 mm. Posts: 0.8 × 0.8 mm; pitch 4.4 mm.</text>
<text x="655" y="159" class="title">Wall section</text>
<rect x="655" y="215" width="72" height="180" fill="#63b5ab" stroke="#19354b"/>
<rect x="727" y="215" width="36" height="180" fill="#f0f4f8" stroke="#19354b"/>
