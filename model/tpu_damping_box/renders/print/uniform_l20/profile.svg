<text x="859" y="258" class="body">0.8 / 0.4 / 0.8</text>
<text x="859" y="294" class="body">= 2.0 mm</text>
<text x="655" y="432" class="body">Same skins, same air-gap thickness.</text>
<text x="65" y="482" class="body">Blue / green / orange are roles in the SAME TPU. Pale regions are empty air.</text>
<text x="65" y="523" class="body">Solid perimeter lands, corners, rim closures and label seats bound the active panels.</text>
<text x="35" y="603" class="body">Nominal geometry, not printed-gap or strength measurement. Both skins use 0.2 mm layers.</text>
<text x="35" y="635" font-size="17">The prior 0.4 / 0.8 / 0.4 floor is superseded; improved printed finish still needs a physical trial.</text></svg>