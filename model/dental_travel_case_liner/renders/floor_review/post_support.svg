<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730"><style>text{font-family:DejaVu Sans,sans-serif}</style><rect x="0" y="0" width="1200" height="730" rx="0" fill="#f4f7fa" stroke="none"/><text x="40" y="46" font-size="28" fill="#182f46" font-weight="bold">A post grid is not continuous bridge support</text><text x="40" y="80" font-size="17" fill="#182f46" font-weight="normal">Top view of the hidden floor core — the roof is omitted so the support pattern is visible.</text><rect x="30" y="110" width="1140" height="450" rx="14" fill="white" stroke="#dbe3eb"/><rect x="75" y="150" width="460" height="330" rx="0" fill="#edf3f8" stroke="#182f46"/><rect x="105.0" y="192.0" width="19.2" height="19.2" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="210.6" y="192.0" width="19.2" height="19.2" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="316.2" y="192.0" width="19.2" height="19.2" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="421.79999999999995" y="192.0" width="19.2" height="19.2" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="105.0" y="297.6" width="19.2" height="19.2" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="210.6" y="297.6" width="19.2" height="19.2" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="316.2" y="297.6" width="19.2" height="19.2" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="421.79999999999995" y="297.6" width="19.2" height="19.2" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="105.0" y="403.2" width="19.2" height="19.2" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="210.6" y="403.2" width="19.2" height="19.2" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="316.2" y="403.2" width="19.2" height="19.2" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="421.79999999999995" y="403.2" width="19.2" height="19.2" rx="0" fill="#e5a45f" stroke="#182f46"/><path d="M75,201.6 L535,201.6" fill="none" stroke="#238b7c" stroke-width="2" stroke-dasharray=""/><path d="M75,250 L535,250" fill="none" stroke="#bd5663" stroke-width="2" stroke-dasharray="8 5"/><text x="575" y="166" font-size="20" fill="#182f46" font-weight="bold">Orange squares = separate TPU posts</text><text x="575" y="203" font-size="20" fill="#182f46" font-weight="normal">Post footprint: 0.8 × 0.8 mm</text><text x="575" y="238" font-size="20" fill="#182f46" font-weight="normal">Centre spacing: 4.4 mm in X and Y</text><text x="575" y="283" font-size="19" fill="#182f46" font-weight="normal">Along a row: 3.6 mm between post faces.</text><text x="575" y="322" font-size="19" fill="#182f46" font-weight="normal">But a line between rows misses the posts.</text><text x="575" y="357" font-size="19" fill="#182f46" font-weight="normal">Its support depends on the perimeter,</text><text x="575" y="386" font-size="19" fill="#182f46" font-weight="normal">nearby strands and the actual path direction.</text><text x="575" y="428" font-size="17" fill="#182f46" font-weight="normal">Green / red lines are illustrative directions,</text><text x="575" y="455" font-size="17" fill="#182f46" font-weight="normal">NOT reconstructed extrusion paths.</text><text x="75" y="526" font-size="18" fill="#182f46" font-weight="normal">A section through posts alone can make the whole floor look better supported than it is.</text><rect x="30" y="582" width="1140" height="112" rx="14" fill="white" stroke="#dbe3eb"/><text x="55" y="615" font-size="21" fill="#182f46" font-weight="bold">What earlier checks did establish</text><text x="55" y="649" font-size="18" fill="#182f46" font-weight="normal">The slicer generated roof paths and retained modeled posts/air. That did not measure sag,</text><text x="55" y="678" font-size="18" fill="#182f46" font-weight="normal">bonding or a crack-resistant surface. The partial print now supplies the missing physical feedback.</text></svg>