<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><style>text{font-family:DejaVu Sans,sans-serif}</style><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f7fa" stroke="none"/><text x="40" y="46" font-size="28" fill="#182f46" font-weight="bold">L20: the floor is thinner than the walls</text><text x="40" y="80" font-size="17" fill="#182f46" font-weight="normal">Current geometry — dental rotary liner and small L20 experiment share this floor recipe.</text><rect x="30" y="108" width="1140" height="300" rx="14" fill="white" stroke="#dbe3eb"/><text x="55" y="143" font-size="23" fill="#182f46" font-weight="bold">Section through a row of posts</text><text x="55" y="174" font-size="18" fill="#182f46" font-weight="normal">Contents / inside of cup</text><rect x="70" y="212" width="600" height="36" rx="0" fill="#68a9e3" stroke="#182f46"/><rect x="70" y="248" width="600" height="72" rx="0" fill="#edf3f8" stroke="#182f46"/><rect x="70" y="320" width="600" height="36" rx="0" fill="#58b5ad" stroke="#182f46"/><rect x="110" y="248" width="28.8" height="72" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="268.4" y="248" width="28.8" height="72" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="426.8" y="248" width="28.8" height="72" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="585.2" y="248" width="28.8" height="72" rx="0" fill="#e5a45f" stroke="#182f46"/><path d="M70,360 L670,360" fill="none" stroke="#182f46" stroke-width="2" stroke-dasharray=""/><text x="75" y="375" font-size="14" fill="#182f46" font-weight="normal">Print bed / rigid-shell-facing side</text><text x="720" y="226" font-size="22" fill="#182f46" font-weight="bold">Interior skin: 0.4 mm</text><text x="720" y="254" font-size="19" fill="#182f46" font-weight="normal">2 × 0.2 mm layers</text><text x="720" y="291" font-size="22" fill="#182f46" font-weight="normal">Air core: 0.8 mm</text><text x="720" y="323" font-size="22" fill="#182f46" font-weight="normal">Bottom skin: 0.4 mm</text><text x="720" y="354" font-size="22" fill="#182f46" font-weight="bold">Total floor: 1.6 mm</text><text x="55" y="393" font-size="17" fill="#182f46" font-weight="normal">Orange = 0.8 × 0.8 mm TPU posts at 4.4 mm pitch. Empty pale regions = air.</text><rect x="30" y="428" width="1140" height="180" rx="14" fill="white" stroke="#dbe3eb"/><text x="55" y="462" font-size="23" fill="#182f46" font-weight="bold">Why the walls can look good while the floor breaks</text><rect x="60" y="483" width="72" height="74" rx="0" fill="#58b5ad" stroke="#182f46"/><rect x="132" y="483" width="36" height="74" rx="0" fill="#edf3f8" stroke="#182f46"/><rect x="168" y="483" width="72" height="74" rx="0" fill="#68a9e3" stroke="#182f46"/><text x="270" y="501" font-size="21" fill="#182f46" font-weight="normal">Wall: 0.8 mm + 0.4 mm air + 0.8 mm = 2.0 mm</text><text x="270" y="535" font-size="19" fill="#182f46" font-weight="normal">Vertical skins stack on earlier material; the floor must close over air.</text><text x="55" y="590" font-size="17" fill="#182f46" font-weight="normal">Colours identify roles in the SAME TPU material; the white/pale core is empty.</text><rect x="30" y="628" width="1140" height="137" rx="14" fill="white" stroke="#dbe3eb"/><text x="55" y="660" font-size="21" fill="#182f46" font-weight="bold">At the supplied 0.2 mm layers, measured from the bed:</text><text x="55" y="694" font-size="18" fill="#182f46" font-weight="normal">Layers 1–2: bottom skin   |   3–6: posts + perimeter, air between   |   7–8: interior roof</text><text x="55" y="727" font-size="17" fill="#182f46" font-weight="normal">Roof paths occur at Z 1.4 / 1.6 mm. If canceled below 1.4 mm, the roof was not printed yet.</text><text x="40" y="789" font-size="15" fill="#182f46" font-weight="normal">Schematic, enlarged thickness; not a photograph, toolpath simulation, or revised model.</text></svg>