<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090"><style>text{font-family:DejaVu Sans,sans-serif}</style><rect x="0" y="0" width="1200" height="1090" rx="0" fill="#f4f7fa" stroke="none"/><text x="40" y="46" font-size="28" fill="#182f46" font-weight="bold">Floor improvement directions — SVG proposals only</text><text x="40" y="80" font-size="17" fill="#182f46" font-weight="normal">Keep the successful upright wall recipe. A, B and C change the floor, not the walls.</text><rect x="30" y="115" width="1140" height="220" rx="14" fill="white" stroke="#dbe3eb"/><text x="55" y="149" font-size="23" fill="#182f46" font-weight="bold">A — More roof, same air space</text><rect x="55" y="175" width="390" height="40.0" rx="0" fill="#68a9e3" stroke="#182f46"/><rect x="55" y="215.0" width="390" height="40.0" rx="0" fill="#edf3f8" stroke="#182f46"/><rect x="55" y="255.0" width="390" height="20.0" rx="0" fill="#58b5ad" stroke="#182f46"/><rect x="75" y="215.0" width="19" height="40.0" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="180" y="215.0" width="19" height="40.0" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="285" y="215.0" width="19" height="40.0" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="390" y="215.0" width="19" height="40.0" rx="0" fill="#e5a45f" stroke="#182f46"/><text x="475" y="193" font-size="18" fill="#182f46" font-weight="normal">2.0 mm total; interior skin grows from 2 to 4 layers.</text><text x="475" y="229" font-size="17" fill="#182f46" font-weight="normal">More material above the first bridge; first-layer support is unchanged.</text><text x="475" y="265" font-size="17" fill="#182f46" font-weight="normal">Costs 0.4 mm per floor if kept inside the same box.</text><text x="55" y="306" font-size="17" fill="#182f46" font-weight="normal">Bottom / air / interior skin: 0.4 / 0.8 / 0.8 mm</text><rect x="30" y="357" width="1140" height="220" rx="14" fill="white" stroke="#dbe3eb"/><text x="55" y="391" font-size="23" fill="#182f46" font-weight="bold">B — Same overall floor, thicker roof</text><rect x="55" y="417" width="390" height="40.0" rx="0" fill="#68a9e3" stroke="#182f46"/><rect x="55" y="457.0" width="390" height="20.0" rx="0" fill="#edf3f8" stroke="#182f46"/><rect x="55" y="477.0" width="390" height="20.0" rx="0" fill="#58b5ad" stroke="#182f46"/><rect x="75" y="457.0" width="19" height="20.0" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="180" y="457.0" width="19" height="20.0" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="285" y="457.0" width="19" height="20.0" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="390" y="457.0" width="19" height="20.0" rx="0" fill="#e5a45f" stroke="#182f46"/><text x="475" y="435" font-size="18" fill="#182f46" font-weight="normal">1.6 mm total; move 0.4 mm from air space into the roof.</text><text x="475" y="471" font-size="17" fill="#182f46" font-weight="normal">Keeps the external fit; roof has 4 layers, but still starts over air.</text><text x="475" y="507" font-size="17" fill="#182f46" font-weight="normal">Air travel is halved; damping may become firmer.</text><text x="55" y="548" font-size="17" fill="#182f46" font-weight="normal">Bottom / air / interior skin: 0.4 / 0.4 / 0.8 mm</text><rect x="30" y="599" width="1140" height="220" rx="14" fill="white" stroke="#dbe3eb"/><text x="55" y="633" font-size="23" fill="#182f46" font-weight="bold">C — Continuous ribs under the existing roof</text><rect x="55" y="659" width="390" height="20.0" rx="0" fill="#68a9e3" stroke="#182f46"/><rect x="55" y="679.0" width="390" height="40.0" rx="0" fill="#edf3f8" stroke="#182f46"/><rect x="55" y="719.0" width="390" height="20.0" rx="0" fill="#58b5ad" stroke="#182f46"/><rect x="75" y="679.0" width="19" height="40.0" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="153" y="679.0" width="19" height="40.0" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="231" y="679.0" width="19" height="40.0" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="309" y="679.0" width="19" height="40.0" rx="0" fill="#e5a45f" stroke="#182f46"/><rect x="387" y="679.0" width="19" height="40.0" rx="0" fill="#e5a45f" stroke="#182f46"/><text x="475" y="677" font-size="18" fill="#182f46" font-weight="normal">1.6 mm total; 0.8 mm ribs at proposed 3.2 mm pitch.</text><text x="475" y="713" font-size="17" fill="#182f46" font-weight="normal">2.4 mm channels; bridge direction should cross the ribs.</text><text x="475" y="749" font-size="17" fill="#182f46" font-weight="normal">More support area, possible print-through / loss of compliance.</text><text x="55" y="790" font-size="17" fill="#182f46" font-weight="normal">Bottom / air / interior skin: 0.4 / 0.8 / 0.4 mm</text><text x="55" y="810" font-size="15" fill="#182f46" font-weight="normal">Orange supports run continuously into the page.</text><rect x="30" y="854" width="1140" height="192" rx="14" fill="white" stroke="#dbe3eb"/><text x="55" y="890" font-size="23" fill="#182f46" font-weight="bold">First separate geometry failure from ironing damage</text><text x="55" y="925" font-size="18" fill="#182f46" font-weight="normal">A future process-only comparison could leave the geometry unchanged and turn ironing OFF.</text><text x="55" y="955" font-size="18" fill="#182f46" font-weight="normal">The current dental preset uses 50% flow, 30 mm/s, 0.15 mm spacing; actual canceled-print</text><text x="55" y="982" font-size="18" fill="#182f46" font-weight="normal">settings and whether ironing ran are unknown. No settings or models have been changed.</text><text x="55" y="1017" font-size="18" fill="#182f46" font-weight="normal">A + C can be combined later if both a fragile roof and poor first-bridge support are confirmed.</text><text x="40" y="1074" font-size="16" fill="#182f46" font-weight="normal">Concept dimensions only. Stiffness, damping, roof quality and fit need review before any printable revision.</text></svg>