<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Vaseline transfer spatula concept B: short fixed handle</title>
  <desc id="desc">Schematic comparison of the current 100 mm handle with a shorter one-piece handle while keeping the existing paddle.</desc>
  <metadata><dc:creator>GPT-6 Luna</dc:creator><dc:date>2026-10-04</dc:date></metadata>
  <defs>
    <style>
      .bg{fill:#f7f5ef}.card{fill:#fff;stroke:#d9dedf;stroke-width:2}.ink{fill:#26343d}.muted{fill:#5a6870}.blade{fill:#f2d9aa;stroke:#9a7440;stroke-width:4}.shaft{fill:#435967;stroke:#26343d;stroke-width:3}.ghost{fill:#d7dfe1;stroke:#9aa7ad;stroke-width:3;stroke-dasharray:8 6}.guide{stroke:#73828a;stroke-width:2;stroke-dasharray:7 7;fill:none}
      text{font-family:Inter,Arial,sans-serif}.title{font-size:34px;font-weight:700;fill:#26343d}.subtitle{font-size:18px;fill:#5a6870}.head{font-size:22px;font-weight:700;fill:#26343d}.body{font-size:17px;fill:#26343d}.small{font-size:15px;fill:#5a6870}.tag{font-size:14px;font-weight:700;letter-spacing:1px;fill:#9a7440}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="48" y="58">B — Shorten the handle; keep one solid tool</text>
  <text class="subtitle" x="48" y="92">No hinge or assembly. Preserve the current paddle and 14 × 7 mm handle section; reduce only the shaft length.</text>

  <rect class="card" x="40" y="125" width="540" height="405" rx="18"/>
  <rect class="card" x="600" y="125" width="560" height="405" rx="18"/>
  <text class="tag" x="68" y="164">CURRENT · 100 mm HANDLE</text>
  <text class="tag" x="628" y="164">COMPACT · 45 mm SKETCH TARGET</text>

  <!-- Current dimensions shown proportionally: 100 mm shaft and 43 mm paddle. -->
  <rect class="shaft" x="83" y="273" width="300" height="42" rx="20"/>
  <rect class="shaft" x="83" y="273" width="58" height="42" rx="20" fill="#314653"/>
  <path class="blade" d="M383 249 H466 Q511 249 511 294 Q511 339 466 339 H383 Z"/>
  <text class="small" x="82" y="365">100 mm handle</text>
  <text class="small" x="408" y="365">43 mm paddle</text>
  <path class="guide" d="M83 389 H511"/>
  <text class="body" x="82" y="423">About 141 mm overall</text>
  <text class="small" x="82" y="452">Existing print: user says the handle feels right.</text>

  <!-- Proposed shortened shaft: same grip cross-section, illustrative 45 mm length. -->
  <rect class="shaft" x="700" y="273" width="135" height="42" rx="20"/>
  <rect class="shaft" x="700" y="273" width="58" height="42" rx="20" fill="#314653"/>
  <path class="blade" d="M835 249 H918 Q963 249 963 294 Q963 339 918 339 H835 Z"/>
  <path class="ghost" d="M835 374 H1135"/>
  <path d="M820 363 L849 385 M849 363 L820 385 M1120 363 L1149 385 M1149 363 L1120 385" stroke="#9aa7ad" stroke-width="3"/>
  <text class="small" x="704" y="365">45 mm proposed shaft length</text>
  <text class="small" x="862" y="408">ghost line: removed length</text>
  <path class="guide" d="M700 423 H963"/>
  <text class="body" x="700" y="457">About 86 mm overall</text>
  <text class="small" x="700" y="486">Sketch target only; holdability needs a real handling check.</text>

  <rect x="40" y="553" width="1120" height="140" rx="18" fill="#eef5f3" stroke="#bdd2cb" stroke-width="2"/>
  <text class="head" x="68" y="591">Simplest compact direction</text>
  <text class="body" x="68" y="624">One-piece construction keeps the paddle continuous and avoids a sticky hinge. The shorter grip gives up reach and leverage.</text>
  <text class="body" x="68" y="654">The paddle is still 30 × 43 mm, so this is not a confirmed fit inside the 38 mm jar mouth.</text>
  <text class="small" x="68" y="678">Concept only · 45 mm is not a qualified ergonomic dimension · no CAD or print made.</text>
  <text class="small" x="1150" y="728" text-anchor="end">Concept drawing by GPT-6 Luna · 2026-10-04</text>
</svg>
