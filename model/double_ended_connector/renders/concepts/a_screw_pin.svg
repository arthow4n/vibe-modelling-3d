<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260">
<title>A  Screw-pin shackles</title><desc>Compact hardware option • ~35 × 16 × 7 mm proposed assembled envelope • 1 printed body + 4 stock metal parts</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cb7629"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#b7c4cf" stroke-width="1"/></pattern></defs>
<rect width="1600" height="1260" fill="#f2f5f9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="49" font-size="30" fill="#203247" font-weight="bold" text-anchor="start">A  Screw-pin shackles</text><text x="38" y="81" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">Compact hardware option • ~35 × 16 × 7 mm proposed assembled envelope • 1 printed body + 4 stock metal parts</text><rect x="28" y="105" width="760" height="543" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><rect x="808" y="105" width="764" height="543" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><text x="52" y="142" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">1  Locked on both ends</text><g transform="translate(244,341) scale(5.4)"><path d="M-5 -31 L-5 -16 Q0 -9 5 -16 L5 -31" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="17" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><g transform="scale(1,1)"><path d="M-4.3 -13 V-8 Q-4.3 -3 0 -3 Q4.3 -3 4.3 -8 V-13" fill="none" stroke="#263d53" stroke-width="3.1" stroke-linecap="butt"/><rect x="-5.25" y="-15.75" width="2.5" height="5.5" rx="0.45" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="2.75" y="-16.7" width="4.0" height="7.4" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><path d="M3.15 -14.6 l1.4 -.8 1.4 .8 v1.6 l-1.4 .8 -1.4 -.8 Z" fill="#cb7629" stroke="white" stroke-width=".2"/><g transform="translate(0,-13)"><rect x="-5.3" y="-1.3" width="12" height="2.6" rx="0.3" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><rect x="-7.5" y="-2.4" width="2.2" height="4.8" rx="0.4" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><path d="M-7.5 0 H-5.3" stroke="white" stroke-width=".4"/><path d="M3.2 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4.8 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M5.6 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/></g></g><g transform="scale(1,-1)"><path d="M-4.3 -13 V-8 Q-4.3 -3 0 -3 Q4.3 -3 4.3 -8 V-13" fill="none" stroke="#263d53" stroke-width="3.1" stroke-linecap="butt"/><rect x="-5.25" y="-15.75" width="2.5" height="5.5" rx="0.45" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="2.75" y="-16.7" width="4.0" height="7.4" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><path d="M3.15 -14.6 l1.4 -.8 1.4 .8 v1.6 l-1.4 .8 -1.4 -.8 Z" fill="#cb7629" stroke="white" stroke-width=".2"/><g transform="translate(0,-13)"><rect x="-5.3" y="-1.3" width="12" height="2.6" rx="0.3" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><rect x="-7.5" y="-2.4" width="2.2" height="4.8" rx="0.4" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><path d="M-7.5 0 H-5.3" stroke="white" stroke-width=".4"/><path d="M3.2 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4.8 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M5.6 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/></g></g><rect x="-2" y="-5" width="4" height="10" rx="1" fill="#263d53" stroke="#263d53" stroke-width="0"/></g><text x="75" y="595" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Gray: existing cord loop above and key ring below.</text><text x="75" y="622" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Only the connector parts are newly made.</text><text x="440" y="188" font-size="18" fill="#203247" font-weight="bold" text-anchor="start">Section along a screw-pin axis</text><rect x="450" y="236" width="55" height="62" rx="3" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="645" y="236" width="80" height="62" rx="3" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="425" y="253" width="285" height="26" rx="3" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><rect x="405" y="242" width="20" height="48" rx="3" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><rect x="664" y="240" width="40" height="54" rx="2" fill="#cb7629" stroke="white" stroke-width="2"/><text x="568" y="331" font-size="15" fill="#203247" font-weight="normal" text-anchor="middle">5.5 mm clear loading gap</text><path d="M508 313 L643 313" fill="none" stroke="#cb7629" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 235 L445 210" fill="none" stroke="#53677b" stroke-width="1.3"/><text x="450" y="214" font-size="15" fill="#203247" font-weight="normal" text-anchor="start">slim horn</text><path d="M685 299 L665 362" fill="none" stroke="#53677b" stroke-width="1.3"/><text x="670" y="366" font-size="15" fill="#203247" font-weight="normal" text-anchor="start">nut pocket</text><text x="440" y="398" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Threaded metal capture closes the opening.</text><text x="440" y="423" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">The nut is trapped against rotation in the body.</text><text x="440" y="448" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">No elastic gate or friction-fit clip is required.</text><text x="832" y="142" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">2  Open only the upper end</text><g transform="translate(1040,343) scale(5.4)"><path d="M-5 -31 L-5 -16 Q0 -9 5 -16 L5 -31" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="17" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><g transform="scale(1,1)"><path d="M-4.3 -13 V-8 Q-4.3 -3 0 -3 Q4.3 -3 4.3 -8 V-13" fill="none" stroke="#263d53" stroke-width="3.1" stroke-linecap="butt"/><rect x="-5.25" y="-15.75" width="2.5" height="5.5" rx="0.45" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="2.75" y="-16.7" width="4.0" height="7.4" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><path d="M3.15 -14.6 l1.4 -.8 1.4 .8 v1.6 l-1.4 .8 -1.4 -.8 Z" fill="#cb7629" stroke="white" stroke-width=".2"/><g transform="translate(-12,-13)"><rect x="-5.3" y="-1.3" width="12" height="2.6" rx="0.3" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><rect x="-7.5" y="-2.4" width="2.2" height="4.8" rx="0.4" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><path d="M-7.5 0 H-5.3" stroke="white" stroke-width=".4"/><path d="M3.2 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4.8 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M5.6 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/></g></g><g transform="scale(1,-1)"><path d="M-4.3 -13 V-8 Q-4.3 -3 0 -3 Q4.3 -3 4.3 -8 V-13" fill="none" stroke="#263d53" stroke-width="3.1" stroke-linecap="butt"/><rect x="-5.25" y="-15.75" width="2.5" height="5.5" rx="0.45" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="2.75" y="-16.7" width="4.0" height="7.4" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><path d="M3.15 -14.6 l1.4 -.8 1.4 .8 v1.6 l-1.4 .8 -1.4 -.8 Z" fill="#cb7629" stroke="white" stroke-width=".2"/><g transform="translate(0,-13)"><rect x="-5.3" y="-1.3" width="12" height="2.6" rx="0.3" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><rect x="-7.5" y="-2.4" width="2.2" height="4.8" rx="0.4" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><path d="M-7.5 0 H-5.3" stroke="white" stroke-width=".4"/><path d="M3.2 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4.8 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M5.6 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/></g></g><rect x="-2" y="-5" width="4" height="10" rx="1" fill="#263d53" stroke="#263d53" stroke-width="0"/></g><path d="M1001.12 272.8 L941.72 272.8" fill="none" stroke="#cb7629" stroke-width="2" marker-end="url(#arrow)"/><text x="1210" y="228" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">a. Unscrew the upper pin from its trapped</text><text x="1210" y="250" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">nut.</text><text x="1210" y="272" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start"></text><text x="1210" y="294" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">b. Withdraw pin sideways; pass the loop</text><text x="1210" y="316" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">off the horn.</text><text x="1210" y="338" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start"></text><text x="1210" y="360" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">c. Replace pin and fully engage its nut to</text><text x="1210" y="382" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">close.</text><text x="1210" y="404" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start"></text><text x="1210" y="442" font-size="14" fill="#138c83" font-weight="bold" text-anchor="start">The lower closure is untouched.</text><text x="1210" y="473" font-size="15" fill="#203247" font-weight="normal" text-anchor="start">Move the gate, not the attached ring.</text><text x="832" y="595" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Orange arrows show the user motion; these gates do not self-close.</text><text x="832" y="622" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Small free horns target the existing ~7.6 mm cord-loop bore.</text><rect x="28" y="672" width="760" height="520" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><rect x="808" y="672" width="764" height="520" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><text x="52" y="713" font-size="21" fill="#203247" font-weight="bold" text-anchor="start">How the whole concept prints and assembles</text><rect x="52" y="737" width="630" height="232" rx="8" fill="#f6f9fb" stroke="#d7e0e8" stroke-width="1"/><rect x="70" y="755" width="310" height="184" rx="7" fill="white" stroke="#a9bac8" stroke-width="1"/><g transform="translate(169,848) scale(3.3)"><g transform="scale(1,1)"><path d="M-4.3 -13 V-8 Q-4.3 -3 0 -3 Q4.3 -3 4.3 -8 V-13" fill="none" stroke="#263d53" stroke-width="3.1" stroke-linecap="butt"/><rect x="-5.25" y="-15.75" width="2.5" height="5.5" rx="0.45" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="2.75" y="-16.7" width="4.0" height="7.4" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><path d="M3.15 -14.6 l1.4 -.8 1.4 .8 v1.6 l-1.4 .8 -1.4 -.8 Z" fill="#cb7629" stroke="white" stroke-width=".2"/><g transform="translate(0,-13)"><rect x="-5.3" y="-1.3" width="12" height="2.6" rx="0.3" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><rect x="-7.5" y="-2.4" width="2.2" height="4.8" rx="0.4" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><path d="M-7.5 0 H-5.3" stroke="white" stroke-width=".4"/><path d="M3.2 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4.8 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M5.6 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/></g></g><g transform="scale(1,-1)"><path d="M-4.3 -13 V-8 Q-4.3 -3 0 -3 Q4.3 -3 4.3 -8 V-13" fill="none" stroke="#263d53" stroke-width="3.1" stroke-linecap="butt"/><rect x="-5.25" y="-15.75" width="2.5" height="5.5" rx="0.45" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="2.75" y="-16.7" width="4.0" height="7.4" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><path d="M3.15 -14.6 l1.4 -.8 1.4 .8 v1.6 l-1.4 .8 -1.4 -.8 Z" fill="#cb7629" stroke="white" stroke-width=".2"/><g transform="translate(0,-13)"><rect x="-5.3" y="-1.3" width="12" height="2.6" rx="0.3" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><rect x="-7.5" y="-2.4" width="2.2" height="4.8" rx="0.4" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><path d="M-7.5 0 H-5.3" stroke="white" stroke-width=".4"/><path d="M3.2 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4.8 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M5.6 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/></g></g><rect x="-2" y="-5" width="4" height="10" rx="1" fill="#263d53" stroke="#263d53" stroke-width="0"/></g><text x="252" y="802" font-size="15" fill="#203247" font-weight="bold" text-anchor="start">1 body</text><text x="252" y="827" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">flat on bed</text><text x="70" y="1004" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Printed: one body, large face down.</text><text x="70" y="1031" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Add 2 × M3×12 screws + 2 × M3 nuts.</text><text x="70" y="1058" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Seat each nut in an accessible anti-turn pocket.</text><text x="70" y="1085" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">No bought spring or printed tool is needed.</text><text x="70" y="1133" font-size="15" fill="#203247" font-weight="bold" text-anchor="start">PLA or PETG • 0.4 mm nozzle / 0.2 mm layers assumed</text><text x="70" y="1161" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">No spring, live hinge, snap flexure or press-fit retention.</text><text x="832" y="714" font-size="21" fill="#203247" font-weight="bold" text-anchor="start">Why it stays closed / what still needs testing</text><text x="832" y="759" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">The screw pin physically bridges each mouth.</text><text x="832" y="787" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">Metal thread engagement captures the pin; the nut</text><text x="832" y="815" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">cannot spin inside its shaped pocket. A standard tool</text><text x="832" y="843" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">is needed. There is no independent anti-loosening latch.</text><text x="832" y="914" font-size="18" fill="#203247" font-weight="bold" text-anchor="start">Next qualification, if selected</text><text x="832" y="948" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Confirm horn-to-loop entry and gate/socket fit.</text><text x="832" y="976" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Check both closed ends under pull, twist and shaking.</text><text x="832" y="1004" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Check thread back-out, wear and finger access.</text><text x="832" y="1032" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Proposed geometry has no measured load rating.</text><text x="38" y="1220" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Concept drawing only: dimensions, fits, threads and strength are not CAD-, slicer- or print-qualified.</text></g></svg>
