<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<title>A connector that opens at either end</title><desc>SVG proposals for PLA or PETG • independent closures • no spring, snap flexure or press-fit retention</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cb7629"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#b7c4cf" stroke-width="1"/></pattern></defs>
<rect width="1600" height="1080" fill="#f2f5f9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="49" font-size="30" fill="#203247" font-weight="bold" text-anchor="start">A connector that opens at either end</text><text x="38" y="81" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">SVG proposals for PLA or PETG • independent closures • no spring, snap flexure or press-fit retention</text><rect x="28" y="105" width="504" height="880" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><text x="50" y="143" font-size="21" fill="#203247" font-weight="bold" text-anchor="start">A  Screw-pin shackles</text><text x="50" y="174" font-size="15" fill="#53677b" font-weight="bold" text-anchor="start">Compact hardware option</text><g transform="translate(280,372) scale(5.0)"><path d="M-5 -31 L-5 -16 Q0 -9 5 -16 L5 -31" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="17" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><g transform="scale(1,1)"><path d="M-4.3 -13 V-8 Q-4.3 -3 0 -3 Q4.3 -3 4.3 -8 V-13" fill="none" stroke="#263d53" stroke-width="3.1" stroke-linecap="butt"/><rect x="-5.25" y="-15.75" width="2.5" height="5.5" rx="0.45" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="2.75" y="-16.7" width="4.0" height="7.4" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><path d="M3.15 -14.6 l1.4 -.8 1.4 .8 v1.6 l-1.4 .8 -1.4 -.8 Z" fill="#cb7629" stroke="white" stroke-width=".2"/><g transform="translate(0,-13)"><rect x="-5.3" y="-1.3" width="12" height="2.6" rx="0.3" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><rect x="-7.5" y="-2.4" width="2.2" height="4.8" rx="0.4" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><path d="M-7.5 0 H-5.3" stroke="white" stroke-width=".4"/><path d="M3.2 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4.8 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M5.6 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/></g></g><g transform="scale(1,-1)"><path d="M-4.3 -13 V-8 Q-4.3 -3 0 -3 Q4.3 -3 4.3 -8 V-13" fill="none" stroke="#263d53" stroke-width="3.1" stroke-linecap="butt"/><rect x="-5.25" y="-15.75" width="2.5" height="5.5" rx="0.45" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="2.75" y="-16.7" width="4.0" height="7.4" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><path d="M3.15 -14.6 l1.4 -.8 1.4 .8 v1.6 l-1.4 .8 -1.4 -.8 Z" fill="#cb7629" stroke="white" stroke-width=".2"/><g transform="translate(0,-13)"><rect x="-5.3" y="-1.3" width="12" height="2.6" rx="0.3" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><rect x="-7.5" y="-2.4" width="2.2" height="4.8" rx="0.4" fill="#cb7629" stroke="#cb7629" stroke-width="0.15"/><path d="M-7.5 0 H-5.3" stroke="white" stroke-width=".4"/><path d="M3.2 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M4.8 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/><path d="M5.6 -1.25 l-.6 2.5" stroke="white" stroke-width=".28"/></g></g><rect x="-2" y="-5" width="4" height="10" rx="1" fill="#263d53" stroke="#263d53" stroke-width="0"/></g><text x="280" y="606" font-size="18" fill="#203247" font-weight="bold" text-anchor="middle">~35 × 16 × 7 mm</text><text x="280" y="635" font-size="16" fill="#53677b" font-weight="normal" text-anchor="middle">1 printed body + 4 stock metal parts</text><text x="50" y="682" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Each screw is the gate across an open U-eye.</text><text x="50" y="709" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Use an existing M3 screw and nut at each end.</text><text x="50" y="736" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Remove one pin; lift that loop off the slim horn.</text><path d="M50 770 H508" stroke="#d7e0e8"/><text x="50" y="803" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Needs a tool; each removed pin is a loose part.</text><text x="50" y="830" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Metal threads avoid small printed screw threads.</text><text x="50" y="886" font-size="14" fill="#203247" font-weight="normal" text-anchor="start">Open either end without rotating the attached loop.</text><text x="50" y="917" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">Detailed opening / lock / print views in A.</text><text x="50" y="954" font-size="12" fill="#53677b" font-weight="normal" text-anchor="start">Schematic views; dimensions are design targets.</text><rect x="548" y="105" width="504" height="880" rx="10" fill="white" stroke="#138c83" stroke-width="2"/><text x="570" y="143" font-size="21" fill="#203247" font-weight="bold" text-anchor="start">B  Sliding gates + keeper screws</text><text x="570" y="174" font-size="15" fill="#138c83" font-weight="bold" text-anchor="start">Recommended all-printed starting point</text><g transform="translate(800,372) scale(5.0)"><path d="M-5 -35 L-5 -20 Q0 -13 5 -20 L5 -35" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="21" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" fill="#263d53"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" transform="scale(1,-1)" fill="#263d53"/><rect x="-3" y="-4" width="6" height="8" rx="0" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="scale(1,1)"><rect x="0" y="-8.7" width="9.7" height="7.8" rx="1" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="4.3" y="-17" width="5.5" height="3.2" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="translate(0,0)"><rect x="5.8" y="-16" width="3.2" height="11.8" rx="0.35" fill="#138c83" stroke="white" stroke-width="0.18"/><rect x="0.6" y="-8.1" width="7.9" height="6.8" rx="1" fill="#138c83" stroke="white" stroke-width="0.18"/><circle cx="4.5" cy="-4.7" r="3.4" fill="#cb7629" stroke="white" stroke-width=".25"/><path d="M2.8 -4.7 H6.2" stroke="white" stroke-width=".45"/></g></g><g transform="scale(1,-1)"><rect x="0" y="-8.7" width="9.7" height="7.8" rx="1" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="4.3" y="-17" width="5.5" height="3.2" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="translate(0,0)"><rect x="5.8" y="-16" width="3.2" height="11.8" rx="0.35" fill="#138c83" stroke="white" stroke-width="0.18"/><rect x="0.6" y="-8.1" width="7.9" height="6.8" rx="1" fill="#138c83" stroke="white" stroke-width="0.18"/><circle cx="4.5" cy="-4.7" r="3.4" fill="#cb7629" stroke="white" stroke-width=".25"/><path d="M2.8 -4.7 H6.2" stroke="white" stroke-width=".45"/></g></g></g><text x="800" y="606" font-size="18" fill="#203247" font-weight="bold" text-anchor="middle">~42 × 20 × 9 mm</text><text x="800" y="635" font-size="16" fill="#53677b" font-weight="normal" text-anchor="middle">5 printed parts; no metal or springs</text><text x="570" y="682" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">A straight gate seats in the opposite horn.</text><text x="570" y="709" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">A separate screw indexes the gate in its guide.</text><text x="570" y="736" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Remove keeper, retract gate, then lift it out.</text><path d="M570 770 H1028" stroke="#d7e0e8"/><text x="570" y="803" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Three deliberate actions; two loose pieces per end.</text><text x="570" y="830" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Guide clearance and printed threads need a trial.</text><text x="570" y="886" font-size="14" fill="#203247" font-weight="normal" text-anchor="start">Open either end without rotating the attached loop.</text><text x="570" y="917" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">Detailed opening / lock / print views in B.</text><text x="570" y="954" font-size="12" fill="#53677b" font-weight="normal" text-anchor="start">Schematic views; dimensions are design targets.</text><rect x="1068" y="105" width="504" height="880" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><text x="1090" y="143" font-size="21" fill="#203247" font-weight="bold" text-anchor="start">C  Hinged gates + screw latches</text><text x="1090" y="174" font-size="15" fill="#53677b" font-weight="bold" text-anchor="start">Gate stays attached</text><g transform="translate(1320,372) scale(5.0)"><path d="M-5 -35 L-5 -20 Q0 -13 5 -20 L5 -35" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="21" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" fill="#263d53"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" transform="scale(1,-1)" fill="#263d53"/><rect x="-3" y="-4" width="6" height="8" rx="0" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="scale(1,1)"><rect x="-4.5" y="-10" width="14.5" height="9.2" rx="1.2" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="4.3" y="-17" width="5.5" height="3.2" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="rotate(0,7.4,-7.4)"><rect x="5.8" y="-16" width="3.2" height="10" rx="0.5" fill="#138c83" stroke="white" stroke-width="0.18"/><rect x="-4.2" y="-8.8" width="13.5" height="4.8" rx="1" fill="#138c83" stroke="white" stroke-width="0.18"/><circle cx="-0.5" cy="-6.4" r="3.4" fill="#cb7629" stroke="white" stroke-width=".25"/><path d="M-2.2 -6.4 H1.2" stroke="white" stroke-width=".45"/></g><circle cx="7.4" cy="-7.4" r="1.35" fill="#cb7629" stroke="white" stroke-width=".2"/></g><g transform="scale(1,-1)"><rect x="-4.5" y="-10" width="14.5" height="9.2" rx="1.2" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="4.3" y="-17" width="5.5" height="3.2" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="rotate(0,7.4,-7.4)"><rect x="5.8" y="-16" width="3.2" height="10" rx="0.5" fill="#138c83" stroke="white" stroke-width="0.18"/><rect x="-4.2" y="-8.8" width="13.5" height="4.8" rx="1" fill="#138c83" stroke="white" stroke-width="0.18"/><circle cx="-0.5" cy="-6.4" r="3.4" fill="#cb7629" stroke="white" stroke-width=".25"/><path d="M-2.2 -6.4 H1.2" stroke="white" stroke-width=".45"/></g><circle cx="7.4" cy="-7.4" r="1.35" fill="#cb7629" stroke="white" stroke-width=".2"/></g></g><text x="1320" y="606" font-size="18" fill="#203247" font-weight="bold" text-anchor="middle">~44 × 20 × 10 mm</text><text x="1320" y="635" font-size="16" fill="#53677b" font-weight="normal" text-anchor="middle">7 printed parts; no metal or springs</text><text x="1090" y="682" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">A rigid hinged gate seats into the opposite horn.</text><text x="1090" y="709" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">A screw through the gate heel blocks rotation.</text><text x="1090" y="736" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Remove latch screw, swing gate outward; no flexing.</text><path d="M1090 770 H1548" stroke="#d7e0e8"/><text x="1090" y="803" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">More parts and hinge wear to qualify.</text><text x="1090" y="830" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Gate needs temporary clearance while opening.</text><text x="1090" y="886" font-size="14" fill="#203247" font-weight="normal" text-anchor="start">Open either end without rotating the attached loop.</text><text x="1090" y="917" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">Detailed opening / lock / print views in C.</text><text x="1090" y="954" font-size="12" fill="#53677b" font-weight="normal" text-anchor="start">Schematic views; dimensions are design targets.</text><text x="38" y="1018" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">Color key: navy = rigid body; teal = moving gate; orange = fastener (metal in A, printed in B/C); gray = existing loops.</text><text x="38" y="1045" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">Generic fit target: 3.2 mm cord, key-ring wire up to 3 mm, ~6 mm loading gap. Concepts only; no load or print qualification.</text></g></svg>
