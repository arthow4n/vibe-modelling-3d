<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260">
<title>C  Hinged gates + screw latches</title><desc>Gate stays attached • ~44 × 20 × 10 mm proposed assembled envelope • 7 printed parts; no metal or springs</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cb7629"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#b7c4cf" stroke-width="1"/></pattern></defs>
<rect width="1600" height="1260" fill="#f2f5f9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="49" font-size="30" fill="#203247" font-weight="bold" text-anchor="start">C  Hinged gates + screw latches</text><text x="38" y="81" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">Gate stays attached • ~44 × 20 × 10 mm proposed assembled envelope • 7 printed parts; no metal or springs</text><rect x="28" y="105" width="760" height="543" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><rect x="808" y="105" width="764" height="543" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><text x="52" y="142" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">1  Locked on both ends</text><g transform="translate(244,341) scale(5.4)"><path d="M-5 -35 L-5 -20 Q0 -13 5 -20 L5 -35" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="21" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" fill="#263d53"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" transform="scale(1,-1)" fill="#263d53"/><rect x="-3" y="-4" width="6" height="8" rx="0" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="scale(1,1)"><rect x="-4.5" y="-10" width="14.5" height="9.2" rx="1.2" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="4.3" y="-17" width="5.5" height="3.2" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="rotate(0,7.4,-7.4)"><rect x="5.8" y="-16" width="3.2" height="10" rx="0.5" fill="#138c83" stroke="white" stroke-width="0.18"/><rect x="-4.2" y="-8.8" width="13.5" height="4.8" rx="1" fill="#138c83" stroke="white" stroke-width="0.18"/><circle cx="-0.5" cy="-6.4" r="3.4" fill="#cb7629" stroke="white" stroke-width=".25"/><path d="M-2.2 -6.4 H1.2" stroke="white" stroke-width=".45"/></g><circle cx="7.4" cy="-7.4" r="1.35" fill="#cb7629" stroke="white" stroke-width=".2"/></g><g transform="scale(1,-1)"><rect x="-4.5" y="-10" width="14.5" height="9.2" rx="1.2" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="4.3" y="-17" width="5.5" height="3.2" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="rotate(0,7.4,-7.4)"><rect x="5.8" y="-16" width="3.2" height="10" rx="0.5" fill="#138c83" stroke="white" stroke-width="0.18"/><rect x="-4.2" y="-8.8" width="13.5" height="4.8" rx="1" fill="#138c83" stroke="white" stroke-width="0.18"/><circle cx="-0.5" cy="-6.4" r="3.4" fill="#cb7629" stroke="white" stroke-width=".25"/><path d="M-2.2 -6.4 H1.2" stroke="white" stroke-width=".45"/></g><circle cx="7.4" cy="-7.4" r="1.35" fill="#cb7629" stroke="white" stroke-width=".2"/></g></g><text x="75" y="595" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Gray: existing cord loop above and key ring below.</text><text x="75" y="622" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Only the connector parts are newly made.</text><text x="440" y="188" font-size="18" fill="#203247" font-weight="bold" text-anchor="start">Heel index + seated gate nose</text><rect x="455" y="236" width="282" height="90" rx="8" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="462" y="243" width="263" height="28" rx="3" fill="#138c83" stroke="white" stroke-width="2"/><circle cx="515" cy="257" r="17" fill="#cb7629" stroke="white" stroke-width="2"/><circle cx="586" cy="257" r="19" fill="#cb7629" stroke="white" stroke-width="2"/><rect x="702" y="222" width="44" height="72" rx="2" fill="#263d53" stroke="white" stroke-width="2"/><path d="M515 274 L465 371" fill="none" stroke="#53677b" stroke-width="1.3"/><text x="470" y="375" font-size="15" fill="#203247" font-weight="normal" text-anchor="start">index screw</text><path d="M586 276 L575 399" fill="none" stroke="#53677b" stroke-width="1.3"/><text x="580" y="403" font-size="15" fill="#203247" font-weight="normal" text-anchor="start">hinge pin</text><text x="440" y="436" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Gate tongue bears against a rigid horn pocket.</text><text x="440" y="461" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">A screw through the heel blocks rotation.</text><text x="440" y="486" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Hinge allows movement only after unlocking.</text><text x="832" y="142" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">2  Open only the upper end</text><g transform="translate(1040,343) scale(5.4)"><path d="M-5 -35 L-5 -20 Q0 -13 5 -20 L5 -35" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="21" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" fill="#263d53"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" transform="scale(1,-1)" fill="#263d53"/><rect x="-3" y="-4" width="6" height="8" rx="0" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="scale(1,1)"><rect x="-4.5" y="-10" width="14.5" height="9.2" rx="1.2" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="4.3" y="-17" width="5.5" height="3.2" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="rotate(70,7.4,-7.4)"><rect x="5.8" y="-16" width="3.2" height="10" rx="0.5" fill="#138c83" stroke="white" stroke-width="0.18"/><rect x="-4.2" y="-8.8" width="13.5" height="4.8" rx="1" fill="#138c83" stroke="white" stroke-width="0.18"/><circle cx="-.5" cy="-6.4" r="1.3" fill="white"/></g><circle cx="7.4" cy="-7.4" r="1.35" fill="#cb7629" stroke="white" stroke-width=".2"/></g><g transform="scale(1,-1)"><rect x="-4.5" y="-10" width="14.5" height="9.2" rx="1.2" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="4.3" y="-17" width="5.5" height="3.2" rx="0.6" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="rotate(0,7.4,-7.4)"><rect x="5.8" y="-16" width="3.2" height="10" rx="0.5" fill="#138c83" stroke="white" stroke-width="0.18"/><rect x="-4.2" y="-8.8" width="13.5" height="4.8" rx="1" fill="#138c83" stroke="white" stroke-width="0.18"/><circle cx="-0.5" cy="-6.4" r="3.4" fill="#cb7629" stroke="white" stroke-width=".25"/><path d="M-2.2 -6.4 H1.2" stroke="white" stroke-width=".45"/></g><circle cx="7.4" cy="-7.4" r="1.35" fill="#cb7629" stroke="white" stroke-width=".2"/></g></g><path d="M1075 252 Q1140 248 1145 303" fill="none" stroke="#cb7629" stroke-width="2" marker-end="url(#arrow)"/><text x="1210" y="228" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">a. Remove only the upper heel-index screw.</text><text x="1210" y="250" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start"></text><text x="1210" y="272" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">b. Swing the upper gate outward about 70°.</text><text x="1210" y="294" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start"></text><text x="1210" y="316" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">c. Reseat tongue; reinstall the index</text><text x="1210" y="338" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">screw.</text><text x="1210" y="360" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start"></text><text x="1210" y="442" font-size="14" fill="#138c83" font-weight="bold" text-anchor="start">The lower closure is untouched.</text><text x="1210" y="473" font-size="15" fill="#203247" font-weight="normal" text-anchor="start">Move the gate, not the attached ring.</text><text x="832" y="595" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Orange arrows show the user motion; these gates do not self-close.</text><text x="832" y="622" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Small free horns target the existing ~7.6 mm cord-loop bore.</text><rect x="28" y="672" width="760" height="520" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><rect x="808" y="672" width="764" height="520" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><text x="52" y="713" font-size="21" fill="#203247" font-weight="bold" text-anchor="start">How the whole concept prints and assembles</text><rect x="52" y="737" width="630" height="232" rx="8" fill="#f6f9fb" stroke="#d7e0e8" stroke-width="1"/><rect x="70" y="755" width="310" height="184" rx="7" fill="white" stroke="#a9bac8" stroke-width="1"/><rect x="108" y="781" width="60" height="120" rx="15" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="121" y="792" width="34" height="39" rx="10" fill="white" stroke="white" stroke-width="0"/><rect x="121" y="851" width="34" height="39" rx="10" fill="white" stroke="white" stroke-width="0"/><text x="84" y="952" font-size="12" fill="#53677b" font-weight="normal" text-anchor="start">1 body: flat face down</text><rect x="205" y="788" width="19" height="67" rx="4" fill="#138c83" stroke="#138c83" stroke-width="0"/><rect x="199" y="845" width="31" height="22" rx="4" fill="#138c83" stroke="#138c83" stroke-width="0"/><rect x="253" y="788" width="19" height="67" rx="4" fill="#138c83" stroke="#138c83" stroke-width="0"/><rect x="247" y="845" width="31" height="22" rx="4" fill="#138c83" stroke="#138c83" stroke-width="0"/><text x="196" y="892" font-size="12" fill="#53677b" font-weight="normal" text-anchor="start">2 gates: flat</text><rect x="207" y="912" width="19" height="9" rx="3" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><rect x="213" y="900" width="7" height="12" rx="1" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><rect x="237" y="912" width="19" height="9" rx="3" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><rect x="243" y="900" width="7" height="12" rx="1" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><rect x="267" y="912" width="19" height="9" rx="3" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><rect x="273" y="900" width="7" height="12" rx="1" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><rect x="297" y="912" width="19" height="9" rx="3" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><rect x="303" y="900" width="7" height="12" rx="1" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><text x="402" y="774" font-size="15" fill="#203247" font-weight="bold" text-anchor="start">4 printed fasteners</text><text x="402" y="800" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">head on bed, shaft upright</text><text x="70" y="1004" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">7 printed parts: body, 2 gates, 2 hinge pins,</text><text x="70" y="1031" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">and 2 latch screws. Assemble gates onto pins,</text><text x="70" y="1058" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Pins enter from back; latch screws enter from front.</text><text x="70" y="1085" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Coarse printed threads; hinge wear needs a trial.</text><text x="70" y="1133" font-size="15" fill="#203247" font-weight="bold" text-anchor="start">PLA or PETG • 0.4 mm nozzle / 0.2 mm layers assumed</text><text x="70" y="1161" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">No spring, live hinge, snap flexure or press-fit retention.</text><text x="832" y="714" font-size="21" fill="#203247" font-weight="bold" text-anchor="start">Why it stays closed / what still needs testing</text><text x="832" y="759" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">A tongue/socket seat supports the closed gate.</text><text x="832" y="787" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">The heel screw passes through an indexing hole and</text><text x="832" y="815" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">prevents hinge rotation. The hinge pin and index screw</text><text x="832" y="843" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">are separate; no resilient gate return is required.</text><text x="832" y="914" font-size="18" fill="#203247" font-weight="bold" text-anchor="start">Next qualification, if selected</text><text x="832" y="948" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Confirm horn-to-loop entry and gate/socket fit.</text><text x="832" y="976" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Check both closed ends under pull, twist and shaking.</text><text x="832" y="1004" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Check thread back-out, wear and finger access.</text><text x="832" y="1032" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Proposed geometry has no measured load rating.</text><text x="38" y="1220" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Concept drawing only: dimensions, fits, threads and strength are not CAD-, slicer- or print-qualified.</text></g></svg>
