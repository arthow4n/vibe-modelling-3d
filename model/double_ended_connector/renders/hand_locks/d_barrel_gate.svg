<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220">
<title>D  Threaded barrel gate</title><desc>Hand operation • all connector components printed • no reliance on bending, spring return or friction-fit snaps</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cb7629"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#b7c4cf" stroke-width="1"/></pattern></defs>
<rect width="1600" height="1220" fill="#f2f5f9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="49" font-size="30" fill="#203247" font-weight="bold" text-anchor="start">D  Threaded barrel gate</text><text x="38" y="81" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">Hand operation • all connector components printed • no reliance on bending, spring return or friction-fit snaps</text><rect x="28" y="110" width="760" height="540" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><rect x="808" y="110" width="764" height="540" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><text x="52" y="151" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">Both ends closed</text><g transform="translate(190,375) scale(5.7)"><path d="M-5 -35 L-5 -20 Q0 -13 5 -20 L5 -35" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="21" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" fill="#263d53"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" transform="scale(1,-1)" fill="#263d53"/><rect x="-3" y="-4" width="6" height="8" rx="0" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="scale(1,1)"><rect x="5.7" y="-9.5" width="3.4" height="10" rx="0.3" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="4.5" y="-16" width="6" height="11" rx="0.7" fill="#138c83" stroke="white" stroke-width="0.2"/><path d="M4.8 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M6.0 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M7.199999999999999 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M8.399999999999999 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M9.6 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><rect x="6" y="-17" width="2.8" height="2.6" rx="0.3" fill="#263d53" stroke="#263d53" stroke-width="0"/></g><g transform="scale(1,-1)"><rect x="5.7" y="-9.5" width="3.4" height="10" rx="0.3" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="4.5" y="-16" width="6" height="11" rx="0.7" fill="#138c83" stroke="white" stroke-width="0.2"/><path d="M4.8 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M6.0 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M7.199999999999999 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M8.399999999999999 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M9.6 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><rect x="6" y="-17" width="2.8" height="2.6" rx="0.3" fill="#263d53" stroke="#263d53" stroke-width="0"/></g></g><text x="400" y="151" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">Upper end open</text><g transform="translate(540,375) scale(5.7)"><path d="M-5 -35 L-5 -20 Q0 -13 5 -20 L5 -35" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="21" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" fill="#263d53"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" transform="scale(1,-1)" fill="#263d53"/><rect x="-3" y="-4" width="6" height="8" rx="0" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="scale(1,1)"><rect x="5.7" y="-9.5" width="3.4" height="10" rx="0.3" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="4.5" y="-9" width="6" height="11" rx="0.7" fill="#138c83" stroke="white" stroke-width="0.2"/><path d="M4.8 -8.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M6.0 -8.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M7.199999999999999 -8.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M8.399999999999999 -8.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M9.6 -8.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><rect x="6" y="-17" width="2.8" height="2.6" rx="0.3" fill="#263d53" stroke="#263d53" stroke-width="0"/></g><g transform="scale(1,-1)"><rect x="5.7" y="-9.5" width="3.4" height="10" rx="0.3" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="4.5" y="-16" width="6" height="11" rx="0.7" fill="#138c83" stroke="white" stroke-width="0.2"/><path d="M4.8 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M6.0 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M7.199999999999999 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M8.399999999999999 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M9.6 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><rect x="6" y="-17" width="2.8" height="2.6" rx="0.3" fill="#263d53" stroke="#263d53" stroke-width="0"/></g></g><path d="M625 285 L625 330" fill="none" stroke="#cb7629" stroke-width="2" marker-end="url(#arrow)"/><text x="52" y="583" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">~44 × 22 × 10 mm • 5 printed parts proposed</text><text x="52" y="609" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Lower attachment stays closed; neither attached loop is twisted.</text><text x="832" y="151" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">Open / close by hand</text><text x="832" y="205" font-size="18" fill="#53677b" font-weight="normal" text-anchor="start">1  Turn the barrel several turns downward.</text><text x="832" y="241" font-size="18" fill="#53677b" font-weight="normal" text-anchor="start">2  Lift the loop through the exposed mouth.</text><text x="832" y="277" font-size="18" fill="#53677b" font-weight="normal" text-anchor="start">3  Turn upward until the nose is covered.</text><text x="832" y="348" font-size="20" fill="#203247" font-weight="bold" text-anchor="start">Why it resists a direct pull</text><text x="832" y="390" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">The barrel bridges the mouth and cups the nose.</text><text x="832" y="420" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">Coarse thread engagement prevents direct sliding.</text><text x="832" y="450" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">No hinge, spring or removable operating part.</text><text x="832" y="514" font-size="18" fill="#138c83" font-weight="bold" text-anchor="start">No loose operating pieces; no tools.</text><text x="832" y="555" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Repeated unscrewing is needed to uncover the gap.</text><text x="832" y="583" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Rubbing could still unwind it: test this physically.</text><rect x="28" y="670" width="760" height="480" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><rect x="808" y="670" width="764" height="480" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><text x="52" y="710" font-size="21" fill="#203247" font-weight="bold" text-anchor="start">Enlarged lock section — one end</text><rect x="152" y="750" width="44" height="50" rx="2" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="152" y="855" width="44" height="105" rx="2" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="126" y="775" width="96" height="150" rx="6" fill="#138c83" stroke="#138c83" stroke-width="0"/><rect x="141" y="775" width="66" height="90" rx="0" fill="white" stroke="white" stroke-width="0"/><rect x="147" y="865" width="54" height="60" rx="0" fill="white" stroke="white" stroke-width="0"/><rect x="152" y="775" width="44" height="25" rx="0" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="152" y="855" width="44" height="75" rx="0" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="135" y="950" width="78" height="15" rx="2" fill="#263d53" stroke="#263d53" stroke-width="0"/><path d="M147 863 l10 5 l-10 5 M201 863 l-10 5 l10 5" fill="#263d53"/><path d="M147 874 l10 5 l-10 5 M201 874 l-10 5 l10 5" fill="#263d53"/><path d="M147 885 l10 5 l-10 5 M201 885 l-10 5 l10 5" fill="#263d53"/><path d="M147 896 l10 5 l-10 5 M201 896 l-10 5 l10 5" fill="#263d53"/><path d="M147 907 l10 5 l-10 5 M201 907 l-10 5 l10 5" fill="#263d53"/><rect x="145" y="850" width="58" height="12" rx="1" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><path d="M242 810 L242 915" fill="none" stroke="#cb7629" stroke-width="2" marker-end="url(#arrow)"/><text x="272" y="775" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Nose seated inside cup</text><text x="272" y="798" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">(upper horn, fixed)</text><text x="272" y="849" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Printed stop tip</text><text x="272" y="872" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">installed during assembly</text><text x="272" y="920" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Coarse mating thread</text><text x="272" y="943" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">barrel turns AND travels</text><text x="52" y="1010" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">White center = cavity; barrel walls shown in section.</text><text x="52" y="1036" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Stop tip and base shoulder limit sleeve travel.</text><text x="52" y="1062" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Retracted barrel parks below the ~6 mm mouth.</text><text x="832" y="710" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">Parts, printing and remaining work</text><text x="832" y="758" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Body + 2 barrels + 2 printed stop tips = 5 parts.</text><text x="832" y="785" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Thread barrels onto stems; install stop tips afterward.</text><text x="832" y="812" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Base shoulders / tips trap each barrel for daily use.</text><text x="832" y="868" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Proposed print: body / covers / gates broad face down;</text><text x="832" y="895" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">coarse screws upright; barrels upright with open bore.</text><text x="832" y="922" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Separate assembly: no print-in-place joint to break free.</text><text x="832" y="949" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Target ~6 mm mouth; free horn ~3.2 × 4 mm section.</text><text x="832" y="976" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">0.4 mm nozzle / 0.2 mm layers assumed for later CAD.</text><text x="832" y="1030" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Still needed: loading path, travel, capture, tolerances,</text><text x="832" y="1057" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">hand clearance, shaking, twisting and wear tests.</text><text x="832" y="1084" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Two hands assumed. These locks do not self-close.</text><text x="38" y="1186" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Section is schematic and enlarged independently. Dimensions, fits, thread lead and assembly retention are not CAD- or print-qualified.</text></g></svg>
