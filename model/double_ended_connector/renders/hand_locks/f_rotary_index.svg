<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220">
<title>F  Rotary gate + index lock</title><desc>Hand operation • all connector components printed • no reliance on bending, spring return or friction-fit snaps</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cb7629"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#b7c4cf" stroke-width="1"/></pattern></defs>
<rect width="1600" height="1220" fill="#f2f5f9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="49" font-size="30" fill="#203247" font-weight="bold" text-anchor="start">F  Rotary gate + index lock</text><text x="38" y="81" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">Hand operation • all connector components printed • no reliance on bending, spring return or friction-fit snaps</text><rect x="28" y="110" width="760" height="540" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><rect x="808" y="110" width="764" height="540" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><text x="52" y="151" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">Both ends closed</text><g transform="translate(190,375) scale(5.7)"><path d="M-5 -35 L-5 -20 Q0 -13 5 -20 L5 -35" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="21" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" fill="#263d53"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" transform="scale(1,-1)" fill="#263d53"/><rect x="-3" y="-4" width="6" height="8" rx="0" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="scale(1,1)"><rect x="0.5" y="-8.5" width="11" height="10" rx="1.4" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="rotate(0,7.4,-6)"><rect x="5.8" y="-16" width="3.2" height="11.8" rx="0.4" fill="#138c83" stroke="white" stroke-width="0.2"/><rect x="5" y="-8" width="4.8" height="7.4" rx="1.3" fill="#138c83" stroke="white" stroke-width="0.2"/><circle cx="7.4" cy="-2.5" r=".85" fill="white"/></g><circle cx="7.4" cy="-6" r="1.1" fill="#263d53" stroke="white" stroke-width=".2"/><circle cx="7.4" cy="-2.5" r="1.9" fill="#cb7629" stroke="white" stroke-width=".2"/></g><g transform="scale(1,-1)"><rect x="0.5" y="-8.5" width="11" height="10" rx="1.4" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="rotate(0,7.4,-6)"><rect x="5.8" y="-16" width="3.2" height="11.8" rx="0.4" fill="#138c83" stroke="white" stroke-width="0.2"/><rect x="5" y="-8" width="4.8" height="7.4" rx="1.3" fill="#138c83" stroke="white" stroke-width="0.2"/><circle cx="7.4" cy="-2.5" r=".85" fill="white"/></g><circle cx="7.4" cy="-6" r="1.1" fill="#263d53" stroke="white" stroke-width=".2"/><circle cx="7.4" cy="-2.5" r="1.9" fill="#cb7629" stroke="white" stroke-width=".2"/></g></g><text x="400" y="151" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">Upper end open</text><g transform="translate(540,375) scale(5.7)"><path d="M-5 -35 L-5 -20 Q0 -13 5 -20 L5 -35" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="21" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" fill="#263d53"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" transform="scale(1,-1)" fill="#263d53"/><rect x="-3" y="-4" width="6" height="8" rx="0" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="scale(1,1)"><rect x="0.5" y="-8.5" width="11" height="10" rx="1.4" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="rotate(90,7.4,-6)"><rect x="5.8" y="-16" width="3.2" height="11.8" rx="0.4" fill="#138c83" stroke="white" stroke-width="0.2"/><rect x="5" y="-8" width="4.8" height="7.4" rx="1.3" fill="#138c83" stroke="white" stroke-width="0.2"/><circle cx="7.4" cy="-2.5" r=".85" fill="white"/></g><circle cx="7.4" cy="-6" r="1.1" fill="#263d53" stroke="white" stroke-width=".2"/><circle cx="7.4" cy="-2.5" r="1.9" fill="#cb7629" stroke="white" stroke-width=".2"/></g><g transform="scale(1,-1)"><rect x="0.5" y="-8.5" width="11" height="10" rx="1.4" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="rotate(0,7.4,-6)"><rect x="5.8" y="-16" width="3.2" height="11.8" rx="0.4" fill="#138c83" stroke="white" stroke-width="0.2"/><rect x="5" y="-8" width="4.8" height="7.4" rx="1.3" fill="#138c83" stroke="white" stroke-width="0.2"/><circle cx="7.4" cy="-2.5" r=".85" fill="white"/></g><circle cx="7.4" cy="-6" r="1.1" fill="#263d53" stroke="white" stroke-width=".2"/><circle cx="7.4" cy="-2.5" r="1.9" fill="#cb7629" stroke="white" stroke-width=".2"/></g></g><path d="M610 280 Q651 280 651 328" fill="none" stroke="#cb7629" stroke-width="2" marker-end="url(#arrow)"/><text x="52" y="583" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">~46 × 24 × 11 mm • 8 printed parts proposed</text><text x="52" y="609" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Lower attachment stays closed; neither attached loop is twisted.</text><text x="832" y="151" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">Open / close by hand</text><text x="832" y="205" font-size="18" fill="#53677b" font-weight="normal" text-anchor="start">1  Back out the captive thumb lock ~2 turns.</text><text x="832" y="241" font-size="18" fill="#53677b" font-weight="normal" text-anchor="start">2  Rotate the gate 90° to uncover the mouth.</text><text x="832" y="277" font-size="18" fill="#53677b" font-weight="normal" text-anchor="start">3  Rotate closed; advance the lock into its hole.</text><text x="832" y="348" font-size="20" fill="#203247" font-weight="bold" text-anchor="start">Why it resists a direct pull</text><text x="832" y="390" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">A rigid sector sweeps across the opening.</text><text x="832" y="420" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">A screw tip enters a hole in that sector.</text><text x="832" y="450" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">The tip blocks rotation, rather than clamping.</text><text x="832" y="514" font-size="18" fill="#138c83" font-weight="bold" text-anchor="start">No loose operating pieces; no tools.</text><text x="832" y="555" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Two deliberate controls; wider cheek housing.</text><text x="832" y="583" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Both lock engagement and wear need a test.</text><rect x="28" y="670" width="760" height="480" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><rect x="808" y="670" width="764" height="480" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><text x="52" y="710" font-size="21" fill="#203247" font-weight="bold" text-anchor="start">Enlarged lock section — one end</text><rect x="107" y="835" width="242" height="64" rx="5" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="126" y="780" width="206" height="48" rx="4" fill="#138c83" stroke="#138c83" stroke-width="0"/><rect x="146" y="835" width="47" height="42" rx="1" fill="white" stroke="white" stroke-width="0"/><rect x="150" y="737" width="39" height="131" rx="2" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><rect x="127" y="722" width="85" height="25" rx="5" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><rect x="257" y="767" width="24" height="95" rx="1" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="107" y="751" width="115" height="20" rx="1" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="150" y="751" width="39" height="20" rx="0" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><path d="M150 754 l39 5" stroke="white" stroke-width="2"/><path d="M150 761 l39 5" stroke="white" stroke-width="2"/><path d="M224 757 L224 728" fill="none" stroke="#cb7629" stroke-width="2" marker-end="url(#arrow)"/><text x="367" y="755" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Captured screw head</text><text x="367" y="778" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">hand-turn to lift tip</text><text x="367" y="818" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Tip crosses rotor hole</text><text x="367" y="841" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">blocks rotation</text><text x="367" y="887" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Rigid shoulder pivot</text><text x="367" y="910" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">rotor between cheeks</text><text x="52" y="963" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Section normal to face; white is running clearance.</text><text x="52" y="989" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Screw tip crosses a rotor hole; it does not clamp.</text><text x="52" y="1015" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">A clearance pocket below receives the advanced tip.</text><text x="52" y="1041" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Withdraw tip first, then rotate gate clear of mouth.</text><text x="832" y="710" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">Parts, printing and remaining work</text><text x="832" y="758" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Body + cover + 2 rotors + 2 thumb locks</text><text x="832" y="785" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">+ 2 printed cover screws = 8 parts.</text><text x="832" y="812" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Trap rotors and reduced-neck locks between cheeks.</text><text x="832" y="868" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Proposed print: body / covers / gates broad face down;</text><text x="832" y="895" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">coarse screws upright; barrels upright with open bore.</text><text x="832" y="922" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Separate assembly: no print-in-place joint to break free.</text><text x="832" y="949" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Target ~6 mm mouth; free horn ~3.2 × 4 mm section.</text><text x="832" y="976" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">0.4 mm nozzle / 0.2 mm layers assumed for later CAD.</text><text x="832" y="1030" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Still needed: loading path, travel, capture, tolerances,</text><text x="832" y="1057" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">hand clearance, shaking, twisting and wear tests.</text><text x="832" y="1084" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Two hands assumed. These locks do not self-close.</text><text x="38" y="1186" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Section is schematic and enlarged independently. Dimensions, fits, thread lead and assembly retention are not CAD- or print-qualified.</text></g></svg>
