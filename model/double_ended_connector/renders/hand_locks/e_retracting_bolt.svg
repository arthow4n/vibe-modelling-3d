<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220">
<title>E  Captive screw-driven bolt</title><desc>Hand operation • all connector components printed • no reliance on bending, spring return or friction-fit snaps</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cb7629"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#b7c4cf" stroke-width="1"/></pattern></defs>
<rect width="1600" height="1220" fill="#f2f5f9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="49" font-size="30" fill="#203247" font-weight="bold" text-anchor="start">E  Captive screw-driven bolt</text><text x="38" y="81" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">Hand operation • all connector components printed • no reliance on bending, spring return or friction-fit snaps</text><rect x="28" y="110" width="760" height="540" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><rect x="808" y="110" width="764" height="540" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><text x="52" y="151" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">Both ends closed</text><g transform="translate(190,375) scale(5.7)"><path d="M-5 -35 L-5 -20 Q0 -13 5 -20 L5 -35" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="21" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" fill="#263d53"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" transform="scale(1,-1)" fill="#263d53"/><rect x="-3" y="-4" width="6" height="8" rx="0" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="scale(1,1)"><rect x="3" y="-7" width="9.5" height="10" rx="1" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="5.8" y="-16" width="3.2" height="12" rx="0.3" fill="#138c83" stroke="white" stroke-width="0.2"/><rect x="4.2" y="-17" width="6.5" height="3" rx="0.4" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="3.8" y="-3" width="7.5" height="2.8" rx="0.5" fill="#cb7629" stroke="white" stroke-width="0.2"/><path d="M4.6 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M5.8 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M7 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M8.2 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M9.4 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M10.6 -2.7 v2.1" stroke="white" stroke-width=".25"/></g><g transform="scale(1,-1)"><rect x="3" y="-7" width="9.5" height="10" rx="1" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="5.8" y="-16" width="3.2" height="12" rx="0.3" fill="#138c83" stroke="white" stroke-width="0.2"/><rect x="4.2" y="-17" width="6.5" height="3" rx="0.4" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="3.8" y="-3" width="7.5" height="2.8" rx="0.5" fill="#cb7629" stroke="white" stroke-width="0.2"/><path d="M4.6 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M5.8 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M7 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M8.2 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M9.4 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M10.6 -2.7 v2.1" stroke="white" stroke-width=".25"/></g></g><text x="400" y="151" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">Upper end open</text><g transform="translate(540,375) scale(5.7)"><path d="M-5 -35 L-5 -20 Q0 -13 5 -20 L5 -35" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="21" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" fill="#263d53"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" transform="scale(1,-1)" fill="#263d53"/><rect x="-3" y="-4" width="6" height="8" rx="0" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="scale(1,1)"><rect x="3" y="-7" width="9.5" height="10" rx="1" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="5.8" y="-9" width="3.2" height="12" rx="0.3" fill="#138c83" stroke="white" stroke-width="0.2"/><rect x="4.2" y="-17" width="6.5" height="3" rx="0.4" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="3.8" y="-3" width="7.5" height="2.8" rx="0.5" fill="#cb7629" stroke="white" stroke-width="0.2"/><path d="M4.6 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M5.8 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M7 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M8.2 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M9.4 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M10.6 -2.7 v2.1" stroke="white" stroke-width=".25"/></g><g transform="scale(1,-1)"><rect x="3" y="-7" width="9.5" height="10" rx="1" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="5.8" y="-16" width="3.2" height="12" rx="0.3" fill="#138c83" stroke="white" stroke-width="0.2"/><rect x="4.2" y="-17" width="6.5" height="3" rx="0.4" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="3.8" y="-3" width="7.5" height="2.8" rx="0.5" fill="#cb7629" stroke="white" stroke-width="0.2"/><path d="M4.6 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M5.8 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M7 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M8.2 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M9.4 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M10.6 -2.7 v2.1" stroke="white" stroke-width=".25"/></g></g><path d="M625 285 L625 330" fill="none" stroke="#cb7629" stroke-width="2" marker-end="url(#arrow)"/><text x="52" y="583" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">~48 × 24 × 11 mm • 8 printed parts proposed</text><text x="52" y="609" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Lower attachment stays closed; neither attached loop is twisted.</text><text x="832" y="151" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">Open / close by hand</text><text x="832" y="205" font-size="18" fill="#53677b" font-weight="normal" text-anchor="start">1  Roll the recessed thumbwheel to retract.</text><text x="832" y="241" font-size="18" fill="#53677b" font-weight="normal" text-anchor="start">2  Pass the loop through the clear mouth.</text><text x="832" y="277" font-size="18" fill="#53677b" font-weight="normal" text-anchor="start">3  Reverse until the bolt seats in its socket.</text><text x="832" y="348" font-size="20" fill="#203247" font-weight="bold" text-anchor="start">Why it resists a direct pull</text><text x="832" y="390" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">A guided rigid bolt bridges the mouth.</text><text x="832" y="420" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">A captive lead screw drives it into a receiver.</text><text x="832" y="450" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">The guide prevents bolt rotation; no snap catch.</text><text x="832" y="514" font-size="18" fill="#138c83" font-weight="bold" text-anchor="start">No loose operating pieces; no tools.</text><text x="832" y="555" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">More turns and a longer central housing.</text><text x="832" y="583" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Thread back-drive and grit sensitivity need a test.</text><rect x="28" y="670" width="760" height="480" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><rect x="808" y="670" width="764" height="480" rx="10" fill="white" stroke="#d7e0e8" stroke-width="1"/><text x="52" y="710" font-size="21" fill="#203247" font-weight="bold" text-anchor="start">Enlarged lock section — one end</text><rect x="124" y="758" width="100" height="224" rx="7" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="143" y="750" width="62" height="210" rx="0" fill="white" stroke="white" stroke-width="0"/><rect x="150" y="750" width="48" height="108" rx="3" fill="#138c83" stroke="#138c83" stroke-width="0"/><rect x="165" y="814" width="18" height="118" rx="1" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><path d="M162 820 l24 7" stroke="white" stroke-width="2"/><path d="M162 830 l24 7" stroke="white" stroke-width="2"/><path d="M162 840 l24 7" stroke="white" stroke-width="2"/><path d="M162 850 l24 7" stroke="white" stroke-width="2"/><path d="M162 860 l24 7" stroke="white" stroke-width="2"/><path d="M162 870 l24 7" stroke="white" stroke-width="2"/><rect x="120" y="930" width="108" height="28" rx="5" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><rect x="161" y="957" width="26" height="21" rx="1" fill="#cb7629" stroke="#cb7629" stroke-width="0"/><path d="M242 770 L242 844" fill="none" stroke="#cb7629" stroke-width="2" marker-end="url(#arrow)"/><text x="272" y="775" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Flat-sided guided bolt</text><text x="272" y="798" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">cannot turn with screw</text><text x="272" y="854" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Thread inside bolt</text><text x="272" y="877" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">translates wheel rotation</text><text x="272" y="938" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Thumbwheel / shoulder</text><text x="272" y="961" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">trapped in split bearing</text><text x="52" y="1010" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">White = running clearance; orange screw rotates in place.</text><text x="52" y="1036" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Bolt seats ~2 mm into the opposite horn when closed.</text><text x="52" y="1062" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Captive stops prevent winding bolt out during use.</text><text x="832" y="710" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">Parts, printing and remaining work</text><text x="832" y="758" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Body + cover + 2 bolts + 2 lead screws</text><text x="832" y="785" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">+ 2 printed cover screws = 8 parts.</text><text x="832" y="812" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Fit bolts and screw shoulders, then close bearing cover.</text><text x="832" y="868" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Proposed print: body / covers / gates broad face down;</text><text x="832" y="895" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">coarse screws upright; barrels upright with open bore.</text><text x="832" y="922" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Separate assembly: no print-in-place joint to break free.</text><text x="832" y="949" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Target ~6 mm mouth; free horn ~3.2 × 4 mm section.</text><text x="832" y="976" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">0.4 mm nozzle / 0.2 mm layers assumed for later CAD.</text><text x="832" y="1030" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Still needed: loading path, travel, capture, tolerances,</text><text x="832" y="1057" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">hand clearance, shaking, twisting and wear tests.</text><text x="832" y="1084" font-size="16" fill="#53677b" font-weight="normal" text-anchor="start">Two hands assumed. These locks do not self-close.</text><text x="38" y="1186" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Section is schematic and enlarged independently. Dimensions, fits, thread lead and assembly retention are not CAD- or print-qualified.</text></g></svg>
