<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
<title>Hand-openable locks — every connector part printed</title><desc>R2 SVG concepts • PLA or PETG • either end opens independently • no metal, springs, snap flexure or tools</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#cb7629"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#b7c4cf" stroke-width="1"/></pattern></defs>
<rect width="1600" height="1040" fill="#f2f5f9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="38" y="49" font-size="30" fill="#203247" font-weight="bold" text-anchor="start">Hand-openable locks — every connector part printed</text><text x="38" y="81" font-size="17" fill="#53677b" font-weight="normal" text-anchor="start">R2 SVG concepts • PLA or PETG • either end opens independently • no metal, springs, snap flexure or tools</text><rect x="28" y="110" width="504" height="820" rx="10" fill="white" stroke="#138c83" stroke-width="2"/><text x="50" y="150" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">D  Threaded barrel gate</text><text x="50" y="179" font-size="14" fill="#138c83" font-weight="bold" text-anchor="start">Recommended: simplest daily operation</text><g transform="translate(263,360) scale(5)"><path d="M-5 -35 L-5 -20 Q0 -13 5 -20 L5 -35" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="21" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" fill="#263d53"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" transform="scale(1,-1)" fill="#263d53"/><rect x="-3" y="-4" width="6" height="8" rx="0" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="scale(1,1)"><rect x="5.7" y="-9.5" width="3.4" height="10" rx="0.3" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="4.5" y="-16" width="6" height="11" rx="0.7" fill="#138c83" stroke="white" stroke-width="0.2"/><path d="M4.8 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M6.0 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M7.199999999999999 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M8.399999999999999 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M9.6 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><rect x="6" y="-17" width="2.8" height="2.6" rx="0.3" fill="#263d53" stroke="#263d53" stroke-width="0"/></g><g transform="scale(1,-1)"><rect x="5.7" y="-9.5" width="3.4" height="10" rx="0.3" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="4.5" y="-16" width="6" height="11" rx="0.7" fill="#138c83" stroke="white" stroke-width="0.2"/><path d="M4.8 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M6.0 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M7.199999999999999 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M8.399999999999999 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><path d="M9.6 -15.5 l-0.6 9.5" stroke="white" stroke-width=".22"/><rect x="6" y="-17" width="2.8" height="2.6" rx="0.3" fill="#263d53" stroke="#263d53" stroke-width="0"/></g></g><text x="280" y="550" font-size="14" fill="#203247" font-weight="bold" text-anchor="middle">~44 × 22 × 10 mm  •  5 printed parts proposed</text><text x="50" y="598" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">1  Turn the barrel several turns downward.</text><text x="50" y="626" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">2  Lift the loop through the exposed mouth.</text><text x="50" y="654" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">3  Turn upward until the nose is covered.</text><text x="50" y="710" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">The barrel bridges the mouth and cups the nose.</text><text x="50" y="737" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Coarse thread engagement prevents direct sliding.</text><text x="50" y="764" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">No hinge, spring or removable operating part.</text><text x="50" y="832" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">Repeated unscrewing is needed to uncover the gap.</text><text x="50" y="858" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">Rubbing could still unwind it: test this physically.</text><rect x="548" y="110" width="504" height="820" rx="10" fill="white" stroke="#d7e0e8" stroke-width="2"/><text x="570" y="150" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">E  Captive screw-driven bolt</text><text x="570" y="179" font-size="14" fill="#138c83" font-weight="bold" text-anchor="start">Positive translation; everything stays attached</text><g transform="translate(783,360) scale(5)"><path d="M-5 -35 L-5 -20 Q0 -13 5 -20 L5 -35" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="21" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" fill="#263d53"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" transform="scale(1,-1)" fill="#263d53"/><rect x="-3" y="-4" width="6" height="8" rx="0" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="scale(1,1)"><rect x="3" y="-7" width="9.5" height="10" rx="1" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="5.8" y="-16" width="3.2" height="12" rx="0.3" fill="#138c83" stroke="white" stroke-width="0.2"/><rect x="4.2" y="-17" width="6.5" height="3" rx="0.4" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="3.8" y="-3" width="7.5" height="2.8" rx="0.5" fill="#cb7629" stroke="white" stroke-width="0.2"/><path d="M4.6 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M5.8 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M7 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M8.2 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M9.4 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M10.6 -2.7 v2.1" stroke="white" stroke-width=".25"/></g><g transform="scale(1,-1)"><rect x="3" y="-7" width="9.5" height="10" rx="1" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="5.8" y="-16" width="3.2" height="12" rx="0.3" fill="#138c83" stroke="white" stroke-width="0.2"/><rect x="4.2" y="-17" width="6.5" height="3" rx="0.4" fill="#263d53" stroke="#263d53" stroke-width="0"/><rect x="3.8" y="-3" width="7.5" height="2.8" rx="0.5" fill="#cb7629" stroke="white" stroke-width="0.2"/><path d="M4.6 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M5.8 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M7 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M8.2 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M9.4 -2.7 v2.1" stroke="white" stroke-width=".25"/><path d="M10.6 -2.7 v2.1" stroke="white" stroke-width=".25"/></g></g><text x="800" y="550" font-size="14" fill="#203247" font-weight="bold" text-anchor="middle">~48 × 24 × 11 mm  •  8 printed parts proposed</text><text x="570" y="598" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">1  Roll the recessed thumbwheel to retract.</text><text x="570" y="626" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">2  Pass the loop through the clear mouth.</text><text x="570" y="654" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">3  Reverse until the bolt seats in its socket.</text><text x="570" y="710" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">A guided rigid bolt bridges the mouth.</text><text x="570" y="737" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">A captive lead screw drives it into a receiver.</text><text x="570" y="764" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">The guide prevents bolt rotation; no snap catch.</text><text x="570" y="832" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">More turns and a longer central housing.</text><text x="570" y="858" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">Thread back-drive and grit sensitivity need a test.</text><rect x="1068" y="110" width="504" height="820" rx="10" fill="white" stroke="#d7e0e8" stroke-width="2"/><text x="1090" y="150" font-size="22" fill="#203247" font-weight="bold" text-anchor="start">F  Rotary gate + index lock</text><text x="1090" y="179" font-size="14" fill="#138c83" font-weight="bold" text-anchor="start">Two different motions to release</text><g transform="translate(1303,360) scale(5)"><path d="M-5 -35 L-5 -20 Q0 -13 5 -20 L5 -35" fill="none" stroke="#aebbc7" stroke-width="2.6"/><ellipse cx="0" cy="21" rx="5" ry="10" fill="none" stroke="#aebbc7" stroke-width="2"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" fill="#263d53"/><path d="M9 -14 Q9 -20 3 -20 H-3 Q-9 -20 -9 -14 V-8 Q-9 -2 -3 -2 H3 Q9 -2 9 -8 H5.8 V-8.4 Q5.8 -5.2 2.6 -5.2 H-2.6 Q-5.8 -5.2 -5.8 -8.4 V-13.6 Q-5.8 -16.8 -2.6 -16.8 H2.6 Q5.8 -16.8 5.8 -13.6 V-14 Z" transform="scale(1,-1)" fill="#263d53"/><rect x="-3" y="-4" width="6" height="8" rx="0" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="scale(1,1)"><rect x="0.5" y="-8.5" width="11" height="10" rx="1.4" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="rotate(0,7.4,-6)"><rect x="5.8" y="-16" width="3.2" height="11.8" rx="0.4" fill="#138c83" stroke="white" stroke-width="0.2"/><rect x="5" y="-8" width="4.8" height="7.4" rx="1.3" fill="#138c83" stroke="white" stroke-width="0.2"/><circle cx="7.4" cy="-2.5" r=".85" fill="white"/></g><circle cx="7.4" cy="-6" r="1.1" fill="#263d53" stroke="white" stroke-width=".2"/><circle cx="7.4" cy="-2.5" r="1.9" fill="#cb7629" stroke="white" stroke-width=".2"/></g><g transform="scale(1,-1)"><rect x="0.5" y="-8.5" width="11" height="10" rx="1.4" fill="#263d53" stroke="#263d53" stroke-width="0"/><g transform="rotate(0,7.4,-6)"><rect x="5.8" y="-16" width="3.2" height="11.8" rx="0.4" fill="#138c83" stroke="white" stroke-width="0.2"/><rect x="5" y="-8" width="4.8" height="7.4" rx="1.3" fill="#138c83" stroke="white" stroke-width="0.2"/><circle cx="7.4" cy="-2.5" r=".85" fill="white"/></g><circle cx="7.4" cy="-6" r="1.1" fill="#263d53" stroke="white" stroke-width=".2"/><circle cx="7.4" cy="-2.5" r="1.9" fill="#cb7629" stroke="white" stroke-width=".2"/></g></g><text x="1320" y="550" font-size="14" fill="#203247" font-weight="bold" text-anchor="middle">~46 × 24 × 11 mm  •  8 printed parts proposed</text><text x="1090" y="598" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">1  Back out the captive thumb lock ~2 turns.</text><text x="1090" y="626" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">2  Rotate the gate 90° to uncover the mouth.</text><text x="1090" y="654" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">3  Rotate closed; advance the lock into its hole.</text><text x="1090" y="710" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">A rigid sector sweeps across the opening.</text><text x="1090" y="737" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">A screw tip enters a hole in that sector.</text><text x="1090" y="764" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">The tip blocks rotation, rather than clamping.</text><text x="1090" y="832" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">Two deliberate controls; wider cheek housing.</text><text x="1090" y="858" font-size="14" fill="#53677b" font-weight="normal" text-anchor="start">Both lock engagement and wear need a test.</text><text x="38" y="967" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Navy = body; teal = gate; orange = hand control. All three are printed in the same PLA or PETG. Gray = existing attachments.</text><text x="38" y="997" font-size="15" fill="#53677b" font-weight="normal" text-anchor="start">Schematic concepts, not print files. No shake-resistance, force or load rating has been established; see the detailed lock sections.</text></g></svg>
